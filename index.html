  h += '<p class="tiny muted" style="margin:10px 0 0">The book recommends at least 1 XP at the end of a session, plus nominations the table agrees on: ' +
    'play of the game, best role play, best scene maker.</p></div>';
  return h;
}

/* ---------- session tracker ------------------------------------------------ */
function viewPlay(c){
  const ed = canEditChar(c);
  const pen = dmgPenalty(c);
  const owed = debtThisMonth(c), earned = num(c.goodwill,0);
  const standing = monthlyRent(c);
  let h = '<div class="banner"><span>Session tracker</span></div>';

  /* actions available */
  h += '<div class="card"><h2 class="sec">Your turn</h2><div class="row">' +
    '<span class="chip hi">1 standard</span><span class="chip hi">1 move</span>' +
    '<span class="chip hi">' + freeActions(c) + ' free</span>' +
    '<span class="tiny muted">Free actions equal the higher of your Intelligence or Dexterity modifier, minimum 1.</span></div>' +
    '<p class="tiny muted" style="margin:8px 0 0">Expressions default to a free action. Conditions you took can push one to standard, full round or triggered.</p></div>';

  /* damage */
  h += '<div class="card" style="margin-top:12px"><h2 class="sec">Damage</h2>';
  [["bashing","Bashing",6],["stun","Stun",6],["lethal","Lethal",3]].forEach(([k, label, max]) => {
    const v = num(c.dmg[k],0);
    h += '<div style="padding:8px 0;border-bottom:1px solid var(--rule)">' +
      '<div class="row"><span style="font-family:var(--f-cond);font-weight:700;letter-spacing:.06em;text-transform:uppercase;min-width:74px">' + label + '</span>' +
      '<span class="track">' + Array.from({length:max}, (_,i) =>
        '<button class="box ' + (k === "lethal" ? "lethal " : "") + (i < v ? "on" : "") + '" data-act="dmg" data-k="' + k + '" data-n="' + (i+1) + '" data-c="' + c.id + '" ' +
        (ed?"":"disabled") + ' aria-label="' + label + ' level ' + (i+1) + '"></button>').join("") + '</span>' +
      (v ? '<button class="btn ghost sm" data-act="dmg" data-k="' + k + '" data-n="0" data-c="' + c.id + '">Clear</button>' : '') + '</div>' +
      (v ? '<p class="tiny" style="margin:5px 0 0;color:' + (k === "lethal" ? "var(--red)" : "var(--ink-2)") + '">' +
        esc(k === "lethal" ? DMG_LETHAL[Math.min(v,3)-1] : DMG_BASH[Math.min(v,6)-1]) + '</p>' : '') +
      '<p class="tiny muted" style="margin:4px 0 0">' + esc(HEAL_NOTES[k]) + '</p></div>';
  });
  h += '<p class="tiny" style="margin:9px 0 0">' + (pen ? 'Currently <b>' + pen + '</b> to every combat and saving roll, already applied everywhere in the app.' : 'No penalties right now.') + '</p>' +
    '<p class="tiny muted" style="margin:5px 0 0">Lethal damage can\'t be soaked unless you\'re using an expression or wearing armor, and it incapacitates immediately.</p></div>';

  /* rent */
  const ob = overBudget(c);
  h += '<div class="card" style="margin-top:12px"><h2 class="sec">Rent</h2><div class="grid g3">' +
    '<div><h3 class="sub">Owed this month</h3><p class="bigdebt" style="color:' + (ob.over ? "var(--red)" : "var(--ink)") + '">' + nf(owed) + '</p></div>' +
    '<div><h3 class="sub">Goodwill earned</h3><div class="row">' + stepper("goodwill", "goodwill", earned, ed, c.id, 0, null) + '</div>' +
      '<div class="row" style="margin-top:6px"><input type="number" id="gwamt" data-fk="gwamt" placeholder="Amount" style="max-width:90px">' +
      '<button class="btn sm" data-act="addgoodwill" data-c="' + c.id + '">Add a gig</button></div></div>' +
    '<div><h3 class="sub">Standing rent</h3><div class="row">' +
      '<input type="number" data-fk="srent" data-bind="standingRent" data-c="' + c.id + '" ' + (ed?"":"disabled") +
      ' value="' + num(c.standingRent,0) + '" style="max-width:90px"></div>' +
      '<p class="tiny muted" style="margin:5px 0 0">' + nf(standing) + ' total, including traded expressions.</p></div>' +
    '</div>' +
    '<div class="meter" style="margin-top:10px"><i class="' + (earned >= owed ? "ok" : "") + '" style="width:' +
      (owed > 0 ? clamp(Math.round(earned/owed*100),0,100) : 100) + '%"></i></div>' +
    '<p class="tiny" style="margin:6px 0 0">' + (earned >= owed
      ? '<span style="color:var(--green)">Rent is covered.</span>'
      : '<span style="color:var(--red)">' + nf(owed - earned) + ' short.</span> Goodwill comes from gigs you were specifically asked to do. Badwill counts.') + '</p></div>';

  /* campaign budget — separate from the rent/goodwill comparison above:
     this checks the same "owed" total against a single number the GM sets
     for the whole table, rather than what you've personally earned. */
  h += '<div class="card" style="margin-top:12px;' + (ob.over ? "border-color:var(--red)" : "") + '"><h2 class="sec">Campaign budget</h2>';
  if(!ob.set){
    h += '<p class="tiny muted" style="margin:0">Your GM hasn\'t set a campaign-wide goodwill budget yet. ' +
      'Once they do, from Campaign Settings, your debt this month will be checked against it here and turn red if you go over.</p>';
  } else {
    h += '<div class="grid g3">' +
      '<div><h3 class="sub">Budget</h3><p class="bigdebt" style="color:var(--ink)">' + nf(ob.budget) + '</p>' +
      '<p class="tiny muted" style="margin:2px 0 0">Set by your GM · everyone in the campaign is compared against this same number.</p></div>' +
      '<div><h3 class="sub">Your debt this month</h3><p class="bigdebt" style="color:' + (ob.over ? "var(--red)" : "var(--ink)") + '">' + nf(ob.owed) + '</p></div>' +
      '<div><h3 class="sub">' + (ob.over ? "Over by" : "Room left") + '</h3><p class="bigdebt" style="color:' + (ob.over ? "var(--red)" : "var(--green)") + '">' +
        (ob.over ? nf(ob.diff) : nf(ob.budget - ob.owed)) + '</p></div>' +
      '</div>' +
      '<div class="meter" style="margin-top:10px"><i class="' + (ob.over ? "" : "ok") + '" style="width:' + clamp(Math.round(ob.owed/ob.budget*100),0,100) + '%"></i></div>' +
      '<p class="tiny" style="margin:6px 0 0">' + (ob.over
        ? '<span style="color:var(--red)">You\'re over the campaign budget.</span> Your GM can see this on their dashboard too.'
        : '<span style="color:var(--green)">Within budget.</span>') + '</p>';
  }
  h += '</div>';

  /* debt log */
  h += '<div class="card" style="margin-top:12px"><h2 class="sec">Debt spent</h2>';
  if(ed && c.expressions.length){
    h += '<div class="row" style="margin-bottom:10px"><select id="usexpr" style="flex:1">' +
      c.expressions.map(e => '<option value="' + e.id + '">' + esc(e.name || "Untitled") + ' — ' +
        (e.tradeoff ? computeDebt(e).activation + " to activate" : computeDebt(e).final + " debt") + '</option>').join("") +
      '</select><button class="btn primary sm" data-act="useexpr" data-c="' + c.id + '">Use it</button></div>';
  }
  if(!(c.debtLog||[]).length) h += '<p class="tiny muted" style="margin:0">Nothing spent this month.</p>';
  else {
    h += '<div class="ledger">' + c.debtLog.slice().reverse().map((l, ri) =>
      '<div class="li"><span>' + esc(l.note) + ' <span class="tiny muted">' + new Date(l.at).toLocaleString() + '</span></span>' +
      '<span>' + nf(num(l.amount,0)) + '</span></div>').join("") + '</div>';
    if(ed) h += '<div class="row" style="margin-top:10px"><button class="btn ghost sm" data-act="newmonth" data-c="' + c.id + '">Start a new month</button>' +
      '<span class="tiny muted">Clears the log and the goodwill, keeps standing rent.</span></div>';
  }
  h += '<p class="tiny muted" style="margin:9px 0 0">If a single fight costs you more than 25% of the gig\'s goodwill, the GM may enforce the spending limit: ' +
    'contested d20 rolls, and on a loss you make a DC 10 luck roll every time you reach for an expression.</p></div>';

  return h;
}

/* ---------- GM approvals --------------------------------------------------- */
function pendingApprovals(){
  const out = [];
  S.chars.forEach(c => (c.expressions||[]).forEach(e => { if(e.status === "pending") out.push({c, e}); }));
  return out;
}
function viewApprovals(){
  if(!isGM()) return '<div class="empty"><p>Only the GM sees this.</p></div>';
  const pend = pendingApprovals();
  let h = '<div class="banner"><span>Approvals</span></div>';
  if(!pend.length) h += '<div class="empty"><p>Nothing waiting. The crew is either well behaved or up to something.</p></div>';
  pend.forEach(p => {
    const d = computeDebt(p.e);
    const overProf = p.e.prof > S.campaign.prof;
    const overXp = xpAvailable(p.c) < 0;
    const overSlot = slotsUsed(p.c) > slotsTotal(p.c);
    h += '<div class="card" style="margin-bottom:12px">' +
      '<div class="row"><b style="font-family:var(--f-display);font-size:17px;font-weight:400">' + esc(p.e.name || "Untitled") + '</b>' +
      '<span class="pill p' + p.e.prof + '">P' + p.e.prof + '</span>' +
      '<span class="tiny muted">' + esc(p.c.name || "Unnamed") + ' · ' + esc(p.e.power) + '</span>' +
      '<span class="right"><b style="color:var(--red);font-size:18px">' + nf(d.final) + '</b> <span class="tiny muted">debt</span></span></div>';
    if(overProf || overXp || overSlot){
      h += '<div style="margin:8px 0;padding:7px 10px;background:var(--gold-wash);border-radius:3px" class="tiny">' +
        (overProf ? '<div>Proficiency ' + p.e.prof + ' in a proficiency ' + S.campaign.prof + ' campaign.</div>' : '') +
        (overXp ? '<div>This character is ' + Math.abs(xpAvailable(p.c)) + ' XP over budget.</div>' : '') +
        (overSlot ? '<div>Using ' + slotsUsed(p.c) + ' of ' + slotsTotal(p.c) + ' slots.</div>' : '') + '</div>';
    }
    h += '<p class="hand" style="margin:6px 0">' + esc(p.e.desc || "No description given.") + '</p>' +
      '<div class="row tiny muted" style="gap:10px;margin-bottom:7px">' +
      '<span>' + ACTIONS[actionOf(p.e)] + ' action</span>' +
      '<span>' + esc((RANGES.find(x=>x.k===p.e.range)||RANGES[0]).n) + '</span>' +
      (p.e.tradeoff ? '<span>Traded — ' + nf(d.monthly) + ' monthly, ' + nf(d.activation) + ' activation</span>' : '') +
      '</div>' + condSummary(p.e) +
      '<details style="margin-top:9px"><summary class="tiny" style="cursor:pointer;color:var(--ink-2)">Show the maths</summary>' +
      '<div class="ledger" style="margin-top:7px">' + d.lines.map(l =>
        '<div class="li"><span>' + esc(l[0]) + '</span><span>' + (l[1]>=0?"+":"") + nf(l[1]) + '</span></div>').join("") +
      '<div class="li sum"><span>Final</span><span>' + nf(d.final) + '</span></div></div></details>' +
      '<div class="row" style="margin-top:11px">' +
      '<input type="text" id="gmn_' + p.e.id + '" data-fk="gmn_' + p.e.id + '" placeholder="Note back to the player" style="flex:1" value="' + esc(p.e.gmNote||"") + '">' +
      '<button class="btn primary sm" data-act="approve" data-c="' + p.c.id + '" data-e="' + p.e.id + '">Approve</button>' +
      '<button class="btn sm danger" data-act="reject" data-c="' + p.c.id + '" data-e="' + p.e.id + '">Request changes</button>' +
      '</div></div>';
  });
  return h;
}

  /* left rail */
  h += '<div>';

  h += '<h2 class="sec" style="margin-top:12px">Saves</h2><table class="t"><tbody>' +

      (k.k === "defense" ? combatTotal(c,k.k) : sign(combatTotal(c,k.k))) + '</b></td></tr>').join("") + '</tbody></table>';
  h += '<h2 class="sec" style="margin-top:12px">Damage</h2>';
  [["bashing","Bashing",6],["stun","Stun",6],["lethal","Lethal",3]].forEach(([k,l,mx]) => {
    h += '<div class="row" style="margin-bottom:5px"><span class="tiny" style="min-width:56px">' + l + '</span><span class="track">' +
      Array.from({length:mx}, (_,i) => '<span class="box ' + (k==="lethal"?"lethal ":"") + (i < num(c.dmg[k],0) ? "on" : "") + '" style="cursor:default"></span>').join("") +
      '</span></div>';
  });
  h += '<h2 class="sec" style="margin-top:12px">Backgrounds</h2><table class="t"><tbody>' +
    '<tr><td>Resources</td><td class="num"><b>' + num(c.bg.resources,0) + '</b></td></tr>' +
    '<tr><td>Reputation</td><td class="num"><b>' + num(c.bg.reputation,0) + '</b></td></tr>' +
    '<tr><td>Contacts</td><td class="num"><b>' + c.contacts.length + '</b></td></tr></tbody></table>';
  if(c.contacts.length) h += '<p class="tiny muted" style="margin:5px 0 0">' + c.contacts.map(x => esc(x.name||"—")).join(", ") + '</p>';
  h += '</div>';

  /* right: expressions */
  h += '<div><h2 class="sec">Expressions</h2>';
  if(!c.expressions.length) h += '<p class="tiny muted">None.</p>';
  c.expressions.forEach(e => {
    const d = computeDebt(e);
    h += '<div style="border:1px solid var(--rule);border-radius:3px;padding:9px 11px;margin-bottom:8px;background:var(--paper)">' +
      '<div class="row"><b style="font-family:var(--f-display);font-weight:400">' + esc(e.name || "Untitled") + '</b>' +
      '<span class="pill ' + e.status + '">' + statusLabel(e.status) + '</span>' +
      '<span class="right tiny muted">P' + e.prof + ' · ' + ACTIONS[actionOf(e)] + ' · ' +
        esc((RANGES.find(x=>x.k===e.range)||RANGES[0]).n) + ' · <b style="color:var(--red)">' + nf(d.final) + '</b> debt</span></div>' +
      (e.desc ? '<p class="hand" style="margin:5px 0 0">' + esc(e.desc) + '</p>' : '') +
      condSummary(e) + '</div>';
  });
  h += '<h2 class="sec" style="margin-top:14px">Skills</h2><div class="tw"><table class="t"><tbody>' +
    allSkillRows(c).filter(r => num(r.entry.ranks,0) > 0 || num(r.entry.misc,0) !== 0)
      .map(r => '<tr><td>' + esc(r.label) + '</td><td class="num tiny muted">' + r.def.attr.map(a=>a.toUpperCase()).join("/") + '</td>' +
        '<td class="num">' + num(r.entry.ranks,0) + '</td><td class="num"><b>' + sign(skillTotal(c, r.def.k, r.entry)) + '</b></td></tr>').join("") +
    '</tbody></table></div>';
  if(c.gear.length){
    h += '<h2 class="sec" style="margin-top:14px">Equipment</h2><ul style="margin:0;padding-left:18px">' +
      c.gear.map(g => { const def = allGear().find(x => x.id === g.id); return def ? '<li>' + esc(def.n) + (g.note ? ' — ' + esc(g.note) : '') + '</li>' : ''; }).join("") + '</ul>';
  }
  if(c.backstory) h += '<h2 class="sec" style="margin-top:14px">Backstory</h2><p class="hand" style="margin:0">' + esc(c.backstory) + '</p>';
  h += '</div></div></div>';
  return h;
}

/* ---------- PDF ----------------------------------------------------------- */
function buildPdf(c, mode){
  const JS = window.jspdf && window.jspdf.jsPDF;
  if(!JS){ toast("The PDF library didn't load. Try reloading the page."); return null; }
  const doc = new JS({unit:"pt", format:"letter"});
  const W = 612, H = 792, M = 36;
  const styled = mode === "styled";
  const RED = [206,32,39], INK = [20,19,18], GREY = [120,116,108], RULE = [201,196,182];
  let page = 1;

  function bg(){
    if(!styled) return;
    doc.setDrawColor(190,200,215); doc.setLineWidth(0.4);
    for(let y = 96; y < H - 30; y += 19) doc.line(M - 10, y, W - M + 10, y);
    doc.setDrawColor(RED[0], RED[1], RED[2]); doc.setLineWidth(0.7);
    doc.line(M - 14, 26, M - 14, H - 20);
  }
  function banner(txt, x, y, w){
    if(styled){
      doc.setFillColor(RED[0], RED[1], RED[2]);
      doc.roundedRect(x - 4, y - 11, (w || (doc.getTextWidth(txt) + 18)), 17, 7, 7, "F");
      doc.setTextColor(255,255,255);
    } else {
      doc.setTextColor(INK[0], INK[1], INK[2]);
      doc.setDrawColor(INK[0], INK[1], INK[2]); doc.setLineWidth(1.1);
      doc.line(x - 4, y + 5, x - 4 + (w || (doc.getTextWidth(txt) + 18)), y + 5);
    }
    doc.setFont("helvetica","bold"); doc.setFontSize(11);
    doc.text(txt.toUpperCase(), x + 4, y + 1);
    doc.setTextColor(INK[0], INK[1], INK[2]);
  }
  function label(t, x, y){ doc.setFont("helvetica","bold"); doc.setFontSize(6.6); doc.setTextColor(GREY[0],GREY[1],GREY[2]); doc.text(t.toUpperCase(), x, y); doc.setTextColor(INK[0],INK[1],INK[2]); }
  function body(t, x, y, size, style){ doc.setFont("helvetica", style || "normal"); doc.setFontSize(size || 9); doc.text(String(t), x, y); doc.setFont("helvetica","normal"); }
  function plain(size){ doc.setFont("helvetica","normal"); doc.setFontSize(size || 9); }
  function rule(x, y, w){ doc.setDrawColor(RULE[0],RULE[1],RULE[2]); doc.setLineWidth(0.5); doc.line(x, y, x + w, y); }
  function newPage(){ doc.addPage(); page++; bg(); footer(); return 64; }
  function footer(){
    doc.setFont("helvetica","normal"); doc.setFontSize(7); doc.setTextColor(GREY[0],GREY[1],GREY[2]);
    doc.text("Neverborn — " + (c.name || "Unnamed") + " — page " + page, M, H - 22);
    doc.setTextColor(INK[0],INK[1],INK[2]);
  }

  /* ---------------- page 1 ---------------- */
  bg(); footer();
  doc.setFont("helvetica","bold"); doc.setFontSize(23);
  doc.setTextColor(INK[0],INK[1],INK[2]);
  doc.text("NEVERBORN", M, 52);
  if(styled){ doc.setFillColor(RED[0],RED[1],RED[2]); doc.rect(M, 57, 128, 3, "F"); }

  const st = STYLES[c.styleKey];
  let x2 = M + 190;
  label("Character name", x2, 34); body(c.name || "—", x2, 46, 11, "bold"); rule(x2, 49, 200);
  label("Sibling style", x2, 62); body(st.n + " — " + st.power, x2, 73); rule(x2, 76, 200);
  label("Proficiency", x2, 89); body(String(c.prof), x2, 100); rule(x2, 103, 92);
  label("XP left", W - M - 74, 34);
  doc.setFont("helvetica","bold"); doc.setFontSize(20); doc.text(String(xpAvailable(c)), W - M - 74, 54);
  doc.setDrawColor(INK[0],INK[1],INK[2]); doc.setLineWidth(1); doc.rect(W - M - 82, 34, 74, 30);

  const meta = [["Height",c.height],["Weight",c.weight],["Hair",c.hair],["Gender",c.gender],["Age",c.age],["Eyes",c.eyes]];
  let mx = M, my = 122;
  meta.forEach((m, i) => {
    const col = i % 3, row = Math.floor(i / 3);
    const px = M + col * 82, py = my + row * 20;
    label(m[0], px, py); body(m[1] || "—", px + 40, py); rule(px + 38, py + 2, 40);
  });

  let ly = 182;
  banner("Attributes", M, ly, 96); ly += 16;
  label("Score", M + 96, ly - 2); label("Mod", M + 136, ly - 2); label("Temp", M + 170, ly - 2);
  ly += 4;
  ATTRS.forEach(a => {
    body(a.n, M, ly, 9, "bold");
    body(String(num(c.attrs[a.k],10)), M + 102, ly);
    body(sign(attrModOf(c,a.k)), M + 140, ly, 9, "bold");
    body(num(c.attrTemp[a.k],0) ? sign(num(c.attrTemp[a.k],0)) : "—", M + 176, ly);
    rule(M, ly + 3, 200); ly += 15;
  });

  ly += 12; banner("Saves", M, ly, 70); ly += 18;
  SAVES.forEach(s => {
    body(s.n, M, ly, 9, "bold");
    body(sign(saveTotal(c, s.k)), M + 102, ly, 9, "bold");
    body("(" + sign(num(c.saveBase[s.k],0)) + " base " + sign(attrModOf(c,s.attr)) + " " + s.attr + ")", M + 132, ly, 7.4);
    rule(M, ly + 3, 200); ly += 15;
  });

  ly += 12; banner("Combat", M, ly, 78); ly += 18;
  COMBAT.forEach(k => {
    body(k.n, M, ly, 9, "bold");
    const tot = k.k === "defense" ? combatTotal(c,k.k) : sign(combatTotal(c,k.k));
    body(String(tot), M + 102, ly, 9, "bold");
    rule(M, ly + 3, 200); ly += 15;
  });

  ly += 12; banner("Damage", M, ly, 80); ly += 18;
  [["Bashing","bashing",6],["Stun","stun",6],["Lethal","lethal",3]].forEach(([l,k,mx2]) => {
    body(l, M, ly, 9, "bold");
    for(let i = 0; i < mx2; i++){
      const bx = M + 60 + i * 15;
      if(k === "lethal") doc.setDrawColor(RED[0],RED[1],RED[2]); else doc.setDrawColor(INK[0],INK[1],INK[2]);
      doc.setLineWidth(0.8); doc.rect(bx, ly - 8, 11, 11);
      if(i < num(c.dmg[k],0)){
        doc.line(bx + 1.5, ly - 6.5, bx + 9.5, ly + 1.5);
        doc.line(bx + 9.5, ly - 6.5, bx + 1.5, ly + 1.5);
      }
    }
    ly += 18;
  });

  /* expressions column */
  const EX = M + 226, EW = W - M - EX;
  let ey = 182;
  banner("Expressions", EX, ey, 112); ey += 20;
  const exprs = c.expressions.slice();
  function drawExpr(e){
    const d = computeDebt(e);
    const descLines = doc.splitTextToSize(e.desc || "—", EW - 8);
    const bits = [];
    if(e.linkPort || e.linkDist) bits.push("Linked" + (e.linkObject ? ": " + e.linkObject : ""));
    (e.conds||[]).forEach(x => bits.push("Condition: " + (x.text || (COND_TIERS.find(t=>t.v===num(x.v,0))||{}).n || "")));
    if(num(e.condSave,0)) bits.push((COND_SAVE.find(x=>x.v===num(e.condSave,0))||{}).n);
    (e.limits||[]).forEach(x => bits.push("Limitation: " + (x.text || (LIMIT_TIERS.find(t=>t.v===num(x.v,0))||{}).n || "")));
    if(e.aoeFeet) bits.push(e.aoeFeet + " ft area of effect");
    if(e.loops) bits.push("Loops ×" + e.loops);
    if(e.tradeoff) bits.push("Traded: " + d.monthly + " monthly, " + d.activation + " activation");
    const bitLines = bits.length ? doc.splitTextToSize(bits.join(" · "), EW - 8) : [];
    const need = 30 + descLines.length * 10 + bitLines.length * 9;
    if(ey + need > H - 46){ ey = newPage(); banner("Expressions, continued", EX, ey, 150); ey += 20; }
    doc.setDrawColor(RULE[0],RULE[1],RULE[2]); doc.setLineWidth(0.6);
    doc.rect(EX - 4, ey - 12, EW + 4, need, "S");
    body(e.name || "Untitled", EX, ey, 10.5, "bold");
    doc.setFont("helvetica","normal"); doc.setFontSize(7.4); doc.setTextColor(GREY[0],GREY[1],GREY[2]);
    doc.text("P" + e.prof + " · " + ACTIONS[actionOf(e)] + " · " + (RANGES.find(x=>x.k===e.range)||RANGES[0]).n, EX, ey + 9);
    doc.setTextColor(RED[0],RED[1],RED[2]); doc.setFont("helvetica","bold"); doc.setFontSize(9);
    doc.text(nf(d.final) + " debt", EX + EW - 58, ey + 1);
    doc.setTextColor(INK[0],INK[1],INK[2]);
    let yy = ey + 21;
    doc.setFont("helvetica","normal"); doc.setFontSize(8.4);
    descLines.forEach(l => { doc.text(l, EX, yy); yy += 10; });
    if(bitLines.length){
      doc.setFontSize(7.4); doc.setTextColor(GREY[0],GREY[1],GREY[2]);
      bitLines.forEach(l => { doc.text(l, EX, yy); yy += 9; });
      doc.setTextColor(INK[0],INK[1],INK[2]);
    }
    ey += need + 8;
  }
  if(!exprs.length){ doc.setFontSize(8.4); doc.setTextColor(GREY[0],GREY[1],GREY[2]); doc.text("None recorded.", EX, ey); doc.setTextColor(INK[0],INK[1],INK[2]); }
  exprs.forEach(drawExpr);

  /* ---------------- page 2 ---------------- */
  let y = newPage();
  banner("Skills", M, y, 66); y += 20;
  label("Skill", M, y - 4); label("Key", M + 190, y - 4); label("Ranks", M + 226, y - 4);
  label("Attr", M + 266, y - 4); label("Misc", M + 302, y - 4); label("Total", M + 340, y - 4);
  y += 13;
  allSkillRows(c).forEach(r => {
    if(y > H - 60) y = newPage();
    body(r.label, M, y);
    plain(7.4); doc.setTextColor(GREY[0],GREY[1],GREY[2]);
    doc.text(r.def.attr.map(a=>a.toUpperCase()).join("/"), M + 190, y);
    doc.setTextColor(INK[0],INK[1],INK[2]); doc.setFontSize(9);
    doc.text(String(num(r.entry.ranks,0)), M + 232, y);
    doc.text(sign(bestAttrMod(c, r.def.attr)), M + 270, y);
    doc.text(String(num(r.entry.misc,0)), M + 306, y);
    doc.setFont("helvetica","bold"); doc.text(sign(skillTotal(c, r.def.k, r.entry)), M + 344, y);
    doc.setFont("helvetica","normal");
    rule(M, y + 3, 350); y += 14;
  });

  y += 14; if(y > H - 150) y = newPage();
  banner("Equipment", M, y, 92); y += 20;
  if(!c.gear.length){ doc.setFontSize(8.4); doc.text("None carried.", M, y); y += 14; }
  c.gear.forEach(g => {
    const def = allGear().find(x => x.id === g.id); if(!def) return;
    if(y > H - 60) y = newPage();
    body(def.n, M, y, 9, "bold");
    plain(8); doc.setTextColor(GREY[0],GREY[1],GREY[2]);
    doc.text(doc.splitTextToSize((def.dmg !== "—" ? def.dmg + ". " : "") + def.note + (g.note ? " (" + g.note + ")" : ""), 330)[0] || "", M + 150, y);
    doc.setTextColor(INK[0],INK[1],INK[2]); doc.setFontSize(9);
    rule(M, y + 3, 480); y += 14;
  });

  y += 14; if(y > H - 160) y = newPage();
  banner("Backgrounds", M, y, 104); y += 20;
  [["Resources", num(c.bg.resources,0), BG_RESOURCES[num(c.bg.resources,0)]],
   ["Reputation", num(c.bg.reputation,0), BG_REPUTATION[num(c.bg.reputation,0)]]].forEach(b => {
    body(b[0] + " " + b[1], M, y, 9, "bold");
    plain(8); doc.setTextColor(GREY[0],GREY[1],GREY[2]);
    doc.splitTextToSize(b[2], 380).forEach((l, i) => doc.text(l, M + 100, y + i * 9));
    doc.setTextColor(INK[0],INK[1],INK[2]); doc.setFontSize(9);
    y += Math.max(14, doc.splitTextToSize(b[2], 380).length * 9 + 5);
  });
  if(c.contacts.length){
    body("Contacts", M, y, 9, "bold"); y += 13;
    c.contacts.forEach(ct => {
      if(y > H - 60) y = newPage();
      plain(8.4); doc.text("• " + (ct.name || "—") + (ct.note ? " — " + ct.note : ""), M + 8, y); y += 12;
    });
  }

  if(c.backstory){
    y += 14; if(y > H - 120) y = newPage();
    banner("Backstory", M, y, 88); y += 20;
    plain(9);
    doc.splitTextToSize(c.backstory, W - M * 2).forEach(l => {
      if(y > H - 46) y = newPage();
      doc.text(l, M, y); y += 12;
    });
  }
  if(c.portrait){
    y += 10; if(y > H - 90) y = newPage();
    banner("Self portrait", M, y, 104); y += 20;
    plain(9);
    doc.splitTextToSize(c.portrait, W - M * 2).forEach(l => {
      if(y > H - 46) y = newPage();
      doc.text(l, M, y); y += 12;
    });
  }
  return doc;
}

async function exportPdf(c, mode){
  const doc = buildPdf(c, mode);
  if(!doc) return;
  const blob = doc.output("blob");
  const filename = (c.name || "neverborn").replace(/[^\w\- ]+/g, "").trim().replace(/\s+/g, "-").toLowerCase() + ".pdf";
  if(S.downloads){
    try { await S.downloads.save({filename, data: blob}); toast("Sheet saved."); }
    catch(e){
      if(e && e.code === "declined") return;
      toast("Couldn't save the PDF here. Try the browser's own download instead.");
      fallbackDownload(blob, filename);
    }
  } else fallbackDownload(blob, filename);
}
function fallbackDownload(blob, filename){
  try {
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  } catch(e){ toast("Downloads aren't available in this view."); }
}
async function exportJson(c){
  const filename = (c.name || "neverborn").replace(/[^\w\- ]+/g,"").trim().replace(/\s+/g,"-").toLowerCase() + ".json";
  const data = JSON.stringify(c, null, 2);
  if(S.downloads){
    try { await S.downloads.save({filename, data}); toast("Data saved."); return; }
    catch(e){ if(e && e.code === "declined") return; }
  }
  fallbackDownload(new Blob([data], {type:"application/json"}), filename);
}

function charById(id){ return S.chars.find(c => c.id === id); }
function setPath(obj, path, val){
  const parts = path.split(".");
  let o = obj;
  for(let i = 0; i < parts.length - 1; i++){ if(o[parts[i]] == null) o[parts[i]] = {}; o = o[parts[i]]; }
  o[parts[parts.length - 1]] = val;
}

/* ---- theme ---------------------------------------------------------------- */
function applyTheme(){
  const t = localStorage.getItem("neverborn.theme");
  if(t === "light" || t === "dark") document.documentElement.dataset.theme = t;
  else delete document.documentElement.dataset.theme;
}
function effectiveTheme(){
  const t = localStorage.getItem("neverborn.theme");
  if(t === "light" || t === "dark") return t;
  return (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
}

/* ---- clicks -------------------------------------------------------------- */
APP.addEventListener("click", async (ev) => {
  const t = ev.target.closest("[data-act]");
  if(!t) return;
  if(t.dataset.act === "closemodal" && ev.target.closest("[data-stop]") && ev.target.closest("[data-act]") !== t) return;
  const act = t.dataset.act;
  const c = t.dataset.c ? charById(t.dataset.c) : curChar();

  switch(act){
    case "authtab": S.authView = t.dataset.m; render(); break;
    case "authsignup": await doAuthSignup(); break;
    case "authsignin": await doAuthSignin(); break;
    case "authgoogle": await doAuthGoogle(); break;
    case "authforgot": await doAuthForgot(); break;
    case "signout": await doSignOut(); break;

    case "theme": {
      const next = effectiveTheme() === "dark" ? "light" : "dark";
      localStorage.setItem("neverborn.theme", next);
      applyTheme(); render(); break;
    }

    case "nav": S.view = t.dataset.v; if(S.view !== "expressions") S.forge = null; render(); window.scrollTo(0,0); break;
    case "open": S.charId = t.dataset.c; S.view = "overview"; S.forge = null; render(); window.scrollTo(0,0); break;
    case "entercamp": await enterCampaign(t.dataset.code); break;
    case "backtolist":
      S.campaign = null; S.chars = []; S.charId = null; S.view = "dashboard";
      unsubCampaignScope();
      render(); break;

    case "createcamp": await createCampaign(); break;
    case "joincamp": await joinCampaign(); break;
    case "newchar": await createChar(); break;

    case "toggle-gmedit":
      if(!c || !ownsChar(c)) return;
      c.allowGmEdit = !c.allowGmEdit; saveChar(c, true); render(); break;

    case "attr": {
      if(!canEditChar(c)) return;
      const k = t.dataset.k, d = num(t.dataset.d,0);
      c.attrs[k] = clamp(num(c.attrs[k],10) + d, 0, 60);
      saveChar(c); render(); break;
    }
    case "save": {
      if(!canEditChar(c)) return;
      c.saveBase[t.dataset.k] = Math.max(0, num(c.saveBase[t.dataset.k],0) + num(t.dataset.d,0));
      saveChar(c); render(); break;
    }
    case "combat": {
      if(!canEditChar(c)) return;
      c.combat[t.dataset.k] = Math.max(0, num(c.combat[t.dataset.k],0) + num(t.dataset.d,0));
      saveChar(c); render(); break;
    }
    case "rank": {
      if(!canEditChar(c)) return;
      const k = t.dataset.k;
      if(!c.skills[k]) c.skills[k] = {ranks:0, misc:0};
      c.skills[k].ranks = Math.max(0, num(c.skills[k].ranks,0) + num(t.dataset.d,0));
      saveChar(c); render(); break;
    }
    case "subrank": {
      if(!canEditChar(c)) return;
      const s = c.subSkills.find(x => x.id === t.dataset.id);
      if(s){ s.ranks = Math.max(0, num(s.ranks,0) + num(t.dataset.d,0)); saveChar(c); render(); }
      break;
    }
    case "addsub": {
      if(!canEditChar(c)) return;
      c.subSkills.push({id: uid("sk_"), key: t.dataset.k, label:"", ranks:0, misc:0});
      saveChar(c); render(); break;
    }
    case "delsub": {
      if(!canEditChar(c)) return;
      c.subSkills = c.subSkills.filter(x => x.id !== t.dataset.id);
      saveChar(c); render(); break;
    }
    case "bg": {
      if(!canEditChar(c)) return;
      c.bg[t.dataset.k] = clamp(num(c.bg[t.dataset.k],0) + num(t.dataset.d,0), 0, 5);
      saveChar(c); render(); break;
    }
    case "addcontact":
      if(!canEditChar(c)) return;
      c.contacts.push({name:"", note:""}); saveChar(c); render(); break;
    case "delcontact":
      if(!canEditChar(c)) return;
      c.contacts.splice(num(t.dataset.i,0), 1); saveChar(c); render(); break;

    case "addgear": {
      if(!canEditChar(c)) return;
      const def = allGear().find(g => g.id === t.dataset.g);
      if(def && num(def.res,1) > num(c.bg.resources,0)){
        if(!confirm(def.n + " sits above Resources " + num(c.bg.resources,0) + ". Add it anyway? Your GM decides how you got it.")) return;
      }
      c.gear.push({id: t.dataset.g, note:""}); saveChar(c); render(); break;
    }
    case "delgear":
      if(!canEditChar(c)) return;
      c.gear.splice(num(t.dataset.i,0), 1); saveChar(c); render(); break;
    case "addcustomgear": {
      if(!isGM()) return;
      const g = {
        id: uid("cg_"),
        n: (document.getElementById("cgn")||{}).value || "Custom item",
        cat: (document.getElementById("cgc")||{}).value || "Kit",
        ex: (document.getElementById("cge")||{}).value || "",
        dmg: (document.getElementById("cgd")||{}).value || "—",
        note: (document.getElementById("cgnote")||{}).value || "",
        res: num((document.getElementById("cgr")||{}).value, 1)
      };
      S.campaign.gear = (S.campaign.gear || []).concat([g]);
      await saveCampaign(); toast(g.n + " added to the campaign."); render(); break;
    }

    case "buyslot":
      if(!canEditChar(c)) return;
      c.extraSlots = num(c.extraSlots,0) + 1; saveChar(c); toast("Slot bought for 10 XP."); render(); break;

    case "forge-new": {
      if(!canEditChar(c)) return;
      S.forge = blankExpression(STYLES[c.styleKey].power, num(t.dataset.p,1));
      S.view = "expressions"; render(); window.scrollTo(0,0); break;
    }
    case "forge-edit": {
      if(!canEditChar(c)) return;
      const e = c.expressions.find(x => x.id === t.dataset.e);
      if(e){ S.forge = JSON.parse(JSON.stringify(e)); S.view = "expressions"; render(); window.scrollTo(0,0); }
      break;
    }
    case "forge-cancel": S.forge = null; render(); break;
    case "forge-addcond": S.forge.conds.push({v:-5, text:""}); render(); break;
    case "forge-delcond": S.forge.conds.splice(num(t.dataset.i,0),1); render(); break;
    case "forge-addlimit": S.forge.limits.push({v:-5, text:""}); render(); break;
    case "forge-dellimit": S.forge.limits.splice(num(t.dataset.i,0),1); render(); break;
    case "forge-save": case "forge-submit": {
      const e = S.forge;
      if(!e.name.trim()){ toast("Give it a name first."); return; }
      if(act === "forge-submit"){ e.status = "pending"; e.submittedAt = Date.now(); }
      else if(e.status === "approved") e.status = "draft";
      const i = c.expressions.findIndex(x => x.id === e.id);
      if(i >= 0) c.expressions[i] = e; else c.expressions.push(e);
      S.forge = null; saveChar(c, true);
      toast(act === "forge-submit" ? "Sent to the GM." : "Saved.");
      render(); window.scrollTo(0,0); break;
    }
    case "submit-expr": {
      if(!canEditChar(c)) return;
      const e = c.expressions.find(x => x.id === t.dataset.e);
      if(e){ e.status = "pending"; e.submittedAt = Date.now(); saveChar(c, true); toast("Sent to the GM."); render(); }
      break;
    }
    case "del-expr": {
      if(!canEditChar(c)) return;
      if(!confirm("Delete this expression?")) return;
      c.expressions = c.expressions.filter(x => x.id !== t.dataset.e);
      saveChar(c, true); render(); break;
    }
    case "review": S.view = "approvals"; render(); window.scrollTo(0,0); break;
    case "approve": case "reject": {
      if(!isGM()) return;
      const ch = charById(t.dataset.c);
      const e = ch && ch.expressions.find(x => x.id === t.dataset.e);
      if(!e) return;
      const noteEl = document.getElementById("gmn_" + e.id);
      e.gmNote = noteEl ? noteEl.value : "";
      e.status = act === "approve" ? "approved" : "changes";
      saveChar(ch, true);
      toast(act === "approve" ? "Approved." : "Sent back for changes.");
      render(); break;
    }

    case "dmg": {
      if(!canEditChar(c)) return;
      const k = t.dataset.k, n = num(t.dataset.n,0);
      c.dmg[k] = (num(c.dmg[k],0) === n) ? n - 1 : n;
      if(c.dmg[k] < 0) c.dmg[k] = 0;
      saveChar(c); render(); break;
    }
    case "goodwill":
      if(!canEditChar(c)) return;
      c.goodwill = Math.max(0, num(c.goodwill,0) + num(t.dataset.d,0)); saveChar(c); render(); break;
    case "addgoodwill": {
      if(!canEditChar(c)) return;
      const el = document.getElementById("gwamt");
      const v = num(el && el.value, 0);
      if(!v){ toast("Enter an amount first."); return; }
      c.goodwill = Math.max(0, num(c.goodwill,0) + v); saveChar(c); toast("+" + v + " goodwill."); render(); break;
    }
    case "useexpr": {
      if(!canEditChar(c)) return;
      const el = document.getElementById("usexpr");
      const e = c.expressions.find(x => x.id === (el && el.value));
      if(!e) return;
      const d = computeDebt(e);
      const amt = e.tradeoff ? d.activation : d.final;
      c.debtLog = (c.debtLog||[]).concat([{at:Date.now(), amount:amt, note:(e.name||"Untitled") + (e.tradeoff ? " (activation)" : "")}]);
      saveChar(c); toast(nf(amt) + " debt incurred."); render(); break;
    }
    case "newmonth": {
      if(!canEditChar(c)) return;
      if(!confirm("Start a new month? This clears the debt log and goodwill.")) return;
      c.debtLog = []; c.goodwill = 0; saveChar(c, true); render(); break;
    }
    case "awardxp": {
      const el = document.getElementById("xpamt"), nl = document.getElementById("xpnote");
      const v = num(el && el.value, 0);
      if(!v){ toast("Enter an amount first."); return; }
      c.xpEarned = num(c.xpEarned, START_XP) + v;
      c.xpLog = (c.xpLog||[]).concat([{delta:v, note:(nl && nl.value) || "Award", at:Date.now()}]);
      saveChar(c, true); toast(sign(v) + " XP."); render(); break;
    }
    case "resettiers":
      if(!isGM()) return;
      S.campaign.tiers = JSON.parse(JSON.stringify(DEFAULT_TIERS));
      await saveCampaign(); render(); break;

    case "pdf": exportPdf(c, t.dataset.mode); break;
    case "exportjson": exportJson(c); break;
    case "closemodal": S.modal = null; render(); break;
  }
});

/* ---- bound inputs -------------------------------------------------------- */
APP.addEventListener("input", (ev) => {
  const el = ev.target;

  if(el.dataset.forge != null && S.forge){
    const p = el.dataset.forge;
    const val = el.type === "checkbox" ? el.checked : (el.type === "number" ? (el.value === "" ? "" : num(el.value,0)) : el.value);
    if(p.startsWith("scale.")) S.forge.scales[p.slice(6)] = num(val,0);
    else if(p.startsWith("cond.v.")) S.forge.conds[num(p.slice(7),0)].v = num(val,0);
    else if(p.startsWith("cond.text.")) S.forge.conds[num(p.slice(10),0)].text = val;
    else if(p.startsWith("limit.v.")) S.forge.limits[num(p.slice(8),0)].v = num(val,0);
    else if(p.startsWith("limit.text.")) S.forge.limits[num(p.slice(11),0)].text = val;
    else if(p === "customCore") S.forge.customCore = (val === "" ? null : num(val,0));
    else if(["linkPort","linkDist","condSave","tier"].includes(p)) S.forge[p] = num(val,0);
    else S.forge[p] = val;
    if(el.type === "text" || el.tagName === "TEXTAREA") scheduleLedger();
    else render();
    return;
  }

  if(el.dataset.camp != null && isGM()){
    const p = el.dataset.camp;
    if(p === "rentDate"){ S.campaign.rentDue = el.value ? new Date(el.value + "T12:00:00").getTime() : 0; }
    else if(p === "prof") S.campaign.prof = num(el.value,1);
    else if(p === "spendLimit") S.campaign.spendLimit = el.value === "1";
    else if(p === "goodwillBudget") S.campaign.goodwillBudget = Math.max(0, num(el.value,0));
    else S.campaign[p] = el.value;
    saveCampaign();
    if(p !== "name") render();
    return;
  }

  if(el.dataset.tier != null && isGM()){
    const i = num(el.dataset.i,0);
    if(!S.campaign.tiers) S.campaign.tiers = JSON.parse(JSON.stringify(DEFAULT_TIERS));
    S.campaign.tiers[i][el.dataset.tier] = el.type === "number" ? num(el.value,0) : el.value;
    saveCampaign();
    return;
  }

  const bind = el.dataset.bind;
  if(bind == null) return;
  const c = charById(el.dataset.c);
  if(!c || !canEditChar(c)) return;
  const raw = el.type === "checkbox" ? el.checked : el.value;

  if(bind === "sub.label" || bind === "sub.misc"){
    const s = c.subSkills.find(x => x.id === el.dataset.id);
    if(s) s[bind === "sub.label" ? "label" : "misc"] = bind === "sub.misc" ? num(raw,0) : raw;
  } else if(bind.startsWith("skillmisc.")){
    const k = bind.slice(10);
    if(!c.skills[k]) c.skills[k] = {ranks:0, misc:0};
    c.skills[k].misc = num(raw,0);
  } else if(bind === "gear.note."){
    const g = c.gear[num(el.dataset.i,0)]; if(g) g.note = raw;
  } else if(bind === "contact.name." || bind === "contact.note."){
    const ct = c.contacts[num(el.dataset.i,0)];
    if(ct) ct[bind === "contact.name." ? "name" : "note"] = raw;
  } else if(bind === "prof"){
    c.prof = num(raw,1);
  } else if(el.type === "number"){
    setPath(c, bind, num(raw,0));
  } else {
    setPath(c, bind, raw);
  }
  saveChar(c);

  const needsRerender = el.tagName === "SELECT" || el.type === "number" || el.type === "checkbox" ||
                        bind === "name" || bind === "styleKey";
  if(needsRerender) render(); else scheduleStatbar();
});

/* light touch updates that don't need a full repaint */
let ledgerTimer = null;
function scheduleLedger(){ clearTimeout(ledgerTimer); ledgerTimer = setTimeout(render, 450); }
let sbTimer = null;
function scheduleStatbar(){ clearTimeout(sbTimer); sbTimer = setTimeout(() => {
  const c = curChar(); if(!c) return;
  const who = APP.querySelector(".statbar .who"); if(who) who.textContent = c.name || "Unnamed";
}, 200); }

/* ---- auth adapter: real Firebase or a local-only demo fallback ----------- */
function firebaseConfigured(){
  const cfg = window.NEVERBORN_FIREBASE_CONFIG;
  return !!(cfg && cfg.apiKey && !String(cfg.apiKey).startsWith("PASTE_"));
}
function localAuthBlob(){
  try { return JSON.parse(localStorage.getItem("neverborn.localAuth")) || {users:{}, session:null}; }
  catch(e){ return {users:{}, session:null}; }
}
function saveLocalAuthBlob(b){ localStorage.setItem("neverborn.localAuth", JSON.stringify(b)); }

async function doAuthSignup(){
  const email = (document.getElementById("authemail")||{}).value.trim().toLowerCase();
  const name = (document.getElementById("authname")||{}).value.trim();
  const pw = (document.getElementById("authpw")||{}).value;
  const pw2 = (document.getElementById("authpw2")||{}).value;
  if(!email || !pw){ toast("Enter an email and password."); return; }
  if(!name){ toast("Tell the table what to call you."); return; }
  if(pw.length < 6){ toast("Password needs to be at least 6 characters."); return; }
  if(pw !== pw2){ toast("Passwords don't match."); return; }

  if(S.localMode){
    const blob = localAuthBlob();
    if(blob.users[email]){ toast("An account with that email already exists here — try logging in."); return; }
    const newUid = "local-" + uidShort();
    blob.users[email] = {password: pw, uid: newUid, displayName: name};
    blob.session = newUid;
    saveLocalAuthBlob(blob);
    await applySignedInUser(newUid, {displayName: name, email});
    return;
  }
  // Firebase's auth-state listener can fire before this function's own
  // profile write finishes — set this synchronously, before the await
  // below, so the listener always sees the typed name regardless of timing.
  S._pendingName = name;
  try {
    const cred = await firebase.auth().createUserWithEmailAndPassword(email, pw);
    await S.db.doc("users/" + cred.user.uid).set({displayName: name, email, createdAt: Date.now()});
  } catch(e){ S._pendingName = null; toast(authErrorMessage(e)); }
}

async function doAuthSignin(){
  const email = (document.getElementById("authemail")||{}).value.trim().toLowerCase();
  const pw = (document.getElementById("authpw")||{}).value;
  if(!email || !pw){ toast("Enter your email and password."); return; }

  if(S.localMode){
    const blob = localAuthBlob();
    const u = blob.users[email];
    if(!u || u.password !== pw){ toast("No match for that email and password on this device."); return; }
    blob.session = u.uid;
    saveLocalAuthBlob(blob);
    await applySignedInUser(u.uid, {displayName: u.displayName, email});
    return;
  }
  try { await firebase.auth().signInWithEmailAndPassword(email, pw); }
  catch(e){ toast(authErrorMessage(e)); }
}

async function doAuthGoogle(){
  if(S.localMode){ toast("Google sign-in needs Firebase set up first — see SETUP.md."); return; }
  try {
    const provider = new firebase.auth.GoogleAuthProvider();
    await firebase.auth().signInWithPopup(provider);
  } catch(e){ toast(authErrorMessage(e)); }
}

async function doAuthForgot(){
  const email = (document.getElementById("authemail")||{}).value.trim().toLowerCase();
  if(!email){ toast("Enter your email first."); return; }
  if(S.localMode){ toast("Demo mode has no real email — nothing to reset yet."); return; }
  try {
    await firebase.auth().sendPasswordResetEmail(email);
    toast("If that email has an account, a reset link is on its way.");
    S.authView = "signin"; render();
  } catch(e){ toast(authErrorMessage(e)); }
}

async function doSignOut(){
  unsubAll();
  if(S.localMode){
    const blob = localAuthBlob(); blob.session = null; saveLocalAuthBlob(blob);
    S.me = {id:null, name:""}; S.campaign = null; S.chars = []; S.myCampaigns = []; S.authView = "signin";
    render(); return;
  }
  try { await firebase.auth().signOut(); } catch(e){}
}

function authErrorMessage(e){
  const code = e && e.code;
  const map = {
    "auth/email-already-in-use": "That email already has an account — try logging in instead.",
    "auth/invalid-email": "That doesn't look like a valid email.",
    "auth/weak-password": "Password needs to be at least 6 characters.",
    "auth/wrong-password": "Wrong password.",
    "auth/user-not-found": "No account with that email.",
    "auth/invalid-credential": "Email or password didn't match.",
    "auth/too-many-requests": "Too many attempts — wait a bit and try again.",
    "auth/popup-closed-by-user": "Google sign-in was closed before finishing.",
    "auth/unauthorized-domain": "This domain isn't authorized for Google sign-in yet — add it under Firebase Authentication → Settings → Authorized domains."
  };
  return map[code] || ("Something went wrong (" + (code || "unknown error") + ").");
}
function uidShort(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4); }

/* called once we have a real or local authenticated user */
async function applySignedInUser(userId, fallback){
  S.me.id = userId;
  const prof = await loadOrCreateProfile(userId, fallback);
  S.me.name = prof.displayName || fallback.displayName || "";
  S.view = "dashboard";
  subscribeMyCampaigns();
  S.ready = true;
  render();
}

async function loadOrCreateProfile(userId, fallback){
  if(S.localMode){
    const blob = localRead() || {};
    blob.profiles = blob.profiles || {};
    if(!blob.profiles[userId]){
      blob.profiles[userId] = {displayName: fallback.displayName || "Player", email: fallback.email || ""};
      localWrite(blob);
    }
    return blob.profiles[userId];
  }
  try {
    const snap = await S.db.doc("users/" + userId).get();
    if(snap.exists){
      const data = snap.data();
      if(S._pendingName){ data.displayName = S._pendingName; S._pendingName = null; }
      return data;
    }
    const created = {
      displayName: S._pendingName || fallback.displayName || (fallback.email||"Player").split("@")[0],
      email: fallback.email || "", createdAt: Date.now()
    };
    S._pendingName = null;
    await S.db.doc("users/" + userId).set(created);
    return created;
  } catch(e){ return {displayName: S._pendingName || fallback.displayName || "Player", email: fallback.email || ""}; }
}

/* ---- campaign lifecycle --------------------------------------------------- */
function makeCode(){
  const A = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let s = ""; for(let i = 0; i < 6; i++) s += A[Math.floor(Math.random() * A.length)];
  return s;
}

async function createCampaign(){
  const nameEl = document.getElementById("newcampname");
  const name = (nameEl && nameEl.value.trim()) || "A new crew";
  const mode = (document.getElementById("newcampmode")||{}).value || GAME_MODES[2];
  const prof = num((document.getElementById("newcampprof")||{}).value, 1);
  const rentDue = Date.now() + 30 * 86400000;
  const cp = {
    code: makeCode(), name, gmId: S.me.id, gmName: S.me.name, mode, prof, rentDue,
    playerIds: [], spendLimit:false, goodwillBudget: 0, tiers: JSON.parse(JSON.stringify(DEFAULT_TIERS)), gear:[],
    createdAt: Date.now(), updatedAt: Date.now()
  };
  S.campaign = cp; S.chars = [];
  await saveCampaign();
  subscribeMyCampaigns();
  subscribeCampaignScope();
  S.view = "dashboard";
  render();
  toast("Campaign created. Share the code " + cp.code + " with your crew.");
}

async function joinCampaign(){
  const el = document.getElementById("joincode");
  const code = (el && el.value.trim().toUpperCase()) || "";
  if(!code){ toast("Enter a campaign code."); return; }
  if(S.localMode){
    const blob = localRead();
    if(!(blob && blob.campaign && blob.campaign.code === code)){ toast("No campaign with that code on this device."); return; }
    const cp = blob.campaign;
    cp.playerIds = cp.playerIds || [];
    if(!cp.playerIds.includes(S.me.id)) cp.playerIds.push(S.me.id);
    S.campaign = cp; S.chars = (blob.chars||[]).map(migrate);
    await saveCampaign();
    subscribeMyCampaigns();
    S.view = "dashboard"; render();
    return;
  }
  try {
    const snap = await S.db.doc("campaigns/" + code).get();
    if(!snap.exists){ toast("No campaign with that code. Check it with your GM."); return; }
    S.campaign = snap.data();
    await S.db.doc("campaigns/" + code).update({
      playerIds: firebase.firestore.FieldValue.arrayUnion(S.me.id),
      updatedAt: Date.now()
    });
    subscribeCampaignScope();
    S.view = "dashboard"; render();
  } catch(e){
    if(e && e.code === "permission-denied") toast("Firestore refused that — check your security rules match firestore.rules.");
    else toast("Couldn't reach that campaign. Try again in a moment.");
  }
}

async function enterCampaign(code){
  const cached = (S.myCampaigns||[]).find(x => x.code === code);
  if(cached) S.campaign = cached;
  S.chars = [];
  subscribeCampaignScope();
  S.view = "dashboard";
  render();
  window.scrollTo(0,0);
}

async function createChar(){
  const c = newCharacter(S.me.id, S.campaign.code, S.campaign.prof);
  S.chars.push(c); S.charId = c.id; S.view = "overview";
  saveChar(c, true); render(); window.scrollTo(0,0);
}

/* ---- live subscriptions ---------------------------------------------------- */
/* Two separate subscription scopes: "my campaigns" (always live once signed
   in) and "campaign scope" (the currently open campaign's own doc + its
   characters). Kept separate so entering/leaving a campaign doesn't disturb
   the campaigns list underneath it. */
let unsubMyCampaigns = [];
let unsubScope = [];

function unsubCampaignScope(){ unsubScope.forEach(u => { try{u();}catch(e){} }); unsubScope = []; }
function unsubAll(){
  unsubMyCampaigns.forEach(u => { try{u();}catch(e){} }); unsubMyCampaigns = [];
  unsubCampaignScope();
}

function subscribeMyCampaigns(){
  unsubMyCampaigns.forEach(u => { try{u();}catch(e){} }); unsubMyCampaigns = [];
  if(S.localMode){
    const blob = localRead();
    S.myCampaigns = (blob && blob.campaign) ? [blob.campaign] : [];
    return;
  }
  if(!S.db || !S.me.id) return;
  let asGm = [], asPlayer = [];
  const merge = () => {
    const byCode = {};
    asGm.concat(asPlayer).forEach(cp => { byCode[cp.code] = cp; });
    S.myCampaigns = Object.values(byCode);
    if(!S.campaign) render();
  };
  unsubMyCampaigns.push(S.db.collection("campaigns").where("gmId","==",S.me.id).onSnapshot(
    (snap) => { asGm = []; snap.forEach(d => asGm.push(d.data())); merge(); },
    (e) => handleWriteError(e)
  ));
  unsubMyCampaigns.push(S.db.collection("campaigns").where("playerIds","array-contains",S.me.id).onSnapshot(
    (snap) => { asPlayer = []; snap.forEach(d => asPlayer.push(d.data())); merge(); },
    (e) => handleWriteError(e)
  ));
}

function subscribeCampaignScope(){
  unsubCampaignScope();
  if(S.localMode || !S.db || !S.campaign) return;
  const code = S.campaign.code;
  unsubScope.push(S.db.collection("characters").where("campaign", "==", code).onSnapshot(
    (snap) => {
      const incoming = [];
      snap.forEach(d => incoming.push(migrate(d.data())));
      const openForge = !!S.forge;
      S.chars = incoming;
      if(S.charId && !S.chars.find(x => x.id === S.charId)) S.charId = null;
      if(!S.charId){ const mine = S.chars.find(x => ownsChar(x)); if(mine) S.charId = mine.id; }
      if(!openForge) render(); else renderStatbarOnly();
    },
    (e) => handleWriteError(e)
  ));
  unsubScope.push(S.db.doc("campaigns/" + code).onSnapshot(
    (snap) => { if(snap.exists && S.campaign && S.campaign.code === code){ S.campaign = snap.data(); if(!S.forge) render(); } },
    (e) => handleWriteError(e)
  ));
}
function renderStatbarOnly(){
  const bar = APP.querySelector(".statbar");
  if(bar) bar.outerHTML = viewStatbar();
}

/* ---- boot ------------------------------------------------------------------ */
async function boot(){
  applyTheme();

  if(!firebaseConfigured() || typeof firebase === "undefined"){
    S.localMode = true;
    const blob = localAuthBlob();
    S.authView = "signin";
    if(blob.session && blob.users){
      const entry = Object.entries(blob.users).find(([,u]) => u.uid === blob.session);
      if(entry){ await applySignedInUser(blob.session, {displayName: entry[1].displayName, email: entry[0]}); return; }
    }
    S.ready = true; render();
    return;
  }

  firebase.initializeApp(window.NEVERBORN_FIREBASE_CONFIG);
  S.db = firebase.firestore();
  S.authView = "signin";
  firebase.auth().onAuthStateChanged(async (user) => {
    unsubAll();
    if(user){
      await applySignedInUser(user.uid, {displayName: user.displayName || "", email: user.email || ""});
    } else {
      S.me = {id:null, name:""}; S.campaign = null; S.chars = []; S.myCampaigns = [];
      S.ready = true; render();
    }
  });
}

render();
boot();
