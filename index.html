    h += '<tr><td style="font-family:var(--f-cond);font-weight:700;letter-spacing:.05em;text-transform:uppercase">' + esc(a.n) + '</td>' +
      '<td class="num">' + stepper("attr", a.k, sc, ed, c.id, 0, null) + '</td>' +
      '<td class="num"><span class="total">' + sign(attrMod(sc)) + '</span></td>' +
      '<td class="num"><input type="number" data-fk="at' + a.k + c.id + '" data-bind="attrTemp.' + a.k + '" data-c="' + c.id + '" ' +
        (ed?"":"disabled") + ' value="' + num(c.attrTemp[a.k],0) + '" style="width:54px;text-align:center"></td></tr>';
  });
  h += '</tbody></table>' +
    '<p class="tiny muted" style="margin:8px 0 0">Everything starts at 10. Dropping below 10 refunds XP and gives you a negative modifier. ' +
    'Temp is for expression and gear effects — it never costs XP.</p></div>';

  /* saves */
  h += '<div class="card"><h2 class="sec">Saves</h2>' +
    '<table class="t"><thead><tr><th>Save</th><th class="num">Base</th><th class="num">Attr</th><th class="num">Misc</th><th class="num">Total</th></tr></thead><tbody>';
  SAVES.forEach(s => {
    h += '<tr><td style="font-family:var(--f-cond);font-weight:700;letter-spacing:.05em;text-transform:uppercase">' + esc(s.n) + '</td>' +
      '<td class="num">' + stepper("save", s.k, num(c.saveBase[s.k],0), ed, c.id, 0, null) + '</td>' +
      '<td class="num muted">' + sign(attrModOf(c, s.attr)) + ' <span class="tiny">' + s.attr + '</span></td>' +
      '<td class="num"><input type="number" data-fk="sm' + s.k + c.id + '" data-bind="saveMisc.' + s.k + '" data-c="' + c.id + '" ' +
        (ed?"":"disabled") + ' value="' + num(c.saveMisc[s.k],0) + '" style="width:54px;text-align:center"></td>' +
      '<td class="num"><span class="total">' + sign(saveTotal(c, s.k)) + '</span></td></tr>';
  });
  h += '</tbody></table>';
  if(dmgPenalty(c)) h += '<p class="tiny" style="margin:8px 0 0;color:var(--red)">Injury penalty of ' + dmgPenalty(c) + ' is already included.</p>';
  h += '</div></div>';

  /* combat */
  h += '<div class="card" style="margin-top:12px"><h2 class="sec">Combat</h2>' +
    '<div class="tw"><table class="t"><thead><tr><th>Stat</th><th class="num">Base</th><th class="num">Bought</th><th class="num">Attribute</th><th class="num">Expression</th><th class="num">Total</th></tr></thead><tbody>';
  COMBAT.forEach(k => {
    const attrPart = k.attr ? (k.half ? Math.floor(attrModOf(c,k.attr)/2) : attrModOf(c,k.attr)) : null;
    h += '<tr><td style="font-family:var(--f-cond);font-weight:700;letter-spacing:.05em;text-transform:uppercase">' + esc(k.n) + '</td>' +
      '<td class="num muted">' + (k.base || "—") + '</td>' +
      '<td class="num">' + stepper("combat", k.k, num(c.combat[k.k],0), ed, c.id, 0, null) + '</td>' +
      '<td class="num muted">' + (attrPart == null ? "—" : sign(attrPart) + ' <span class="tiny">' + (k.half ? "½ " : "") + k.attr + '</span>') + '</td>' +
      '<td class="num"><input type="number" data-fk="ce' + k.k + c.id + '" data-bind="combatExpr.' + k.k + '" data-c="' + c.id + '" ' +
        (ed?"":"disabled") + ' value="' + num(c.combatExpr[k.k],0) + '" style="width:54px;text-align:center"></td>' +
      '<td class="num"><span class="total">' + (k.k === "defense" ? combatTotal(c,k.k) : sign(combatTotal(c,k.k))) + '</span></td></tr>';
  });
  h += '</tbody></table></div>' +
    '<p class="tiny muted" style="margin:8px 0 0">Defense is the only stat with a base of 10. Melee and Ranged are flat totals — no attribute is added. ' +
    'Initiative keeps its Dexterity modifier and Soak keeps half your Constitution bonus, as printed on the sheet.</p>' +
    '<p class="tiny muted" style="margin:5px 0 0">To soak, beat 15 + the damage modifier. Every 5 you fail by is another level of damage.</p></div>';

  return h;
}
/* ---------- skills -------------------------------------------------------- */
function viewSkills(c){
  const ed = canEditChar(c);
  let ranks = 0;
  Object.values(c.skills).forEach(e => ranks += Math.max(0, num(e.ranks,0)));
  c.subSkills.forEach(e => ranks += Math.max(0, num(e.ranks,0)));
  let h = '<div class="banner"><span>Skills</span></div>';
  h += '<p class="tiny muted" style="margin-top:-6px">1 XP buys 2 ranks. You have <b>' + ranks + '</b> ranks costing <b>' +
       Math.ceil(ranks/2) + '</b> XP, and <b>' + xpAvailable(c) + '</b> XP left. ' +
       'A skill with at least 1 rank counts as trained, so a natural 20 on it succeeds to the highest level possible.</p>';

  h += '<div class="card"><div class="tw"><table class="t"><thead><tr>' +
    '<th>Skill</th><th class="num">Key</th><th class="num">Ranks</th><th class="num">Attr</th><th class="num">Misc</th><th class="num">Total</th><th></th></tr></thead><tbody>';

  SKILLS.forEach(def => {
    if(def.sub){
      const rows = c.subSkills.filter(x => x.key === def.k);
      rows.forEach(x => { h += skillRow(c, def, x, ed, true); });
      h += '<tr><td colspan="7" style="padding:4px 5px">' +
        (ed ? '<button class="btn ghost sm" data-act="addsub" data-k="' + def.k + '" data-c="' + c.id + '">Add a ' + esc(def.n.toLowerCase()) + ' ' + esc(def.sub) + '</button>' : '') +
        ' <span class="tiny muted">' + esc(SKILL_DESC[def.k]) + '</span></td></tr>';
    } else {
      h += skillRow(c, def, c.skills[def.k] || {ranks:0,misc:0}, ed, false);
    }
  });
  h += '</tbody></table></div></div>';
  return h;
}

function skillRow(c, def, entry, ed, isSub){
  const total = skillTotal(c, def.k, entry);
  const key = isSub ? entry.id : def.k;
  const label = isSub ? (entry.label || def.n) : def.n;
  const attrLabel = def.attr.map(a => a.toUpperCase()).join("/");
  const trained = num(entry.ranks,0) > 0;
  return '<tr>' +
    '<td>' + (isSub
      ? '<input type="text" data-fk="sl' + entry.id + '" data-bind="sub.label" data-id="' + entry.id + '" data-c="' + c.id + '" ' +
        (ed?"":"disabled") + ' value="' + esc(entry.label||"") + '" placeholder="' + esc(def.n + " — " + def.sub) + '" style="max-width:190px">'
      : '<span title="' + esc(SKILL_DESC[def.k]) + '" style="' + (trained ? "font-weight:600" : "") + '">' + esc(label) + '</span>') + '</td>' +
    '<td class="num tiny muted">' + attrLabel + '</td>' +
    '<td class="num">' + (isSub
      ? stepperSub(entry.id, num(entry.ranks,0), ed, c.id)
      : stepper("rank", def.k, num(entry.ranks,0), ed, c.id, 0, null)) + '</td>' +
    '<td class="num muted">' + sign(bestAttrMod(c, def.attr)) + '</td>' +
    '<td class="num"><input type="number" data-fk="km' + key + c.id + '" data-bind="' + (isSub ? "sub.misc" : "skillmisc." + def.k) + '" ' +
      'data-id="' + key + '" data-c="' + c.id + '" ' + (ed?"":"disabled") + ' value="' + num(entry.misc,0) + '" style="width:52px;text-align:center"></td>' +
    '<td class="num"><span class="total">' + sign(total) + '</span></td>' +
    '<td class="num">' + (isSub && ed ? '<button class="btn ghost sm" data-act="delsub" data-id="' + entry.id + '" data-c="' + c.id + '">×</button>' : '') + '</td>' +
    '</tr>';
}
function stepperSub(id, val, ed, cid){
  return '<span class="stepper">' +
    '<button data-act="subrank" data-id="' + id + '" data-d="-1" data-c="' + cid + '" ' + (ed && val > 0 ? "" : "disabled") + '>−</button>' +
    '<span class="val">' + val + '</span>' +
    '<button data-act="subrank" data-id="' + id + '" data-d="1" data-c="' + cid + '" ' + (ed?"":"disabled") + '>+</button></span>';
}

/* ---------- expressions list --------------------------------------------- */
function viewExpressions(c){
  if(S.forge) return viewForge(c);
  const ed = canEditChar(c);
  const used = slotsUsed(c), total = slotsTotal(c);
  const st = STYLES[c.styleKey];
  let h = '<div class="banner"><span>Expressions</span></div>';
  h += '<div class="row" style="margin-top:-4px;margin-bottom:12px">' +
    '<span class="chip ' + (used > total ? "bad" : "hi") + '">Slots <b>' + used + ' / ' + total + '</b></span>' +
    '<span class="chip">Proficiency 1 fills 1 slot, 2 fills 2, 3 fills all 3</span>' +
    (ed ? '<span class="right"><button class="btn ghost sm" data-act="buyslot" data-c="' + c.id + '">Buy a slot — 10 XP</button></span>' : '') +
    '</div>';

  if(ed){
    h += '<div class="card tape" style="margin-bottom:14px"><h3 class="sub">Build a new expression</h3>' +
      '<p class="tiny muted" style="margin:0 0 9px">Start with what you want it to do for your character, then work out how ' +
      esc(st.power.toLowerCase()) + ' gets you there.</p>' +
      '<div class="row">' +
      [1,2,3].map(p => '<button class="btn ' + (p===1?"primary":"") + '" data-act="forge-new" data-p="' + p + '" data-c="' + c.id + '"' +
        (p > S.campaign.prof ? ' title="Above the campaign level — the GM will see it flagged"' : '') +
        '>Proficiency ' + p + '</button>').join("") +
      '</div></div>';
  }

  if(!c.expressions.length){
    h += '<div class="empty"><p>No expressions yet. You have limitless potential and nothing to show for it.</p></div>';
    return h;
  }

  c.expressions.forEach(e => {
    const d = computeDebt(e);
    const act = actionOf(e);
    const r = RANGES.find(x => x.k === e.range) || RANGES[0];
    h += '<div class="card" style="margin-bottom:10px">' +
      '<div class="row">' +
      '<b style="font-family:var(--f-display);font-size:17px;font-weight:400">' + esc(e.name || "Untitled expression") + '</b>' +
      '<span class="pill p' + e.prof + '">P' + e.prof + '</span>' +
      '<span class="pill ' + e.status + '">' + statusLabel(e.status) + '</span>' +
      (e.isExpansion ? '<span class="pill draft">Expansion</span>' : '') +
      '<span class="right row" style="gap:6px">' +
      (ed ? '<button class="btn ghost sm" data-act="forge-edit" data-e="' + e.id + '" data-c="' + c.id + '">Edit</button>' : '') +
      (ed && e.status !== "pending" ? '<button class="btn sm" data-act="submit-expr" data-e="' + e.id + '" data-c="' + c.id + '">Send to GM</button>' : '') +
      (ed ? '<button class="btn ghost sm danger" data-act="del-expr" data-e="' + e.id + '" data-c="' + c.id + '">Delete</button>' : '') +
      '</span></div>' +
      '<div class="row tiny muted" style="gap:10px;margin:5px 0 7px">' +
      '<span>' + esc(e.power) + '</span><span>' + ACTIONS[act] + ' action</span><span>' + esc(r.n) + '</span>' +
      '<span><b style="color:var(--red);font-size:14px">' + nf(d.final) + '</b> debt</span>' +
      (e.tradeoff ? '<span>Traded: ' + nf(d.monthly) + ' monthly, ' + nf(d.activation) + ' to activate</span>' : '') +
      '</div>' +
      (e.desc ? '<p class="hand" style="margin:0 0 7px">' + esc(e.desc) + '</p>' : '') +
      condSummary(e) +
      (e.gmNote ? '<p class="tiny" style="margin:7px 0 0;padding:6px 9px;background:var(--red-wash);border-radius:3px;color:var(--red-ink)"><b>GM:</b> ' + esc(e.gmNote) + '</p>' : '') +
      '</div>';
  });
  return h;
}

function statusLabel(s){
  return {draft:"Draft", pending:"Waiting on the GM", approved:"Approved", changes:"Changes requested"}[s] || s;
}
function condSummary(e){
  const bits = [];
  if(e.linkPort || e.linkDist) bits.push("Linked" + (e.linkObject ? " to " + e.linkObject : ""));
  (e.conds||[]).forEach(c => bits.push(c.text || (COND_TIERS.find(t=>t.v===num(c.v,0))||{}).n));
  if(num(e.condSave,0)) bits.push((COND_SAVE.find(x=>x.v===num(e.condSave,0))||{}).n);
  (e.limits||[]).forEach(c => bits.push(c.text || (LIMIT_TIERS.find(t=>t.v===num(c.v,0))||{}).n));
  if(e.aoeFeet) bits.push(e.aoeFeet + " ft area");
  if(e.loops) bits.push("Loops ×" + e.loops);
  if(!bits.length) return "";
  return '<div class="row" style="gap:5px">' + bits.map(b => '<span class="chip">' + esc(b) + '</span>').join("") + '</div>';
}

/* ---------- the forge ----------------------------------------------------- */
function viewForge(c){
  const e = S.forge;
  const d = computeDebt(e);
  const power = e.power;
  const scales = SCALES[power] || [];
  const guided = e.prof === 1;
  const st = STYLES[c.styleKey];

  let h = '<div class="row" style="margin-bottom:10px">' +
    '<div class="banner" style="margin:0"><span>Expression forge</span></div>' +
    '<span class="right"><button class="btn ghost sm" data-act="forge-cancel">Cancel</button></span></div>';
  h += '<p class="tiny muted" style="margin:-4px 0 12px">' + esc(power) + ' · proficiency ' + e.prof + ' · ' + esc(PROF_TEXT[e.prof]) + '</p>';

  h += '<div class="grid" style="grid-template-columns:minmax(0,1fr) minmax(0,258px);align-items:start">';

  /* ---- left column ---- */
  h += '<div>';

  /* 1. concept */
  h += '<div class="card"><h2 class="sec">1. Concept</h2>' +
    '<label class="fl">Name it</label>' +
    '<input type="text" data-fk="fname" data-forge="name" value="' + esc(e.name) + '" placeholder="Hush the Footfall">' +
    '<label class="fl" style="margin-top:9px">What does it do?</label>' +
    '<textarea data-fk="fdesc" data-forge="desc" placeholder="Start with how this helps you play your character, then link it to ' +
      esc(power.toLowerCase()) + '.">' + esc(e.desc) + '</textarea>' +
    '<div class="row" style="margin-top:9px">' +
    '<label class="swtch"><input type="checkbox" data-forge="isExpansion" ' + (e.isExpansion?"checked":"") + '> This expands an expression I already have</label>' +
    '</div>' +
    (e.isExpansion ? '<div style="margin-top:8px"><label class="fl">Expanding which one?</label>' +
      '<select data-forge="parentId">' + '<option value="">Pick one</option>' +
      c.expressions.filter(x => x.id !== e.id && !x.isExpansion).map(x =>
        '<option value="' + x.id + '" ' + (x.id === e.parentId ? "selected" : "") + '>' + esc(x.name || "Untitled") + ' (p' + x.prof + ')</option>').join("") +
      '</select><p class="tiny muted" style="margin:5px 0 0">Half price, no new slot, and it has to use the same elements. ' +
      'Expansions can rank down but never up.</p></div>' : "") +
    '</div>';

  /* 2. scale */
  h += '<div class="card" style="margin-top:12px"><h2 class="sec">2. Link it to your ability</h2>';
  if(!guided){
    h += '<p class="tiny muted" style="margin:0 0 9px">Proficiency ' + e.prof + ' is deliberately freeform. ' +
      (e.prof === 2
        ? 'Pick your own measurement scale — it has to start at the lowest commonly used version of that unit — and set what one step costs. The book suggests +2 per step for metaphorical Mass.'
        : 'Keep a small thematic tie-in and name your own price. This one needs the GM to sign off.') + '</p>' +
      '<div class="grid g2">' +
      '<div><label class="fl">Your scale, and what a step costs</label>' +
      '<input type="text" data-fk="fcn" data-forge="customNote" value="' + esc(e.customNote) + '" placeholder="+2 debt per inch of shadow removed"></div>' +
      '<div><label class="fl">Core cost before mods</label>' +
      '<input type="number" data-fk="fcc" data-forge="customCore" value="' + (e.customCore == null ? "" : e.customCore) + '" placeholder="' + PROF_BASE[e.prof] + '"></div>' +
      '</div><p class="tiny muted" style="margin:7px 0 0">Leave the cost blank to use the proficiency ' + e.prof + ' base of ' + PROF_BASE[e.prof] + ' debt.</p>';
  } else if(power === "Endings"){
    h += '<p class="tiny muted" style="margin:0 0 9px">Endings scales by how likely the ending already was. These tiers are self-contained — they replace the base debt.</p>';
    ENDINGS_TIERS.forEach(t => {
      h += '<label class="swtch" style="display:flex;align-items:flex-start;gap:9px;padding:6px 0;border-bottom:1px solid var(--rule)">' +
        '<input type="radio" name="etier" data-forge="tier" value="' + t.v + '" ' + (num(e.tier,30) === t.v ? "checked" : "") + ' style="margin-top:3px">' +
        '<span><b>' + t.v + ' debt — ' + esc(t.n) + '</b><br><span class="tiny muted">' + esc(t.ex) + '</span></span></label>';
    });
    h += '<label class="swtch" style="margin-top:10px"><input type="checkbox" data-forge="living" ' + (e.living?"checked":"") +
      '> Used on a living or sentient creature <span class="tiny muted">(+20 debt, applied before reductions)</span></label>';
  } else {
    h += '<p class="tiny muted" style="margin:0 0 9px">Set only the scales you actually use. Everything else stays at zero.</p>';
    scales.forEach(s => {
      const v = num(e.scales[s.k],0);
      let unit = s.unit;
      if(e.tradeoff && s.tradeUnit) unit = s.tradeUnit;
      const cost = s.banded ? bandedCost(v, s.banded) : Math.ceil(v * s.per);
      h += '<div style="padding:8px 0;border-bottom:1px solid var(--rule)">' +
        '<div class="row"><label class="fl" style="margin:0;flex:1">' + esc(s.n) + '</label>' +
        '<span class="tiny muted">' + (cost ? "+" + nf(cost) + " debt" : "—") + '</span></div>' +
        '<div class="row" style="margin-top:4px">' +
        '<input type="number" data-fk="fs' + s.k + '" data-forge="scale.' + s.k + '" value="' + v + '" step="' + (s.step||1) + '" min="0" style="max-width:130px">' +
        '<span class="tiny muted">' + esc(unit) + (e.tradeoff && s.tradeMult ? " × " + s.tradeMult : "") + '</span></div>' +
        '<p class="tiny muted" style="margin:4px 0 0">' + esc(s.hint) + '</p></div>';
    });
    if(power === "Mass" && num(e.scales.gal,0) > 0){
      h += '<div style="padding:8px 0;border-bottom:1px solid var(--rule)"><label class="fl" style="margin:0">Mass of the object being pulled</label>' +
        '<div class="row" style="margin-top:4px"><input type="number" data-fk="fobjkg" data-forge="objectKg" value="' + num(e.objectKg,0) + '" min="0" step="1" style="max-width:130px"><span class="tiny muted">kg</span></div>' +
        '<p class="tiny muted" style="margin:4px 0 0">Each kilogram over 100 adds +1 debt to a Gal pull. Leave at 0 for light objects.</p></div>';
    }
    if(power === "Flow"){
      h += '<div style="padding:8px 0"><label class="fl">Velocity multiplier</label>' +
        '<div class="row"><input type="number" data-fk="fvel" data-forge="velocity" value="' + Math.max(1,num(e.velocity,1)) + '" min="1" step="1" style="max-width:100px">' +
        '<span class="tiny muted">× — 2 = twice as fast or slow, 3 = three times. Multiplies the whole cost (base + seconds), before any reductions</span></div></div>';
    }
    const pt = predictedTier(e, S.campaign.tiers);
    if(pt){
      h += '<div style="margin-top:10px;padding:9px 11px;background:var(--blue-wash);border-radius:3px">' +
        '<b>Damage tier ' + pt.t + ' — ' + esc(pt.n) + '</b><br>' +
        '<span class="tiny">' + esc(tierEffect(pt)) + '. House rule, editable by the GM in campaign settings.</span></div>';
    }
  }
  h += '</div>';

  /* 3. universal mods */
  h += '<div class="card" style="margin-top:12px"><h2 class="sec">3. Universal mods</h2>' +
    '<div class="grid g2">';
  if(power !== "Law"){
    h += '<div><label class="fl">Area of effect — +1 debt per foot</label>' +
      '<input type="number" data-fk="faoe" data-forge="aoeFeet" value="' + num(e.aoeFeet,0) + '" min="0"></div>' +
      '<div><label class="fl">Of that, mutable shape — doubles those feet</label>' +
      '<input type="number" data-fk="faom" data-forge="aoeMutable" value="' + num(e.aoeMutable,0) + '" min="0" max="' + num(e.aoeFeet,0) + '"></div>';
  } else {
    h += '<div style="grid-column:1/-1"><p class="tiny muted" style="margin:0">Law can\'t take the area of effect mod — its own distance scale covers that.</p></div>';
  }
  h += '<div><label class="fl">Offset origin — +1 debt per foot</label>' +
    '<input type="number" data-fk="foff" data-forge="offsetFeet" value="' + num(e.offsetFeet,0) + '" min="0"></div>' +
    '<div><label class="fl">Looping — +10 debt each, max 10</label>' +
    '<input type="number" data-fk="flp" data-forge="loops" value="' + num(e.loops,0) + '" min="0" max="10"></div>';
  if(["Lumen","Mass","Flow","Exchange"].includes(power)){
    h += '<div><label class="fl">Escalate — doubles the running total per step</label>' +
      '<input type="number" data-fk="fesc" data-forge="escalate" value="' + num(e.escalate,0) + '" min="0" max="8"></div>' +
      '<div style="align-self:end"><p class="tiny muted" style="margin:0">Each step moves you up a unit — inches to feet, one degree to ten.</p></div>';
  }
  h += '</div></div>';

  /* 4. conditions and limitations */
  h += '<div class="card" style="margin-top:12px"><h2 class="sec">4. Conditions and limitations</h2>' +
    '<p class="tiny muted" style="margin:0 0 11px">These bring the cost down. They can\'t cancel each other out — they have to work together. ' +
    'Your action type comes out of whatever you pick here.</p>';

  h += '<h3 class="sub">Range</h3><select data-forge="range">' +
    RANGES.map(r => '<option value="' + r.k + '" ' + (e.range === r.k ? "selected" : "") + '>' +
      esc(r.n) + (r.v ? " (" + r.v + ")" : " (default, no reduction)") + ' — ' + esc(r.d) + '</option>').join("") + '</select>';

  h += '<h3 class="sub" style="margin-top:13px">Linked object</h3><div class="grid g2">' +
    '<div><label class="fl">How portable?</label><select data-forge="linkPort">' +
      LINK_PORT.map(o => '<option value="' + o.v + '" ' + (num(e.linkPort,0)===o.v?"selected":"") + '>' + esc(o.n) + (o.v?" ("+o.v+")":"") + '</option>').join("") + '</select></div>' +
    '<div><label class="fl">How distinctive?</label><select data-forge="linkDist">' +
      LINK_DIST.map(o => '<option value="' + o.v + '" ' + (num(e.linkDist,0)===o.v?"selected":"") + '>' + esc(o.n) + (o.v?" ("+o.v+")":"") + '</option>').join("") + '</select></div>' +
    '</div>' +
    ((e.linkPort || e.linkDist) ? '<div style="margin-top:8px"><label class="fl">The object</label>' +
      '<input type="text" data-fk="flo" data-forge="linkObject" value="' + esc(e.linkObject) + '" placeholder="A pair of worn-out sneakers"></div>' : "");

  h += '<h3 class="sub" style="margin-top:13px">Conditions</h3>';
  (e.conds||[]).forEach((cd, i) => {
    h += '<div class="row" style="margin-bottom:6px">' +
      '<select data-forge="cond.v.' + i + '" style="max-width:220px">' +
        COND_TIERS.map(t => '<option value="' + t.v + '" ' + (num(cd.v,0)===t.v?"selected":"") + '>' + esc(t.n) + ' (' + t.v + ') — ' + esc(t.d) + '</option>').join("") + '</select>' +
      '<input type="text" data-fk="fcd' + i + '" data-forge="cond.text.' + i + '" value="' + esc(cd.text||"") + '" placeholder="Knowing the target\'s full name" style="flex:1">' +
      '<button class="btn ghost sm" data-act="forge-delcond" data-i="' + i + '">×</button></div>';
  });
  h += '<button class="btn ghost sm" data-act="forge-addcond">Add a condition</button>';
  h += '<div style="margin-top:9px"><label class="fl">Or tie it to a saving throw</label><select data-forge="condSave">' +
    COND_SAVE.map(o => '<option value="' + o.v + '" ' + (num(e.condSave,0)===o.v?"selected":"") + '>' + esc(o.n) + (o.v?" ("+o.v+")":"") + '</option>').join("") + '</select></div>';

  h += '<h3 class="sub" style="margin-top:13px">Limitations</h3>';
  (e.limits||[]).forEach((cd, i) => {
    h += '<div class="row" style="margin-bottom:6px">' +
      '<select data-forge="limit.v.' + i + '" style="max-width:220px">' +
        LIMIT_TIERS.map(t => '<option value="' + t.v + '" ' + (num(cd.v,0)===t.v?"selected":"") + '>' + esc(t.n) + ' (' + t.v + ') — ' + esc(t.d) + '</option>').join("") + '</select>' +
      '<input type="text" data-fk="fli' + i + '" data-forge="limit.text.' + i + '" value="' + esc(cd.text||"") + '" placeholder="Only after sundown" style="flex:1">' +
      '<button class="btn ghost sm" data-act="forge-dellimit" data-i="' + i + '">×</button></div>';
  });
  h += '<button class="btn ghost sm" data-act="forge-addlimit">Add a limitation</button>';
  h += '</div>';

  /* 5. debt trade off */
  h += '<div class="card" style="margin-top:12px"><h2 class="sec">5. Debt trade off</h2>' +
    '<label class="swtch"><input type="checkbox" data-forge="tradeoff" ' + (e.tradeoff?"checked":"") +
    '> Turn this cost into permanent monthly rent</label>' +
    '<p class="tiny muted" style="margin:7px 0 0">You pay it every month whether you use the expression or not, but the scaling gets much better and ' +
    'activation only costs 20% of the monthly figure, rounded up. ' +
    (e.prof === 3 ? "At proficiency 3 this needs to be discussed with your GM." : "") + '</p>' +
    (e.tradeoff && e.prof <= 2 ? '<p class="tiny" style="margin:7px 0 0"><b>Better scaling at proficiency ' + e.prof + ':</b> ' + esc(tradeText(power, e.prof)) + '</p>' : "") +
    '</div>';

  /* reference */
  if(guided && REF[power]){
    h += refBlock(power);
    if(power === "Mass"){ h += refBlock("MassGal"); h += refBlock("MassDensity"); }
    if(power === "Lumen"){ h += refBlock("LumenVolt"); h += refBlock("LumenTesla"); }
    if(power === "Exchange"){ h += refBlock("ExchangeNewton"); h += refBlock("ExchangeCelsius"); }
  }

  h += '</div>';

  /* ---- right column: the ledger ---- */
  h += '<div style="position:sticky;top:96px">';
  h += '<div class="card"><h3 class="sub">Debt</h3>' +
    '<p class="bigdebt" style="margin:0 0 3px">' + nf(d.final) + '</p>' +
    '<p class="tiny muted" style="margin:0 0 10px">' + ACTIONS[actionOf(e)] + ' action · ' +
      esc((RANGES.find(x=>x.k===e.range)||RANGES[0]).n.toLowerCase()) + '</p>';
  if(e.tradeoff){
    h += '<div style="padding:8px 10px;background:var(--gold-wash);border-radius:3px;margin-bottom:10px">' +
      '<b>' + nf(d.monthly) + '</b> monthly rent<br><b>' + nf(d.activation) + '</b> to activate</div>';
  }
  h += '<div class="ledger">' +
    d.lines.map(l => '<div class="li"><span>' + esc(l[0]) + '</span><span>' + (l[1] >= 0 ? "+" : "") + nf(l[1]) + '</span></div>').join("") +
    '<div class="li sum"><span>Final debt</span><span>' + nf(d.final) + '</span></div></div>';
  if(d.floored) h += '<p class="tiny" style="margin:8px 0 0;color:var(--red)">Reductions took this below 1. No power is free — the floor is 1 debt.</p>';
  h += '</div>';

  h += '<div class="card" style="margin-top:10px"><h3 class="sub">Slots</h3>' +
    '<p class="tiny" style="margin:0">' + (e.isExpansion
      ? "An expansion takes no slot."
      : "This takes <b>" + e.prof + "</b> of your " + slotsTotal(c) + " slots. " +
        (slotsUsed(c) - (c.expressions.find(x=>x.id===e.id) ? num(c.expressions.find(x=>x.id===e.id).prof,0) : 0) + e.prof > slotsTotal(c)
          ? '<span style="color:var(--red)">That puts you over. Buy a slot for 10 XP or drop something.</span>' : "")) + '</p></div>';

  h += '<div class="card" style="margin-top:10px">' +
    '<button class="btn primary" style="width:100%" data-act="forge-save">Save to my sheet</button>' +
    '<button class="btn" style="width:100%;margin-top:7px" data-act="forge-submit">Save and send to the GM</button>' +
    '</div>';
  h += '</div></div>';
  return h;
}

function tradeText(power, prof){
  const t1 = {Endings:"the likelihood tier is halved", Flow:"seconds become minutes", Mass:"the base scale multiplies by 10",
    Law:"duration scales in minutes and distance in 5 foot steps", Lumen:"the base scale multiplies by 10", Exchange:"the base scale multiplies by 10"};
  const t2 = {Endings:"the likelihood tier is divided by 3", Flow:"all debt incurred is halved", Mass:"the base scale multiplies by 10",
    Law:"duration scales in 10 minute steps and distance in 5 foot steps", Lumen:"the base scale multiplies by 10", Exchange:"the base scale multiplies by 10"};
  return (prof === 1 ? t1 : t2)[power] || "";
}

function refBlock(key){
  const r = REF[key]; if(!r) return "";
  return '<details class="card" style="margin-top:12px"><summary style="cursor:pointer;font-family:var(--f-cond);font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:12px;color:var(--ink-2)">' +
    esc(r.title) + '</summary><div class="tw" style="margin-top:9px"><table class="t"><thead><tr>' +
    r.cols.map(c => '<th>' + esc(c) + '</th>').join("") + '</tr></thead><tbody>' +
    r.rows.map(row => '<tr>' + row.map(cell => '<td>' + esc(cell) + '</td>').join("") + '</tr>').join("") +
    '</tbody></table></div></details>';
}
/* ---------- equipment ----------------------------------------------------- */
function allGear(){ return GEAR.concat((S.campaign && S.campaign.gear) || []); }

function viewGear(c){
  const ed = canEditChar(c);
  const res = num(c.bg.resources,0);
  const cats = ["Melee","Ranged","Explosive","Armor","Comms","Kit"];
  let h = '<div class="banner"><span>Equipment</span></div>';
  h += '<p class="tiny muted" style="margin-top:-6px">Gear costs no XP. What you can simply have is gated on your Resources background, ' +
    'currently level <b>' + res + '</b>. Everyday items are free to anyone. Anything above your level you have to acquire in play — the GM decides how.</p>';

  h += '<div class="card"><h3 class="sub">Carried</h3>';
  if(!c.gear.length) h += '<p class="tiny muted" style="margin:0">Nothing equipped.</p>';
  else {
    h += '<div class="tw"><table class="t"><thead><tr><th>Item</th><th>Effect</th><th>Note</th><th></th></tr></thead><tbody>';
    c.gear.forEach((g, i) => {
      const def = allGear().find(x => x.id === g.id);
      if(!def) return;
      h += '<tr><td><b>' + esc(def.n) + '</b><div class="tiny muted">' + esc(def.cat) + '</div></td>' +
        '<td>' + (def.dmg !== "—" ? '<b>' + esc(def.dmg) + '</b>. ' : "") + esc(def.note) + '</td>' +
        '<td><input type="text" data-fk="gn' + i + c.id + '" data-bind="gear.note." data-i="' + i + '" data-c="' + c.id + '" ' +
          (ed?"":"disabled") + ' value="' + esc(g.note||"") + '" placeholder="Nickname, ammo, condition"></td>' +
        '<td>' + (ed ? '<button class="btn ghost sm" data-act="delgear" data-i="' + i + '" data-c="' + c.id + '">×</button>' : '') + '</td></tr>';
    });
    h += '</tbody></table></div>';
  }
  h += '</div>';

  cats.forEach(cat => {
    const items = allGear().filter(g => g.cat === cat);
    if(!items.length) return;
    h += '<div class="card" style="margin-top:12px"><h2 class="sec">' + esc(cat) + '</h2><div class="tw"><table class="t">' +
      '<thead><tr><th>Item</th><th>Examples</th><th>Damage</th><th>Notes</th><th class="num">Res</th><th></th></tr></thead><tbody>';
    items.forEach(g => {
      const locked = num(g.res,1) > res;
      h += '<tr style="' + (locked ? "opacity:.55" : "") + '"><td><b>' + esc(g.n) + '</b>' +
        (g.canon ? "" : ' <span class="tiny muted">house</span>') + '</td>' +
        '<td class="tiny muted">' + esc(g.ex) + '</td>' +
        '<td>' + esc(g.dmg) + '</td>' +
        '<td class="tiny">' + esc(g.note) + '</td>' +
        '<td class="num">' + num(g.res,1) + '</td>' +
        '<td>' + (ed ? '<button class="btn ghost sm" data-act="addgear" data-g="' + g.id + '" data-c="' + c.id + '">' +
          (locked ? "Acquire" : "Take") + '</button>' : '') + '</td></tr>';
    });
    h += '</tbody></table></div></div>';
  });

  if(isGM()){
    h += '<div class="card" style="margin-top:12px"><h2 class="sec">Add a custom item</h2>' +
      '<p class="tiny muted" style="margin:0 0 9px">Follow the same paradigm: a damage type and modifier, or a flat number of levels.</p>' +
      '<div class="grid g2">' +
      '<div><label class="fl">Name</label><input type="text" id="cgn" data-fk="cgn"></div>' +
      '<div><label class="fl">Category</label><select id="cgc">' + cats.map(x => '<option>' + x + '</option>').join("") + '</select></div>' +
      '<div><label class="fl">Examples</label><input type="text" id="cge" data-fk="cge"></div>' +
      '<div><label class="fl">Damage</label><input type="text" id="cgd" data-fk="cgd" placeholder="Bashing +3, or Lethal, 1 level"></div>' +
      '<div style="grid-column:1/-1"><label class="fl">Notes</label><input type="text" id="cgnote" data-fk="cgnote"></div>' +
      '<div><label class="fl">Resources level</label><select id="cgr"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></div>' +
      '</div><div class="row" style="margin-top:10px"><button class="btn primary" data-act="addcustomgear">Add to the campaign</button></div></div>';
  }
  return h;
}

/* ---------- XP ledger ------------------------------------------------------ */

      '<input type="text" id="xpnote" data-fk="xpnote" placeholder="Play of the game" style="flex:1">' +

/* ---------- session tracker ------------------------------------------------ */
function viewPlay(c){
  const ed = canEditChar(c);
  const pen = dmgPenalty(c);
  const owed = debtThisMonth(c), earned = num(c.goodwill,0);
  const standing = monthlyRent(c);
  let h = '<div class="banner"><span>Session tracker</span></div>';

  /* actions available */
  h += '<div class="card"><h2 class="sec">Your turn</h2><div class="row">' +
    '<span class="chip hi">1 standard</span><span class="chip hi">1 move</span>' +
    '<span class="chip hi">' + freeActions(c) + ' free</span>' +
    '<span class="tiny muted">Free actions equal the higher of your Intelligence or Dexterity modifier, minimum 1.</span></div>' +
    '<p class="tiny muted" style="margin:8px 0 0">Expressions default to a free action. Conditions you took can push one to standard, full round or triggered.</p></div>';

  /* damage */
  h += '<div class="card" style="margin-top:12px"><h2 class="sec">Damage</h2>';
  [["bashing","Bashing",6],["stun","Stun",6],["lethal","Lethal",3]].forEach(([k, label, max]) => {
    const v = num(c.dmg[k],0);
    h += '<div style="padding:8px 0;border-bottom:1px solid var(--rule)">' +
      '<div class="row"><span style="font-family:var(--f-cond);font-weight:700;letter-spacing:.06em;text-transform:uppercase;min-width:74px">' + label + '</span>' +
      '<span class="track">' + Array.from({length:max}, (_,i) =>
        '<button class="box ' + (k === "lethal" ? "lethal " : "") + (i < v ? "on" : "") + '" data-act="dmg" data-k="' + k + '" data-n="' + (i+1) + '" data-c="' + c.id + '" ' +
        (ed?"":"disabled") + ' aria-label="' + label + ' level ' + (i+1) + '"></button>').join("") + '</span>' +
      (v ? '<button class="btn ghost sm" data-act="dmg" data-k="' + k + '" data-n="0" data-c="' + c.id + '">Clear</button>' : '') + '</div>' +
      (v ? '<p class="tiny" style="margin:5px 0 0;color:' + (k === "lethal" ? "var(--red)" : "var(--ink-2)") + '">' +
        esc(k === "lethal" ? DMG_LETHAL[Math.min(v,3)-1] : DMG_BASH[Math.min(v,6)-1]) + '</p>' : '') +
      '<p class="tiny muted" style="margin:4px 0 0">' + esc(HEAL_NOTES[k]) + '</p></div>';
  });
  h += '<p class="tiny" style="margin:9px 0 0">' + (pen ? 'Currently <b>' + pen + '</b> to every combat and saving roll, already applied everywhere in the app.' : 'No penalties right now.') + '</p>' +
    '<p class="tiny muted" style="margin:5px 0 0">Lethal damage can\'t be soaked unless you\'re using an expression or wearing armor, and it incapacitates immediately.</p></div>';

  /* rent */
  const ob = overBudget(c);
  h += '<div class="card" style="margin-top:12px"><h2 class="sec">Rent</h2><div class="grid g3">' +
    '<div><h3 class="sub">Owed this month</h3><p class="bigdebt" style="color:' + (ob.over ? "var(--red)" : "var(--ink)") + '">' + nf(owed) + '</p></div>' +
    '<div><h3 class="sub">Goodwill earned</h3><div class="row">' + stepper("goodwill", "goodwill", earned, ed, c.id, 0, null) + '</div>' +
      '<div class="row" style="margin-top:6px"><input type="number" id="gwamt" data-fk="gwamt" placeholder="Amount" style="max-width:90px">' +
      '<button class="btn sm" data-act="addgoodwill" data-c="' + c.id + '">Add a gig</button></div></div>' +
    '<div><h3 class="sub">Standing rent</h3><div class="row">' +
      '<input type="number" data-fk="srent" data-bind="standingRent" data-c="' + c.id + '" ' + (ed?"":"disabled") +
      ' value="' + num(c.standingRent,0) + '" style="max-width:90px"></div>' +
      '<p class="tiny muted" style="margin:5px 0 0">' + nf(standing) + ' total, including traded expressions.</p></div>' +
    '</div>' +
    '<div class="meter" style="margin-top:10px"><i class="' + (earned >= owed ? "ok" : "") + '" style="width:' +
      (owed > 0 ? clamp(Math.round(earned/owed*100),0,100) : 100) + '%"></i></div>' +
    '<p class="tiny" style="margin:6px 0 0">' + (earned >= owed
      ? '<span style="color:var(--green)">Rent is covered.</span>'
      : '<span style="color:var(--red)">' + nf(owed - earned) + ' short.</span> Goodwill comes from gigs you were specifically asked to do. Badwill counts.') + '</p></div>';

  /* campaign budget — separate from the rent/goodwill comparison above:
     this checks the same "owed" total against a single number the GM sets
     for the whole table, rather than what you've personally earned. */
  h += '<div class="card" style="margin-top:12px;' + (ob.over ? "border-color:var(--red)" : "") + '"><h2 class="sec">Campaign budget</h2>';
  if(!ob.set){
    h += '<p class="tiny muted" style="margin:0">Your GM hasn\'t set a campaign-wide goodwill budget yet. ' +
      'Once they do, from Campaign Settings, your debt this month will be checked against it here and turn red if you go over.</p>';
  } else {
    h += '<div class="grid g3">' +
      '<div><h3 class="sub">Budget</h3><p class="bigdebt" style="color:var(--ink)">' + nf(ob.budget) + '</p>' +
      '<p class="tiny muted" style="margin:2px 0 0">Set by your GM · everyone in the campaign is compared against this same number.</p></div>' +
      '<div><h3 class="sub">Your debt this month</h3><p class="bigdebt" style="color:' + (ob.over ? "var(--red)" : "var(--ink)") + '">' + nf(ob.owed) + '</p></div>' +
      '<div><h3 class="sub">' + (ob.over ? "Over by" : "Room left") + '</h3><p class="bigdebt" style="color:' + (ob.over ? "var(--red)" : "var(--green)") + '">' +
        (ob.over ? nf(ob.diff) : nf(ob.budget - ob.owed)) + '</p></div>' +
      '</div>' +
      '<div class="meter" style="margin-top:10px"><i class="' + (ob.over ? "" : "ok") + '" style="width:' + clamp(Math.round(ob.owed/ob.budget*100),0,100) + '%"></i></div>' +
      '<p class="tiny" style="margin:6px 0 0">' + (ob.over
        ? '<span style="color:var(--red)">You\'re over the campaign budget.</span> Your GM can see this on their dashboard too.'
        : '<span style="color:var(--green)">Within budget.</span>') + '</p>';
  }
  h += '</div>';

  /* debt log */
  h += '<div class="card" style="margin-top:12px"><h2 class="sec">Debt spent</h2>';
  if(ed && c.expressions.length){
    h += '<div class="row" style="margin-bottom:10px"><select id="usexpr" style="flex:1">' +
      c.expressions.map(e => '<option value="' + e.id + '">' + esc(e.name || "Untitled") + ' — ' +
        (e.tradeoff ? computeDebt(e).activation + " to activate" : computeDebt(e).final + " debt") + '</option>').join("") +
      '</select><button class="btn primary sm" data-act="useexpr" data-c="' + c.id + '">Use it</button></div>';
  }
  if(!(c.debtLog||[]).length) h += '<p class="tiny muted" style="margin:0">Nothing spent this month.</p>';
  else {
    h += '<div class="ledger">' + c.debtLog.slice().reverse().map((l, ri) =>
      '<div class="li"><span>' + esc(l.note) + ' <span class="tiny muted">' + new Date(l.at).toLocaleString() + '</span></span>' +
      '<span>' + nf(num(l.amount,0)) + '</span></div>').join("") + '</div>';
    if(ed) h += '<div class="row" style="margin-top:10px"><button class="btn ghost sm" data-act="newmonth" data-c="' + c.id + '">Start a new month</button>' +
      '<span class="tiny muted">Clears the log and the goodwill, keeps standing rent.</span></div>';
  }
  h += '<p class="tiny muted" style="margin:9px 0 0">If a single fight costs you more than 25% of the gig\'s goodwill, the GM may enforce the spending limit: ' +
    'contested d20 rolls, and on a loss you make a DC 10 luck roll every time you reach for an expression.</p></div>';

  return h;
}

/* ---------- GM approvals --------------------------------------------------- */
function pendingApprovals(){
  const out = [];
  S.chars.forEach(c => (c.expressions||[]).forEach(e => { if(e.status === "pending") out.push({c, e}); }));
  return out;
}
function viewApprovals(){
  if(!isGM()) return '<div class="empty"><p>Only the GM sees this.</p></div>';
  const pend = pendingApprovals();
  let h = '<div class="banner"><span>Approvals</span></div>';
  if(!pend.length) h += '<div class="empty"><p>Nothing waiting. The crew is either well behaved or up to something.</p></div>';
  pend.forEach(p => {
    const d = computeDebt(p.e);
    const overProf = p.e.prof > S.campaign.prof;
    const overXp = xpAvailable(p.c) < 0;
    const overSlot = slotsUsed(p.c) > slotsTotal(p.c);
    h += '<div class="card" style="margin-bottom:12px">' +
      '<div class="row"><b style="font-family:var(--f-display);font-size:17px;font-weight:400">' + esc(p.e.name || "Untitled") + '</b>' +
      '<span class="pill p' + p.e.prof + '">P' + p.e.prof + '</span>' +
      '<span class="tiny muted">' + esc(p.c.name || "Unnamed") + ' · ' + esc(p.e.power) + '</span>' +
      '<span class="right"><b style="color:var(--red);font-size:18px">' + nf(d.final) + '</b> <span class="tiny muted">debt</span></span></div>';
    if(overProf || overXp || overSlot){
      h += '<div style="margin:8px 0;padding:7px 10px;background:var(--gold-wash);border-radius:3px" class="tiny">' +
        (overProf ? '<div>Proficiency ' + p.e.prof + ' in a proficiency ' + S.campaign.prof + ' campaign.</div>' : '') +
        (overXp ? '<div>This character is ' + Math.abs(xpAvailable(p.c)) + ' XP over budget.</div>' : '') +
        (overSlot ? '<div>Using ' + slotsUsed(p.c) + ' of ' + slotsTotal(p.c) + ' slots.</div>' : '') + '</div>';
    }
    h += '<p class="hand" style="margin:6px 0">' + esc(p.e.desc || "No description given.") + '</p>' +
      '<div class="row tiny muted" style="gap:10px;margin-bottom:7px">' +
      '<span>' + ACTIONS[actionOf(p.e)] + ' action</span>' +
      '<span>' + esc((RANGES.find(x=>x.k===p.e.range)||RANGES[0]).n) + '</span>' +
      (p.e.tradeoff ? '<span>Traded — ' + nf(d.monthly) + ' monthly, ' + nf(d.activation) + ' activation</span>' : '') +
      '</div>' + condSummary(p.e) +
      '<details style="margin-top:9px"><summary class="tiny" style="cursor:pointer;color:var(--ink-2)">Show the maths</summary>' +
      '<div class="ledger" style="margin-top:7px">' + d.lines.map(l =>
        '<div class="li"><span>' + esc(l[0]) + '</span><span>' + (l[1]>=0?"+":"") + nf(l[1]) + '</span></div>').join("") +
      '<div class="li sum"><span>Final</span><span>' + nf(d.final) + '</span></div></div></details>' +
      '<div class="row" style="margin-top:11px">' +
      '<input type="text" id="gmn_' + p.e.id + '" data-fk="gmn_' + p.e.id + '" placeholder="Note back to the player" style="flex:1" value="' + esc(p.e.gmNote||"") + '">' +
      '<button class="btn primary sm" data-act="approve" data-c="' + p.c.id + '" data-e="' + p.e.id + '">Approve</button>' +
      '<button class="btn sm danger" data-act="reject" data-c="' + p.c.id + '" data-e="' + p.e.id + '">Request changes</button>' +
      '</div></div>';
  });
  return h;
}

/* ---------- campaign settings ---------------------------------------------- */
function viewCampaign(){
  if(!isGM()){
    return '<div class="banner"><span>Campaign settings</span></div>' +
      '<div class="empty"><p>The GM here is <b>' + esc((S.campaign && S.campaign.gmName) || "unknown") +
      '</b>. Only they see the full settings and approval queue.</p></div>';
  }
  const cp = S.campaign;
  const tiers = cp.tiers || DEFAULT_TIERS;
  let h = '<div class="banner"><span>Campaign settings</span></div>';
  h += '<div class="card"><div class="grid g2">' +
    '<div><label class="fl">Name</label><input type="text" data-fk="cpn" data-camp="name" value="' + esc(cp.name) + '"></div>' +
    '<div><label class="fl">Code — players join with this</label><input type="text" value="' + esc(cp.code) + '" readonly style="background:var(--paper-3)"></div>' +
    '<div><label class="fl">Game mode</label><select data-camp="mode">' +
      GAME_MODES.map(m => '<option ' + (m === cp.mode ? "selected" : "") + '>' + esc(m) + '</option>').join("") + '</select></div>' +
    '<div><label class="fl">Proficiency level</label><select data-camp="prof">' +
      [1,2,3].map(p => '<option value="' + p + '" ' + (num(cp.prof,1)===p?"selected":"") + '>' + p + '</option>').join("") + '</select></div>' +
    '<div><label class="fl">Rent day</label><input type="date" data-camp="rentDate" value="' + (cp.rentDue ? new Date(cp.rentDue).toISOString().slice(0,10) : "") + '"></div>' +
    '<div><label class="fl">Enforce the spending limit</label><select data-camp="spendLimit">' +
      '<option value="0" ' + (!cp.spendLimit?"selected":"") + '>Off</option><option value="1" ' + (cp.spendLimit?"selected":"") + '>On</option></select></div>' +
    '<div><label class="fl">Campaign goodwill budget</label><input type="number" data-camp="goodwillBudget" min="0" value="' + num(cp.goodwillBudget,0) + '" placeholder="0 = not set"></div>' +
    '</div>' +
    '<p class="tiny muted" style="margin:10px 0 0">Game mode is a label the table agrees on — the book never spells out its mechanics, so nothing in the app keys off it. ' +
    'Leave the goodwill budget at 0 to turn off the over-budget warning entirely; set it above 0 and every player\'s debt this month is compared against it, on their own sheet and on your dashboard here.</p></div>';

  h += '<div class="card" style="margin-top:12px"><h2 class="sec">Damage tiers</h2>' +
    '<p class="tiny muted" style="margin:0 0 9px">The book gives injury descriptions for its mass, joule and newton scales but never a damage modifier. ' +
    'This table is the bridge, and it is a house rule — edit it to taste. The forge reads it live.</p>' +
    '<div class="tw"><table class="t"><thead><tr><th class="num">Tier</th><th>Name</th><th>Mass</th><th>Joules</th><th>Newtons</th><th>Type</th><th class="num">Mod</th><th class="num">Levels</th></tr></thead><tbody>';
  tiers.forEach((t, i) => {
    h += '<tr><td class="num">' + t.t + '</td><td>' + esc(t.n) + '</td>' +
      '<td class="tiny muted">' + esc(t.kg) + '</td><td class="tiny muted">' + esc(t.j) + '</td><td class="tiny muted">' + esc(t.nt) + '</td>' +
      '<td><select data-tier="type" data-i="' + i + '" style="min-width:92px">' +
        '<option value="bashing" ' + (t.type==="bashing"?"selected":"") + '>Bashing</option>' +
        '<option value="stun" ' + (t.type==="stun"?"selected":"") + '>Stun</option>' +
        '<option value="lethal" ' + (t.type==="lethal"?"selected":"") + '>Lethal</option></select></td>' +
      '<td class="num"><input type="number" data-fk="tm' + i + '" data-tier="mod" data-i="' + i + '" value="' + num(t.mod,0) + '" style="width:54px;text-align:center"></td>' +
      '<td class="num"><input type="number" data-fk="tl' + i + '" data-tier="lv" data-i="' + i + '" value="' + num(t.lv,0) + '" style="width:54px;text-align:center"></td></tr>';
  });
  h += '</tbody></table></div>' +
    '<div class="row" style="margin-top:10px"><button class="btn ghost sm" data-act="resettiers">Reset to the suggested table</button></div></div>';

  h += '<div class="card" style="margin-top:12px"><h2 class="sec">Crew</h2><div class="tw"><table class="t">' +
    '<thead><tr><th>Character</th><th>Style</th><th class="num">XP left</th><th class="num">Slots</th><th>GM edit</th><th></th></tr></thead><tbody>' +
    S.chars.map(c => '<tr><td><b>' + esc(c.name || "Unnamed") + '</b></td>' +
      '<td class="tiny muted">' + esc(STYLES[c.styleKey].nick) + ' · p' + c.prof + '</td>' +
      '<td class="num" style="' + (xpAvailable(c) < 0 ? "color:var(--red);font-weight:700" : "") + '">' + xpAvailable(c) + '</td>' +
      '<td class="num" style="' + (slotsUsed(c) > slotsTotal(c) ? "color:var(--red);font-weight:700" : "") + '">' + slotsUsed(c) + '/' + slotsTotal(c) + '</td>' +
      '<td class="tiny">' + (c.allowGmEdit ? "Allowed" : "View only") + '</td>' +
      '<td><button class="btn ghost sm" data-act="open" data-c="' + c.id + '">Open</button></td></tr>').join("") +
    '</tbody></table></div></div>';
  return h;
}

il someone puts real effort into forcing it.","Everyday (30)",30,"Defeated by force or a different route. Raise the tier for steel doors."],["Endings","B","Seize the Machinery","Trap","A conveyor, gate or elevator stops mid-travel with its load still on it.","Mundane, uncommon (40)",40,"Ends the motion, not the machine. Someone can restart it."],["Endings","B","Burst Pipe","Environment","A pipe fails and floods a corridor. Slows pursuit, covers sound and makes floors treacherous.","Mundane, uncommon (40)",40,"Needs an existing pipe. The flood is only as big as the supply."],["Endings","B","Blackout","Environment","The lights end in a room. A whole city block losing power is Extremely Rare (60).","Everyday (30)",30,"Backup generators and emergency lighting kick in."],["Endings","B","Snuff Out","Environment","A flame ends (candle, campfire, stove burner). Clears fire hazards or removes a signal light.","Everyday (30)",30,"Cannot end an accelerant fire or an explosion in progress."],["Endings","B","Snap the Cable","Bind / Break","A rope, chain or cable fails. Drops a hanging load or frees a bound ally.","Rare (50)",50,"Heavier or thicker material pushes the tier up. Cable must be under strain."],["Endings","B","Seize the Hinges","Seal","Hinges seize solid. Locks a gate, hatch or car door in place.","Rare (50)",50,"Can be pried or broken. Delays more than it secures."],["Endings","B","Fuse Burns Out","Environment","A fuse ends and kills a circuit without touching the wiring. Quiet sabotage.","Everyday (30)",30,"Replaceable in a minute by anyone who finds the box."],["Endings","C","Dead Phone","Espionage","A bug, phone or recorder dies at the moment it matters.","Everyday (30)",30,"Device must be in sight or in mind's eye. Cloud backups already uploaded remain."],["Endings","C","Cut the Cameras","Heist","A security camera's feed ends, giving a short window of privacy.","Everyday (30)",30,"Cameras on a network show a dead feed. Someone may investigate."],["Endings","C","S ng glue, epoxy or paint by 30 seconds so it holds right away.","30 s ahead",50,"Concrete and slow cures need hours; this does not help."],["Flow","B","Melt the Ice","Environment","Fast-forward an already thawing ice patch or frozen lock by 20 seconds so it gives way.","20 s ahead",40,"Frozen solid at deep cold? 20 seconds changes nothing."],["Flow","C","Perfect Timing","Daily life","Skip 10 seconds ahead of yourself to catch the bus or the closing elevator doors.","10 s ahead",30,"Only moves you. Everyone else keeps their own clock."],["Flow","C","Steep It","Cooking","Fast-forward 1 minute of steeping or resting so tea or dough is ready.","60 s ahead",80,"Only a minute's worth of cooking."],["Flow","C","Un-Drop","Daily life","Rewind a dropped phone or plate 1 second back to your hand.","1 s back",23,"Must be caught within 1 second of the drop."],["Flow","C","Dry Fast","Daily life","Fast-forward wet laundry, paint or hair by 30 seconds.","30 s ahead",50,"Damp things only. Soaked clothes need more time."],["Flow","C","Undo the Typo","Craft","Rewind a pen mark or scribble 2 seconds.","2 s back",26,"Only ink that was just laid down."],["Flow","C","Hurry the Kettle","Cooking","Fast-forward a kettle that is already heating by 20 seconds so it boils now.","20 s ahead",40,"Only if it is within 20 seconds of boiling."],["Flow","C","Replay the Spill","Daily life","Rewind a spill 3 seconds so the liquid returns to its cup.","3 s back",29,"3 seconds. Splashes that hit the floor are gone."],["Flow","C","Skip the Wait","Daily life","Fast-forward yourself 5 seconds through an awkward pause.","5 s ahead",25,"Others are not part of the skip."],["Mass","A","Light Steps","Stealth","Shed 30 kg. You trigger no pressure plates, creaky floors or snapping twigs.","30 kg",50,"Personal. You still make footprints in soft ground."],["Mass","A","Immovable","Defense / Strength vs shoves","Add 50 kg to yourself so shoves and grapples barely move you.","50 kg",70,"You are heavier for the duration: function p1Entry(title){
  const e = P1_ENTRIES.find(x => x[2] === title);
  if(e) return {debt:e[6]};
  const g = P1_GAL.find(x => x[1] === title);
  return g ? {debt:g[5]} : null;
}
function p1Dot(p){ return '<span class="moddot" style="background:' + P1_COLORS[p] + ';margin-right:6px"></span>'; }

    rows.map(r => '<tr><td class="tiny" style="min-width:110px">' + esc(r.stat) + '</td>' +

}

      '<p style="margin:0 0 8px"><b>Cost.</b> 20 base + 1 per Gal + 1 per kilogram of the object over 100 kg. Acceleration is Gal ÷ 100 in m/s². The expression forge has a "Mass of the object being pulled" box that applies the mass guard.</p></div>' +
      '<div class="card" style="margin-top:12px"><h3 class="sub">What each Gal level does in 3 seconds</h3><div class="tw"><table class="t"><thead><tr><th>Pull</th><th>Acceleration</th><th>Speed after 3 s</th><th>Distance in 3 s</th><th class="num">Debt</th><th>Feels like</th></tr></thead><tbody>' +
      P1_GAL_SCALE.map(r => '<tr><td><b>' + esc(r[0]) + '</b></td><td class="tiny">' + esc(r[1]) + '</td><td class="tiny">' + esc(r[2]) + '</td><td class="tiny">' + esc(r[3]) + '</td><td class="num"><b>' + esc(r[4]) + '</b></td><td class="tiny muted">' + esc(r[5]) + '</td></tr>').join("") +
      '</tbody></table></div><p class="tiny muted" style="margin:6px 0 0">Debt is 20 base + Gal for an object under 100 kg.</p></div>';
    ["A","B","C"].forEach(s => {
      h += '<div class="card" style="margin-top:12px"><h3 class="sub">Set ' + s + ' · ' + P1_SETS[s] + '</h3>' +
        p1Table(P1_GAL.filter(x => x[0] === s).map(x => ({stat:x[2], title:x[1], how:x[3], scale:x[4], debt:x[5], limits:x[6]}))) + '</div>';
    });
  } else {
    const p = P1_POWERS.includes(tab) ? tab : "Endings";
    h += '<div class="card"><h2 class="sec">' + p1Dot(p) + esc(p) + '</h2><p class="tiny muted" style="margin:0 0 6px"><b>' + esc(P1_STYLE[p]) + '</b></p>' +
      P1_INTRO[p].map(t => '<p class="tiny" style="margin:0 0 4px">' + esc(t) + '</p>').join("") + '</div>';
    ["A","B","C"].forEach(s => {
      h += '<div class="card" style="margin-top:12px"><h3 class="sub">Set ' + s + ' · ' + P1_SETS[s] + '</h3>' +
        p1Table(P1_ENTRIES.filter(x => x[0] === p && x[1] === s).map(x => ({stat:x[3], title:x[2], how:x[4], scale:x[5], debt:x[6], limits:x[7]}))) + '</div>';
    });
  }
  return h;
}

/* ---------- NPCs (GM only) -------------------------------------------------- */
function viewNpcs(){
  if(!isGM()) return '<div class="empty"><p>Only the GM sees this.</p></div>';
  let h = '<div class="row"><div class="banner" style="margin:0"><span>NPCs</span></div>' +
    '<span class="right"><button class="btn primary sm" data-act="npc-new">New NPC</button></span></div>' +
    '<p class="tiny muted" style="margin:-4px 0 14px">Only you can see this roster — players never have access to it, on screen or in the database.</p>';

  const list = S.npcs || [];
  if(!list.length){
    h += '<div class="empty"><p>No NPCs yet.</p><button class="btn primary" data-act="npc-new">Create your first NPC</button></div>';
    return h;
  }

  NPC_TYPE_KEYS.forEach(tk => {
    const group = list.filter(n => n.type === tk);
    if(!group.length) return;
    h += '<h2 class="sec" style="margin-top:16px">' + esc(NPC_TYPES[tk].n) + '</h2><div class="grid g3">';
    group.forEach(n => { h += npcCard(n); });
    h += '</div>';
  });
  return h;
}
function npcCard(n){
  const role = NPC_ROLES.find(x => x.k === n.role);
  const org = npcOrgLabel(n);
  const w = n.wounds || {current:0,max:10};
  const hurt = w.max > 0 ? clamp(Math.round(w.current / w.max * 100), 0, 100) : 0;
  return '<div class="npccard" data-act="npc-edit" data-id="' + n.id + '">' +
    '<div class="row" style="margin-bottom:4px"><h4 style="flex:1">' + (n.moduleColor ? '<span class="moddot" title="From a module" style="background:' + moduleColor(n.moduleColor).hex + ';margin-right:6px"></span>' : '') + esc(n.name || "Unnamed NPC") + '</h4>' +
    (role ? '<span class="pill role-' + role.k + '">' + esc(role.n) + '</span>' : '') + '</div>' +
    '<div class="styl" style="font-family:var(--f-hand);font-size:13.5px;color:var(--ink-2);margin-bottom:6px">' + esc(npcTypeLabel(n)) +
    (org ? ' · ' + esc(org) : '') + '</div>' +
    '<div class="row" style="gap:5px;margin-bottom:6px">' +
    '<span class="chip">Def <b>' + num(n.combat.defense,10) + '</b></span>' +
    '<span class="chip">Soak <b>' + sign(num(n.combat.soak,0)) + '</b></span>' +
    '<span class="chip">Mel <b>' + sign(num(n.combat.melee,0)) + '</b></span>' +
    '<span class="chip">Rng <b>' + sign(num(n.combat.ranged,0)) + '</b></span></div>' +
    '<div class="meter"><i style="width:' + hurt + '%;background:var(--red)"></i></div>' +
    '<div class="tiny muted" style="margin-top:3px">' + num(w.current,0) + ' / ' + num(w.max,10) + ' wounds</div>' +
    '</div>';
}

/* ---------- Modules ---------------------------------------------------------
   GM: a library of reusable adventure modules, attachable to any campaign
   they run, with per-scene / per-map "reveal to players" switches.
   Players: only what the GM has revealed — and even then only the
   player-safe slice (no GM Notes, no sample dialogue, no NPC sheets). */
function modBadge(colorKey, text){
  const c = moduleColor(colorKey);
  return '<span class="modbadge" style="background:' + c.hex + '"><span class="moddot" style="background:#fff;border-color:rgba(255,255,255,.6)"></span>' + esc(text) + '</span>';
}
function modLines(arr){ return (arr||[]).filter(x => String(x).trim()); }
function olList(arr){ const a = modLines(arr); return a.length ? '<ol style="margin:0;padding-left:20px">' + a.map(x => '<li>' + esc(x) + '</li>').join("") + '</ol>' : ''; }
function ulList(arr){ const a = modLines(arr); return a.length ? '<ul style="margin:0;padding-left:20px">' + a.map(x => '<li>' + esc(x) + '</li>').join("") + '</ul>' : ''; }
function paras(text){ return String(text||"").split(/\n\s*\n/).filter(x => x.trim()).map(x => '<p style="margin:0 0 7px">' + esc(x).replace(/\n/g,"<br>") + '</p>').join(""); }
function secBlock(label, inner){ return inner ? '<div class="sechead">' + esc(label) + '</div>' + inner : ''; }

/* Rebuild the player-visible copy of a module for one campaign. */
function syncCampaignModule(m, cm){
  cm.moduleName = m.name; cm.color = m.color;
  cm.acts = (m.acts||[]).map(a => ({id:a.id, name:a.name, sceneIds:(a.scenes||[]).map(s => s.id)}));
  cm.revealed = cm.revealed || {scenes:{}, maps:{}};
  const sc = {}, mp = {};
  Object.keys(cm.revealed.scenes||{}).forEach(id => {
    const f = cm.revealed.scenes[id] ? findScene(m, id) : null;
    if(f) sc[id] = playerSafeScene(f.scene); else delete cm.revealed.scenes[id];
  });
  Object.keys(cm.revealed.maps||{}).forEach(id => {
    const f = cm.revealed.maps[id] ? findMap(m, id) : null;
    if(f) mp[id] = playerSafeMap(f); else delete cm.revealed.maps[id];
  });
  cm.revealedContent = {scenes:sc, maps:mp};
  cm.updatedAt = Date.now();
  return cm;
}

function viewModules(){
  if(!isGM()) return viewModulesPlayer();
  const open = S.openModuleId ? S.modules.find(x => x.id === S.openModuleId) : null;
  if(open) return viewModuleDetail(open);

  let h = '<div class="row"><div class="banner" style="margin:0"><span>Modules</span></div><span class="right row">' +
    '<button class="btn primary sm" data-act="mod-new">New module</button></span></div>' +
    '<p class="tiny muted" style="margin:-4px 0 14px">Your module library belongs to your account, so you can attach the same adventure to any campaign you run. ' +
    'Players only ever see the scenes and maps you reveal to them — never GM Notes, sample dialogue, or NPC sheets.</p>';

  const haveSeed = S.modules.some(x => x.seedKey === "flat_earth_1");
  if(!haveSeed){
    h += '<div class="card tape" style="margin-bottom:14px"><h2 class="sec">Ready-made: Flat Earth Saga</h2>' +
      '<p class="tiny muted" style="margin:0 0 9px">Module 1, from the book — 4 acts, 8 scenes, 10 NPC sheets, and 5 graph-paper maps. Importing adds a private copy to your library.</p>' +
      '<button class="btn primary sm" data-act="mod-seed">Add Flat Earth Saga to my library</button></div>';
  }
  if(!S.modules.length){
    return h + '<div class="empty"><p>No modules in your library yet.</p></div>';
  }
  h += '<div class="grid g2">';
  S.modules.forEach(m => {
    const c = moduleColor(m.color);
    const cm = findCampaignModule(m.id);
    const nScenes = allScenes(m).length;
    h += '<div class="modcard" style="border-left-color:' + c.hex + '">' +
      '<div class="row" style="margin-bottom:4px"><h4 style="flex:1">' + esc(m.name) + '</h4>' + modBadge(m.color, c.n) + '</div>' +
      '<p class="tiny muted" style="margin:0 0 8px">' + esc(m.summary || "No summary yet.") + '</p>' +
      '<div class="row" style="gap:5px;margin-bottom:9px">' +
        '<span class="chip">' + (m.acts||[]).length + ' acts</span><span class="chip">' + nScenes + ' scenes</span>' +
        '<span class="chip">' + (m.npcs||[]).length + ' NPCs</span><span class="chip">' + (m.maps||[]).length + ' maps</span>' +
        (cm ? '<span class="chip ok">Attached here</span>' : '') + '</div>' +
      '<div class="row">' +
        '<button class="btn primary sm" data-act="mod-open" data-id="' + m.id + '">Open</button>' +
        (cm ? '<button class="btn ghost sm" data-act="mod-detach" data-id="' + m.id + '">Detach</button>'
            : '<button class="btn sm" data-act="mod-attach" data-id="' + m.id + '">Attach to this campaign</button>') +
        '<button class="btn ghost sm" data-act="mod-edit" data-id="' + m.id + '">Rename / color</button></div></div>';
  });
  return h + '</div>';
}

function sceneHtml(m, act, sc, cm){
  const mp = sc.mapId ? findMap(m, sc.mapId) : null;
  const sRev = sceneRevealed(cm, sc.id);
  let h = '<div class="scenecard"><div class="row" style="margin-bottom:4px"><h4 style="flex:1">' + esc(sc.name) + '</h4>' +
    (cm ? (sRev ? '<span class="chip ok">Revealed</span>' : '<span class="chip">Hidden from players</span>') : '') +
    '<button class="btn ghost sm" data-act="scn-edit" data-m="' + m.id + '" data-a="' + act.id + '" data-s="' + sc.id + '">Edit</button></div>';
  h += paras(sc.narrative);
  h += secBlock("Options", olList(sc.options));
  h += secBlock("Enemy encounters", ulList(sc.enemies));
  if(sc.reward) h += secBlock("Reward", '<p style="margin:0">' + esc(sc.reward) + '</p>');
  if(mp){
    h += secBlock("Map", graphMapSvg(mp));
  }
  const linked = (sc.npcIds||[]).map(id => (m.npcs||[]).find(n => n.id === id)).filter(Boolean);
  if(linked.length){
    h += secBlock("NPCs in this scene", '<div class="row" style="gap:5px">' + linked.map(n => {
      const r = NPC_ROLES.find(x => x.k === n.role);
      return '<span class="chip">' + esc(n.name) + (r ? ' · ' + esc(r.n) : '') + '</span>';
    }).join("") + '</div>');
  }
  const gm = [];
  if(modLines(sc.gmNotes).length) gm.push('<div class="sechead" style="margin-top:0">GM Notes</div>' + ulList(sc.gmNotes));
  if((sc.dialogue||[]).length) gm.push('<div class="sechead">Sample dialogue</div>' + sc.dialogue.map(d =>
    '<p style="margin:0 0 6px"><b>' + esc(d.who) + '</b> <span class="hand">“' + esc(d.text) + '”</span></p>').join(""));
  if(gm.length) h += '<div class="gmonly"><div class="tiny" style="font-weight:700;color:var(--red-ink);margin-bottom:4px">GM ONLY — players never see this</div>' + gm.join("") + '</div>';
  if(cm){
    h += '<div class="revealrow">' +
      (sRev ? '<button class="btn sm" data-act="scn-hide" data-m="' + m.id + '" data-s="' + sc.id + '">Hide scene from players</button>'
            : '<button class="btn primary sm" data-act="scn-reveal" data-m="' + m.id + '" data-s="' + sc.id + '">Reveal scene to players</button>') +
      (mp ? (mapRevealedFor(cm, mp.id)
            ? '<button class="btn sm" data-act="map-hide" data-m="' + m.id + '" data-p="' + mp.id + '">Hide map</button>'
            : '<button class="btn sm" data-act="map-reveal" data-m="' + m.id + '" data-p="' + mp.id + '">Reveal map</button>') : '') +
      '</div>';
  }
  return h + '</div>';
}

function viewModuleDetail(m){
  const c = moduleColor(m.color);
  const cm = findCampaignModule(m.id);
  let h = '<div class="row"><button class="btn ghost sm" data-act="mod-back">← All modules</button>' +
    '<span class="right row">' + (cm ? '<button class="btn ghost sm" data-act="mod-detach" data-id="' + m.id + '">Detach from campaign</button>' : '') +
    '<button class="btn ghost sm" data-act="mod-edit" data-id="' + m.id + '">Rename / color</button>' +
    '<button class="btn danger sm" data-act="mod-delete" data-id="' + m.id + '">Delete</button></span></div>';
  h += '<div class="modcard" style="border-left-color:' + c.hex + ';margin:10px 0 14px"><div class="row"><h2 class="sec" style="margin:0;flex:1">' + esc(m.name) + '</h2>' + modBadge(m.color, c.n) + '</div>' +
    '<p class="tiny muted" style="margin:6px 0 0">' + esc(m.summary || "") + '</p></div>';
  if(!cm){
    h += '<div class="card" style="margin-bottom:14px;background:var(--gold-wash);border-color:var(--gold)"><b>Not attached to this campaign.</b> Attach it to start revealing scenes and maps to your players.' +
      ' <button class="btn primary sm" data-act="mod-attach" data-id="' + m.id + '" style="margin-left:8px">Attach to this campaign</button></div>';
  }

  h += '<h2 class="sec">Story</h2>';
  (m.acts||[]).forEach(a => {
    h += '<div class="actcard"><div class="achead row"><span style="flex:1">' + esc(a.name) + '</span>' +
      '<button class="btn ghost sm" data-act="act-rename" data-m="' + m.id + '" data-a="' + a.id + '">Rename</button>' +
      '<button class="btn ghost sm" data-act="scn-add" data-m="' + m.id + '" data-a="' + a.id + '">Add scene</button>' +
      '<button class="btn danger sm" data-act="act-delete" data-m="' + m.id + '" data-a="' + a.id + '">×</button></div>';
    (a.scenes||[]).forEach(sc => { h += sceneHtml(m, a, sc, cm); });
    if(!(a.scenes||[]).length) h += '<div class="lockedscene">No scenes yet.</div>';
    h += '</div>';
  });
  h += '<button class="btn ghost sm" data-act="act-add" data-m="' + m.id + '">Add act</button>';

  h += '<h2 class="sec" style="margin-top:22px">NPC sheets <span class="tiny muted" style="font-family:var(--f-ui)">— GM only</span></h2>' +

  if((m.npcs||[]).length){
    const unadded = m.npcs.filter(t => !npcCopied(m, t));
    if(unadded.length) h += '<div style="margin-bottom:9px"><button class="btn primary sm" data-act="tnpc-copyall" data-m="' + m.id + '">Add all ' + unadded.length + ' to campaign NPCs</button></div>';
    h += '<div class="grid g3">';
    m.npcs.forEach(t => {
      const r = NPC_ROLES.find(x => x.k === t.role);

      h += '<div class="npccard" style="cursor:default;border-left:4px solid ' + c.hex + '"><div class="row" style="margin-bottom:4px"><h4 style="flex:1">' + esc(t.name) + '</h4>' +
        (r ? '<span class="pill role-' + r.k + '">' + esc(r.n) + '</span>' : '') + '</div>' +
        '<div class="hand tiny muted" style="margin-bottom:6px">' + esc(npcTypeLabel(t)) + '</div>' +
        '<div class="row" style="gap:5px;margin-bottom:8px"><span class="chip">Def <b>' + num(t.combat.defense,10) + '</b></span><span class="chip">Soak <b>' + sign(num(t.combat.soak,0)) + '</b></span>' +
        '<span class="chip">Mel <b>' + sign(num(t.combat.melee,0)) + '</b></span><span class="chip">Rng <b>' + sign(num(t.combat.ranged,0)) + '</b></span></div>' +
        (done ? '<span class="chip ok">In campaign roster</span>' : '<button class="btn sm" data-act="tnpc-copy" data-m="' + m.id + '" data-n="' + t.id + '">Add to campaign NPCs</button>') +
        '</div>';
    });
    h += '</div>';
  } else h += '<div class="empty"><p>This module has no NPC sheets.</p></div>';
  return h;
}
function npcCopied(m, t){ return (S.npcs||[]).some(n => n.moduleId === m.id && n.templateId === t.id); }

function applyDraftToScene(sc, d){

/* ---------- PDF ----------------------------------------------------------- */
function buildPdf(c, mode){
  const JS = window.jspdf && window.jspdf.jsPDF;
  if(!JS){ toast("The PDF library didn't load. Try reloading the page."); return null; }
  const doc = new JS({unit:"pt", format:"letter"});
  const W = 612, H = 792, M = 36;
  const styled = mode === "styled";
  const RED = [206,32,39], INK = [20,19,18], GREY = [120,116,108], RULE = [201,196,182];
  let page = 1;

  function bg(){
    if(!styled) return;
    doc.setDrawColor(190,200,215); doc.setLineWidth(0.4);
    for(let y = 96; y < H - 30; y += 19) doc.line(M - 10, y, W - M + 10, y);
    doc.setDrawColor(RED[0], RED[1], RED[2]); doc.setLineWidth(0.7);
    doc.line(M - 14, 26, M - 14, H - 20);
  }
  function banner(txt, x, y, w){
    if(styled){
      doc.setFillColor(RED[0], RED[1], RED[2]);
      doc.roundedRect(x - 4, y - 11, (w || (doc.getTextWidth(txt) + 18)), 17, 7, 7, "F");
      doc.setTextColor(255,255,255);
    } else {
      doc.setTextColor(INK[0], INK[1], INK[2]);
      doc.setDrawColor(INK[0], INK[1], INK[2]); doc.setLineWidth(1.1);
      doc.line(x - 4, y + 5, x - 4 + (w || (doc.getTextWidth(txt) + 18)), y + 5);
    }
    doc.setFont("helvetica","bold"); doc.setFontSize(11);
    doc.text(txt.toUpperCase(), x + 4, y + 1);
    doc.setTextColor(INK[0], INK[1], INK[2]);
  }
  function label(t, x, y){ doc.setFont("helvetica","bold"); doc.setFontSize(6.6); doc.setTextColor(GREY[0],GREY[1],GREY[2]); doc.text(t.toUpperCase(), x, y); doc.setTextColor(INK[0],INK[1],INK[2]); }
  function body(t, x, y, size, style){ doc.setFont("helvetica", style || "normal"); doc.setFontSize(size || 9); doc.text(String(t), x, y); doc.setFont("helvetica","normal"); }
  function plain(size){ doc.setFont("helvetica","normal"); doc.setFontSize(size || 9); }
  function rule(x, y, w){ doc.setDrawColor(RULE[0],RULE[1],RULE[2]); doc.setLineWidth(0.5); doc.line(x, y, x + w, y); }
  function newPage(){ doc.addPage(); page++; bg(); footer(); return 64; }
  function footer(){
    doc.setFont("helvetica","normal"); doc.setFontSize(7); doc.setTextColor(GREY[0],GREY[1],GREY[2]);
    doc.text("Neverborn — " + (c.name || "Unnamed") + " — page " + page, M, H - 22);
    doc.setTextColor(INK[0],INK[1],INK[2]);
  }

  /* ---------------- page 1 ---------------- */
  bg(); footer();
  doc.setFont("helvetica","bold"); doc.setFontSize(23);
  doc.setTextColor(INK[0],INK[1],INK[2]);
  doc.text("NEVERBORN", M, 52);
  if(styled){ doc.setFillColor(RED[0],RED[1],RED[2]); doc.rect(M, 57, 128, 3, "F"); }

  const st = STYLES[c.styleKey];
  let x2 = M + 190;
  label("Character name", x2, 34); body(c.name || "—", x2, 46, 11, "bold"); rule(x2, 49, 200);
  label("Sibling style", x2, 62); body(st.n + " — " + st.power, x2, 73); rule(x2, 76, 200);
  label("Proficiency", x2, 89); body(String(c.prof), x2, 100); rule(x2, 103, 92);
  label("XP left", W - M - 74, 34);
  doc.setFont("helvetica","bold"); doc.setFontSize(20); doc.text(String(xpAvailable(c)), W - M - 74, 54);
  doc.setDrawColor(INK[0],INK[1],INK[2]); doc.setLineWidth(1); doc.rect(W - M - 82, 34, 74, 30);

  const meta = [["Height",c.height],["Weight",c.weight],["Hair",c.hair],["Gender",c.gender],["Age",c.age],["Eyes",c.eyes]];
  let mx = M, my = 122;
  meta.forEach((m, i) => {
    const col = i % 3, row = Math.floor(i / 3);
    const px = M + col * 82, py = my + row * 20;
    label(m[0], px, py); body(m[1] || "—", px + 40, py); rule(px + 38, py + 2, 40);
  });

  let ly = 182;
  banner("Attributes", M, ly, 96); ly += 16;
  label("Score", M + 96, ly - 2); label("Mod", M + 136, ly - 2); label("Temp", M + 170, ly - 2);
  ly += 4;
  ATTRS.forEach(a => {
    body(a.n, M, ly, 9, "bold");
    body(String(num(c.attrs[a.k],10)), M + 102, ly);
    body(sign(attrModOf(c,a.k)), M + 140, ly, 9, "bold");
    body(num(c.attrTemp[a.k],0) ? sign(num(c.attrTemp[a.k],0)) : "—", M + 176, ly);
    rule(M, ly + 3, 200); ly += 15;
  });

  ly += 12; banner("Saves", M, ly, 70); ly += 18;
  SAVES.forEach(s => {
    body(s.n, M, ly, 9, "bold");
    body(sign(saveTotal(c, s.k)), M + 102, ly, 9, "bold");
    body("(" + sign(num(c.saveBase[s.k],0)) + " base " + sign(attrModOf(c,s.attr)) + " " + s.attr + ")", M + 132, ly, 7.4);
    rule(M, ly + 3, 200); ly += 15;
  });

  ly += 12; banner("Combat", M, ly, 78); ly += 18;
  COMBAT.forEach(k => {
    body(k.n, M, ly, 9, "bold");
    const tot = k.k === "defense" ? combatTotal(c,k.k) : sign(combatTotal(c,k.k));
    body(String(tot), M + 102, ly, 9, "bold");
    rule(M, ly + 3, 200); ly += 15;
  });

  ly += 12; banner("Damage", M, ly, 80); ly += 18;
  [["Bashing","bashing",6],["Stun","stun",6],["Lethal","lethal",3]].forEach(([l,k,mx2]) => {
    body(l, M, ly, 9, "bold");
    for(let i = 0; i < mx2; i++){
      const bx = M + 60 + i * 15;
      if(k === "lethal") doc.setDrawColor(RED[0],RED[1],RED[2]); else doc.setDrawColor(INK[0],INK[1],INK[2]);
      doc.setLineWidth(0.8); doc.rect(bx, ly - 8, 11, 11);
      if(i < num(c.dmg[k],0)){
        doc.line(bx + 1.5, ly - 6.5, bx + 9.5, ly + 1.5);
        doc.line(bx + 9.5, ly - 6.5, bx + 1.5, ly + 1.5);
      }
    }
    ly += 18;
  });

  /* expressions column */
  const EX = M + 226, EW = W - M - EX;
  let ey = 182;
  banner("Expressions", EX, ey, 112); ey += 20;
  const exprs = c.expressions.slice();
  function drawExpr(e){
    const d = computeDebt(e);
    const descLines = doc.splitTextToSize(e.desc || "—", EW - 8);
    const bits = [];
    if(e.linkPort || e.linkDist) bits.push("Linked" + (e.linkObject ? ": " + e.linkObject : ""));
    (e.conds||[]).forEach(x => bits.push("Condition: " + (x.text || (COND_TIERS.find(t=>t.v===num(x.v,0))||{}).n || "")));
    if(num(e.condSave,0)) bits.push((COND_SAVE.find(x=>x.v===num(e.condSave,0))||{}).n);
    (e.limits||[]).forEach(x => bits.push("Limitation: " + (x.text || (LIMIT_TIERS.find(t=>t.v===num(x.v,0))||{}).n || "")));
    if(e.aoeFeet) bits.push(e.aoeFeet + " ft area of effect");
    if(e.loops) bits.push("Loops ×" + e.loops);
    if(e.tradeoff) bits.push("Traded: " + d.monthly + " monthly, " + d.activation + " activation");
    const bitLines = bits.length ? doc.splitTextToSize(bits.join(" · "), EW - 8) : [];
    const need = 30 + descLines.length * 10 + bitLines.length * 9;
    if(ey + need > H - 46){ ey = newPage(); banner("Expressions, continued", EX, ey, 150); ey += 20; }
    doc.setDrawColor(RULE[0],RULE[1],RULE[2]); doc.setLineWidth(0.6);
    doc.rect(EX - 4, ey - 12, EW + 4, need, "S");
    body(e.name || "Untitled", EX, ey, 10.5, "bold");
    doc.setFont("helvetica","normal"); doc.setFontSize(7.4); doc.setTextColor(GREY[0],GREY[1],GREY[2]);

  exprs.forEach(drawExpr);

  /* ---------------- page 2 ---------------- */
  let y = newPage();

  allSkillRows(c).forEach(r => {

    doc.setTextColor(INK[0],INK[1],INK[2]); doc.setFontSize(9);

    doc.text(sign(bestAttrMod(c, r.def.attr)), M + 270, y);
    doc.text(String(num(r.entry.misc,0)), M + 306, y);
    doc.setFont("helvetica","bold"); doc.text(sign(skillTotal(c, r.def.k, r.entry)), M + 344, y);
    doc.setFont("helvetica","normal");
    rule(M, y + 3, 350); y += 14;
  });

  y += 14; if(y > H - 150) y = newPage();
  banner("Equipment", M, y, 92); y += 20;
  if(!c.gear.length){ doc.setFontSize(8.4); doc.text("None carried.", M, y); y += 14; }
  c.gear.forEach(g => {
    const def = allGear().find(x => x.id === g.id); if(!def) return;
    if(y > H - 60) y = newPage();
    body(def.n, M, y, 9, "bold");
    plain(8); doc.setTextColor(GREY[0],GREY[1],GREY[2]);
    doc.text(doc.splitTextToSize((def.dmg !== "—" ? def.dmg + ". " : "") + def.note + (g.note ? " (" + g.note + ")" : ""), 330)[0] || "", M + 150, y);
    doc.setTextColor(INK[0],INK[1],INK[2]); doc.setFontSize(9);
    rule(M, y + 3, 480); y += 14;
  });

  y += 14; if(y > H - 160) y = newPage();
  banner("Backgrounds", M, y, 104); y += 20;
  [["Resources", num(c.bg.resources,0), BG_RESOURCES[num(c.bg.resources,0)]],
   ["Reputation", num(c.bg.reputation,0), BG_REPUTATION[num(c.bg.reputation,0)]]].forEach(b => {
    body(b[0] + " " + b[1], M, y, 9, "bold");
    plain(8); doc.setTextColor(GREY[0],GREY[1],GREY[2]);
    doc.splitTextToSize(b[2], 380).forEach((l, i) => doc.text(l, M + 100, y + i * 9));
    doc.setTextColor(INK[0],INK[1],INK[2]); doc.setFontSize(9);
    y += Math.max(14, doc.splitTextToSize(b[2], 380).length * 9 + 5);
  });
  if(c.contacts.length){
    body("Contacts", M, y, 9, "bold"); y += 13;
    c.contacts.forEach(ct => {
      if(y > H - 60) y = newPage();
      plain(8.4); doc.text("• " + (ct.name || "—") + (ct.note ? " — " + ct.note : ""), M + 8, y); y += 12;
    });
  }

  if(c.backstory){
    y += 14; if(y > H - 120) y = newPage();
    banner("Backstory", M, y, 88); y += 20;
    plain(9);
    doc.splitTextToSize(c.backstory, W - M * 2).forEach(l => {
      if(y > H - 46) y = newPage();
      doc.text(l, M, y); y += 12;
    });
  }
  if(c.portrait){
    y += 10; if(y > H - 90) y = newPage();
    banner("Self portrait", M, y, 104); y += 20;
    plain(9);
    doc.splitTextToSize(c.portrait, W - M * 2).forEach(l => {
      if(y > H - 46) y = newPage();
      doc.text(l, M, y); y += 12;
    });
  }
  return doc;
}

async function exportPdf(c, mode){
  const doc = buildPdf(c, mode);
  if(!doc) return;
  const blob = doc.output("blob");
  const filename = (c.name || "neverborn").replace(/[^\w\- ]+/g, "").trim().replace(/\s+/g, "-").toLowerCase() + ".pdf";
  if(S.downloads){
    try { await S.downloads.save({filename, data: blob}); toast("Sheet saved."); }
    catch(e){
      if(e && e.code === "declined") return;
      toast("Couldn't save the PDF here. Try the browser's own download instead.");
      fallbackDownload(blob, filename);
    }
  } else fallbackDownload(blob, filename);
}
function fallbackDownload(blob, filename){
  try {
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  } catch(e){ toast("Downloads aren't available in this view."); }
}
async function exportJson(c){
  const filename = (c.name || "neverborn").replace(/[^\w\- ]+/g,"").trim().replace(/\s+/g,"-").toLowerCase() + ".json";
  const data = JSON.stringify(c, null, 2);
  if(S.downloads){
    try { await S.downloads.save({filename, data}); toast("Data saved."); return; }
    catch(e){ if(e && e.code === "declined") return; }
  }
  fallbackDownload(new Blob([data], {type:"application/json"}), filename);
}

function charById(id){ return S.chars.find(c => c.id === id); }
function setPath(obj, path, val){
  const parts = path.split(".");
  let o = obj;
  for(let i = 0; i < parts.length - 1; i++){ if(o[parts[i]] == null) o[parts[i]] = {}; o = o[parts[i]]; }
  o[parts[parts.length - 1]] = val;
}

/* ---- theme ---------------------------------------------------------------- */
function applyTheme(){
  const t = localStorage.getItem("neverborn.theme");
  if(t === "light" || t === "dark") document.documentElement.dataset.theme = t;
  else delete document.documentElement.dataset.theme;
}
function effectiveTheme(){
  const t = localStorage.getItem("neverborn.theme");
  if(t === "light" || t === "dark") return t;
  return (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
}

APP.addEventListener("click", async (ev) => {

  const act = t.dataset.act;
