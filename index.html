<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neverborn — character builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Kalam:wght@400;700&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%80%3C/text%3E%3C/svg%3E">
<style>
:root{
  --paper:#EDEAE2; --paper-2:#F6F4EE; --paper-3:#E2DED3;
  --ink:#141312; --ink-2:#4A4741; --ink-3:#7C786F;
  --red:#CE2027; --red-ink:#8E1218; --red-wash:#F7DCDC;
  --blue:#3F6FA8; --blue-wash:#DEE8F3;
  --gold:#C9992B; --gold-wash:#F6EBCB;
  --green:#3C7A47; --green-wash:#DEEDDF;
  --rule:#C9C4B6; --rule-strong:#9A9487;
  --line:rgba(63,111,168,.22);
  --shadow:0 1px 0 rgba(20,19,18,.10);
  --radius:3px;
  --f-display:'Permanent Marker',system-ui,sans-serif;
  --f-hand:'Kalam',cursive;
  --f-ui:'Barlow',system-ui,-apple-system,sans-serif;
  --f-cond:'Barlow Condensed','Barlow',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#15140F; --paper-2:#1D1B16; --paper-3:#26241D;
    --ink:#EDEAE2; --ink-2:#B4AFA2; --ink-3:#847F73;
    --red:#E8434A; --red-ink:#FFB9BB; --red-wash:#3A1618;
    --blue:#7FAEE0; --blue-wash:#16232F;
    --gold:#E0B44E; --gold-wash:#2E2614;
    --green:#74BE83; --green-wash:#16281A;
    --rule:#37342B; --rule-strong:#575244;
    --line:rgba(127,174,224,.16);
    --shadow:0 1px 0 rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --paper:#15140F; --paper-2:#1D1B16; --paper-3:#26241D;
  --ink:#EDEAE2; --ink-2:#B4AFA2; --ink-3:#847F73;
  --red:#E8434A; --red-ink:#FFB9BB; --red-wash:#3A1618;
  --blue:#7FAEE0; --blue-wash:#16232F;
  --gold:#E0B44E; --gold-wash:#2E2614;
  --green:#74BE83; --green-wash:#16281A;
  --rule:#37342B; --rule-strong:#575244;
  --line:rgba(127,174,224,.16);
  --shadow:0 1px 0 rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:var(--f-ui); font-size:15px; line-height:1.5;
  -webkit-text-size-adjust:100%;
}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue)}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.ruled{
  background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 27px,var(--line) 27px,var(--line) 28px);
  background-position:0 6px;
}

#app{min-height:100vh;display:flex;flex-direction:column}
.shell{display:flex;flex:1;min-height:0;align-items:stretch}

.spine{
  width:186px;flex:0 0 186px;background:var(--ink);color:var(--paper);
  display:flex;flex-direction:column;position:sticky;top:0;align-self:flex-start;
  height:100vh;overflow-y:auto;
}
.spine-logo{padding:16px 14px 12px;border-bottom:1px solid rgba(255,255,255,.14)}
.spine-logo b{font-family:var(--f-display);font-size:21px;letter-spacing:.5px;display:block;line-height:1}
.spine-logo span{font-family:var(--f-cond);font-size:11px;letter-spacing:.18em;color:rgba(255,255,255,.5);text-transform:uppercase}
.navgroup{padding:10px 0 4px}
.navgroup>h4{font-family:var(--f-cond);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.42);margin:0;padding:6px 14px}
.navitem{
  display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  background:none;border:0;border-left:3px solid transparent;
  padding:8px 14px;color:rgba(255,255,255,.74);cursor:pointer;font-size:14px;
}
.navitem:hover{background:rgba(255,255,255,.07);color:#fff}
.navitem.on{background:rgba(255,255,255,.11);color:#fff;border-left-color:var(--red)}
.navitem .ico{width:17px;text-align:center;flex:0 0 17px;opacity:.9}
.navitem .cnt{margin-left:auto;background:var(--red);color:#fff;font-size:11px;font-weight:700;border-radius:9px;padding:0 6px;min-width:18px;text-align:center}
.spine-foot{margin-top:auto;padding:12px 14px;border-top:1px solid rgba(255,255,255,.14);font-size:12px;color:rgba(255,255,255,.5)}
.spine-foot button{background:none;border:1px solid rgba(255,255,255,.28);color:rgba(255,255,255,.8);border-radius:var(--radius);padding:4px 8px;font-size:12px;cursor:pointer;width:100%;margin-top:6px}
.spine-foot button:hover{background:rgba(255,255,255,.1)}
.whoami{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.whoami button.linklike{background:none;border:0;color:rgba(255,255,255,.55);text-decoration:underline;cursor:pointer;font-size:11px;padding:0}
.themebtn{background:none;border:1px solid rgba(255,255,255,.28);color:rgba(255,255,255,.8);border-radius:var(--radius);width:26px;height:26px;cursor:pointer;font-size:13px;line-height:1}
.themebtn:hover{background:rgba(255,255,255,.1)}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.statbar{
  position:sticky;top:0;z-index:30;background:var(--paper-2);
  border-bottom:2px solid var(--ink);
  display:flex;align-items:center;gap:6px;padding:7px 14px;flex-wrap:wrap;
}
.statbar .who{font-family:var(--f-display);font-size:16px;margin-right:4px;white-space:nowrap}
.chip{
  font-family:var(--f-cond);font-weight:700;font-size:13px;letter-spacing:.04em;
  background:var(--paper-3);border:1px solid var(--rule);border-radius:var(--radius);
  padding:2px 7px;white-space:nowrap;display:inline-flex;gap:5px;align-items:center;
}
.chip b{font-family:var(--f-ui);font-weight:700;font-size:13px}
.chip.hi{background:var(--blue-wash);border-color:var(--blue)}
.chip.warn{background:var(--gold-wash);border-color:var(--gold)}
.chip.bad{background:var(--red-wash);border-color:var(--red);color:var(--red-ink)}
.chip.ok{background:var(--green-wash);border-color:var(--green)}
.statbar .spacer{margin-left:auto}
.xpbox{text-align:right;line-height:1.1}
.xpbox small{display:block;font-family:var(--f-cond);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.xpbox b{font-size:19px}

.page{padding:18px 22px 60px;max-width:1080px;width:100%}

.banner{position:relative;display:inline-block;margin:0 0 12px;padding:3px 16px 5px;}
.banner::before{
  content:"";position:absolute;inset:0;background:var(--red);
  border-radius:44% 56% 48% 52%/58% 42% 56% 44%;transform:rotate(-.6deg);
}
.banner span{position:relative;font-family:var(--f-display);font-size:20px;color:#fff;letter-spacing:.4px}
h2.sec{font-family:var(--f-display);font-size:17px;margin:0 0 9px;font-weight:400}
h3.sub{font-family:var(--f-cond);font-weight:700;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);margin:0 0 7px}

.card{background:var(--paper-2);border:1px solid var(--rule);border-radius:var(--radius);padding:13px 15px;box-shadow:var(--shadow)}
.card+.card{margin-top:12px}
.card.tape{position:relative}
.card.tape::before{
  content:"";position:absolute;top:-9px;left:50%;transform:translateX(-50%) rotate(-1.4deg);
  width:74px;height:17px;background:rgba(201,153,43,.30);border-left:1px dashed rgba(0,0,0,.12);border-right:1px dashed rgba(0,0,0,.12);
}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.right{margin-left:auto}
.muted{color:var(--ink-2)}
.tiny{font-size:12px}
.hand{font-family:var(--f-hand)}
hr.rip{border:0;border-top:2px dashed var(--rule-strong);margin:16px 0}

input[type=text],input[type=number],input[type=date],select,textarea{
  background:var(--paper);border:1px solid var(--rule-strong);border-radius:var(--radius);
  padding:5px 7px;width:100%;font-size:14px;
}
input[type=number]{-moz-appearance:textfield}
textarea{resize:vertical;min-height:58px;font-family:var(--f-hand);font-size:15px}
input:focus,select:focus,textarea:focus{border-color:var(--red);outline:none;box-shadow:0 0 0 2px var(--red-wash)}
label.fl{display:block;font-family:var(--f-cond);font-weight:700;font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);margin:0 0 3px}
.btn{
  background:var(--paper);border:1.5px solid var(--ink);border-radius:var(--radius);
  padding:5px 12px;cursor:pointer;font-weight:600;font-size:14px;
}
.btn:hover{background:var(--ink);color:var(--paper)}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.btn.primary:hover{background:var(--red-ink);border-color:var(--red-ink)}
.btn.sm{padding:3px 8px;font-size:12.5px}
.btn.ghost{border-color:var(--rule-strong);font-weight:500}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.danger{border-color:var(--red);color:var(--red)}
.btn.danger:hover{background:var(--red);color:#fff}
.stepper{display:inline-flex;align-items:center;gap:0;border:1px solid var(--rule-strong);border-radius:var(--radius);overflow:hidden;background:var(--paper)}
.stepper button{width:26px;height:27px;border:0;background:none;cursor:pointer;font-weight:700;color:var(--ink-2)}
.stepper button:hover:not(:disabled){background:var(--ink);color:var(--paper)}
.stepper button:disabled{opacity:.3;cursor:not-allowed}
.stepper .val{min-width:34px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums;border-left:1px solid var(--rule);border-right:1px solid var(--rule);height:27px;line-height:27px}
.swtch{display:inline-flex;align-items:center;gap:7px;cursor:pointer;font-size:13.5px}
.swtch input{width:15px;height:15px;accent-color:var(--red);margin:0}

table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th{font-family:var(--f-cond);font-weight:700;font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);text-align:left;padding:4px 5px;border-bottom:1.5px solid var(--rule-strong)}
table.t td{padding:3px 5px;border-bottom:1px solid var(--rule)}
table.t td.num,table.t th.num{text-align:center;font-variant-numeric:tabular-nums}
.tw{overflow-x:auto}

.statline{display:flex;align-items:center;gap:8px;padding:3px 0;border-bottom:1px solid var(--rule)}
.statline:last-child{border-bottom:0}
.total{background:var(--ink);color:var(--paper);font-weight:700;border-radius:var(--radius);padding:1px 8px;font-variant-numeric:tabular-nums;min-width:38px;text-align:center;display:inline-block}

.track{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.box{width:22px;height:22px;border:1.5px solid var(--ink);border-radius:2px;background:var(--paper);cursor:pointer;position:relative;padding:0}
.box.on::after{content:"";position:absolute;inset:2px;background:
  linear-gradient(45deg,transparent 43%,var(--ink) 43%,var(--ink) 57%,transparent 57%),
  linear-gradient(-45deg,transparent 43%,var(--ink) 43%,var(--ink) 57%,transparent 57%);}
.box.lethal{border-color:var(--red)}
.box.lethal.on::after{background:
  linear-gradient(45deg,transparent 43%,var(--red) 43%,var(--red) 57%,transparent 57%),
  linear-gradient(-45deg,transparent 43%,var(--red) 43%,var(--red) 57%,transparent 57%);}

.pill{font-size:11.5px;font-weight:600;border-radius:10px;padding:1px 8px;display:inline-block;white-space:nowrap}
.pill.draft{background:var(--paper-3);color:var(--ink-2);border:1px solid var(--rule-strong)}
.pill.pending{background:var(--gold-wash);color:var(--gold);border:1px solid var(--gold)}
.pill.approved{background:var(--green-wash);color:var(--green);border:1px solid var(--green)}
.pill.changes{background:var(--red-wash);color:var(--red-ink);border:1px solid var(--red)}
.pill.p1{background:var(--blue-wash);color:var(--blue);border:1px solid var(--blue)}
.pill.p2{background:var(--gold-wash);color:var(--gold);border:1px solid var(--gold)}
.pill.p3{background:var(--red-wash);color:var(--red-ink);border:1px solid var(--red)}

.ledger{font-size:13px}
.ledger .li{display:flex;justify-content:space-between;gap:10px;padding:2px 0;border-bottom:1px dotted var(--rule)}
.ledger .li.sum{border-bottom:0;border-top:2px solid var(--ink);margin-top:4px;padding-top:5px;font-weight:700}
.ledger .li span:last-child{font-variant-numeric:tabular-nums;white-space:nowrap}
.bigdebt{font-family:var(--f-display);font-size:42px;line-height:1;color:var(--red)}

.scrim{position:absolute;inset:0;background:rgba(10,9,8,.55);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:34px 14px}
.modal{background:var(--paper);border:2px solid var(--ink);border-radius:var(--radius);max-width:640px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.35);max-height:calc(100vh - 68px);overflow-y:auto}
.modal header{display:flex;align-items:center;gap:8px;padding:11px 15px;border-bottom:2px solid var(--ink);position:sticky;top:0;background:var(--paper);z-index:2}
.modal header h3{font-family:var(--f-display);font-size:17px;margin:0;font-weight:400}
.modal .body{padding:15px}
.modal .foot{padding:11px 15px;border-top:1px solid var(--rule);display:flex;gap:8px;justify-content:flex-end;position:sticky;bottom:0;background:var(--paper)}

.landing{max-width:520px;margin:0 auto;padding:44px 20px 60px;text-align:center}
.landing .logo{font-family:var(--f-display);font-size:46px;line-height:1;margin:0 0 4px}
.landing .tag{font-family:var(--f-hand);font-size:17px;color:var(--ink-2);margin:0 0 26px}
.landing .card{text-align:left}

.crewcard{background:var(--paper-2);border:1px solid var(--rule);border-radius:var(--radius);padding:11px 13px;cursor:pointer;position:relative}
.crewcard:hover{border-color:var(--ink)}
.crewcard.me{border-left:4px solid var(--red)}
.crewcard h4{margin:0;font-family:var(--f-display);font-size:15px;font-weight:400}
.crewcard .styl{font-family:var(--f-hand);font-size:13.5px;color:var(--ink-2);margin-bottom:6px}

/* auth screen */
.authtabs{display:flex;border-bottom:1px solid var(--rule);margin-bottom:14px}
.authtabs button{flex:1;background:none;border:0;padding:9px 4px;font-family:var(--f-cond);font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);cursor:pointer;border-bottom:2px solid transparent}
.authtabs button.on{color:var(--ink);border-bottom-color:var(--red)}
.btn.google{width:100%;background:var(--paper);border:1.5px solid var(--rule-strong);display:flex;align-items:center;justify-content:center;gap:9px;font-weight:600}
.btn.google:hover{background:var(--paper-3);color:var(--ink)}
.orline{display:flex;align-items:center;gap:10px;margin:14px 0;color:var(--ink-3);font-size:12px}
.orline::before,.orline::after{content:"";flex:1;height:1px;background:var(--rule)}
.authlink{background:none;border:0;color:var(--blue);text-decoration:underline;cursor:pointer;font-size:12.5px;padding:0}

/* role badges on campaign cards */
.rolebadge{font-family:var(--f-cond);font-weight:700;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;border-radius:9px;padding:2px 8px;display:inline-block}
.rolebadge.gm{background:var(--red);color:#fff}
.rolebadge.player{background:var(--blue);color:#fff}

.meter{height:7px;background:var(--paper-3);border-radius:4px;overflow:hidden;border:1px solid var(--rule)}
.meter i{display:block;height:100%;background:var(--red)}
.meter i.ok{background:var(--green)}

.empty{border:2px dashed var(--rule-strong);border-radius:var(--radius);padding:26px 16px;text-align:center;color:var(--ink-2)}
.empty p{margin:0 0 10px}

.toast{position:sticky;bottom:12px;margin:0 auto;max-width:440px;background:var(--ink);color:var(--paper);padding:9px 14px;border-radius:var(--radius);font-size:13.5px;z-index:200;box-shadow:0 6px 20px rgba(0,0,0,.3)}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.mobnav{display:none}
@media (max-width:820px){
  .spine{display:none}
  .mobnav{display:flex;overflow-x:auto;gap:4px;background:var(--ink);padding:6px 8px;position:sticky;top:0;z-index:40}
  .mobnav button{background:none;border:0;color:rgba(255,255,255,.72);padding:5px 10px;border-radius:var(--radius);white-space:nowrap;font-size:13.5px;cursor:pointer}
  .mobnav button.on{background:rgba(255,255,255,.14);color:#fff}
  .statbar{top:39px;padding:6px 10px}
  .page{padding:14px 12px 60px}
  .modal{max-height:calc(100vh - 40px)}
  .scrim{padding:20px 8px}
}
@media print{.spine,.mobnav,.statbar{display:none}}
</style>
</head>

/* =========================================================================
   NEVERBORN — rules engine. Every number here comes from the rulebook
   unless marked HOUSE (house rules the GM can edit in Campaign settings).
   ========================================================================= */
"use strict";

const ATTRS = [
  {k:"str", n:"Strength"},   {k:"dex", n:"Dexterity"},
  {k:"con", n:"Constitution"},{k:"int", n:"Intelligence"},
  {k:"wis", n:"Wisdom"},     {k:"cha", n:"Charisma"}
];
const SAVES = [
  {k:"will", n:"Will", attr:"wis"},
  {k:"reflex", n:"Reflex", attr:"dex"},
  {k:"fortitude", n:"Fortitude", attr:"con"}
];
/* Defense alone carries a base 10. Initiative keeps its Dex mod and Soak its
   half-Con bonus from the sheet; Melee and Ranged are flat purchased totals. */
const COMBAT = [
  {k:"defense",    n:"Defense",    base:10, attr:null,  half:false},
  {k:"initiative", n:"Initiative", base:0,  attr:"dex", half:false},
  {k:"soak",       n:"Soak",       base:0,  attr:"con", half:true },
  {k:"melee",      n:"Melee",      base:0,  attr:null,  half:false},
  {k:"ranged",     n:"Ranged",     base:0,  attr:null,  half:false}
];

const STYLES = {
  death:{n:"Death", nick:"Goth Kids", power:"Endings", order:"Sibling style #1",
    set:["Power over endings. Can end or stop the end of things.",
         "Can intuitively sense when something could end or change."],
    blurb:"The oldest and most common of the Neverborn. Practical, a little cold, quietly hedonistic."},
  time:{n:"Time", nick:"Docs", power:"Flow", order:"Sibling style #2",
    set:["Can manipulate the flow of time on varying scales.",
         "Can always sense temporal distortions."],
    blurb:"Precise, perfectionist, never in a hurry. They could theoretically have all the time in the world."},
  gravity:{n:"Gravity", nick:"Newts", power:"Mass", order:"Sibling style #3",
    set:["Can manipulate gravity and mass, physical and metaphysical.",
         "Can always determine the amount of gravity an object holds."],
    blurb:"Empathetic and often extremely athletic. The Steve Rogers of the Neverborn world."},
  order:{n:"Order", nick:"Hall Monitors", power:"Law", order:"Sibling style #4",
    set:["Can enforce natural law, nullify powers, and set laws in an area.",
         "Instinctively knows the correct order of natural law and feels it being violated."],
    blurb:"The rarest type. Either obsessive precision or total lackadaisical drift, rarely in between."},
  radiation:{n:"Radiation", nick:"Chernies", power:"Lumen", order:"Sibling style #5",
    set:["Manipulates radiation in all forms.",
         "Can always sense what type of radiation is in an area."],

  } else if(code === "resource-exhausted"){
    toast("This Firebase project has hit its free-tier quota for today. It resets in a few hours.");
  } else if(code === "unavailable" || code === "deadline-exceeded"){
    toast("Couldn't reach Firebase. Check your connection and try again.");

    toast("Your session dropped. Reloading the page usually fixes this.");

function migrate(c){
  if(!c) return c;
  const base = newCharacter(c.ownerId, c.campaign, c.prof);
  for(const k of Object.keys(base)){
    if(c[k] === undefined) c[k] = base[k];
    else if(base[k] && typeof base[k] === "object" && !Array.isArray(base[k])){
      for(const kk of Object.keys(base[k])) if(c[k][kk] === undefined) c[k][kk] = base[k][kk];
    }
  }
  return c;
}

/* ---------- derived maths ------------------------------------------------ */
const attrMod = (score) => Math.floor((num(score,10) - 10) / 2);

function attrModOf(c, k){ return attrMod(num(c.attrs[k],10)) + num(c.attrTemp[k],0); }

function bestAttrMod(c, keys){
  return Math.max(...keys.map(k => attrModOf(c, k)));
}

/* Damage penalty: the worse of the bashing and stun tracks, per the book. */
function dmgPenalty(c){
  const worst = Math.max(num(c.dmg.bashing,0), num(c.dmg.stun,0));
  if(worst >= 5) return -2;
  if(worst >= 4) return -2;
  if(worst === 3) return -2;
  if(worst === 2) return -1;
  return 0;
}

function saveTotal(c, k){
  const s = SAVES.find(x => x.k === k);
  return num(c.saveBase[k],0) + attrModOf(c, s.attr) + num(c.saveMisc[k],0) + dmgPenalty(c);
}

function combatTotal(c, k){
  const def = COMBAT.find(x => x.k === k);
  let v = def.base + num(c.combat[k],0) + num(c.combatExpr[k],0);
  if(def.attr){
    const m = attrModOf(c, def.attr);
    v += def.half ? Math.floor(m / 2) : m;
  }
  if(k !== "defense" && k !== "soak") v += dmgPenalty(c);
  else if(k === "defense") v += 0;
  return v;
}

function socialBonus(c){ return num(c.bg.reputation,0); }

function skillTotal(c, key, entry){
  const def = SKILLS.find(s => s.k === key);
  if(!def) return 0;
  const ranks = num(entry.ranks,0), misc = num(entry.misc,0);
  let t = ranks + bestAttrMod(c, def.attr) + misc;
  if(def.social) t += socialBonus(c);
  return t;
}

function allSkillRows(c){
  const rows = [];
  SKILLS.forEach(s => {
    if(s.sub){
      c.subSkills.filter(x => x.key === s.k).forEach(x => rows.push({def:s, id:x.id, label:x.label, entry:x, sub:true}));
    } else {
      rows.push({def:s, id:s.k, label:s.n, entry:c.skills[s.k] || {ranks:0,misc:0}, sub:false});
    }
  });
  return rows;
}

/* ---------- XP ledger ---------------------------------------------------- */
function xpSpent(c){
  let t = 0, parts = [];
  let a = 0; ATTRS.forEach(x => { a += num(c.attrs[x.k],10) - 10; });
  t += a * XP_COST.attr; parts.push(["Attributes", a * XP_COST.attr]);

  let sv = 0; SAVES.forEach(x => sv += Math.max(0, num(c.saveBase[x.k],0)));
  t += sv * XP_COST.save; parts.push(["Saves", sv * XP_COST.save]);

  let cb = 0; COMBAT.forEach(x => cb += Math.max(0, num(c.combat[x.k],0)));
  t += cb * XP_COST.combat; parts.push(["Combat stats", cb * XP_COST.combat]);

  let ranks = 0;
  Object.values(c.skills).forEach(e => ranks += Math.max(0, num(e.ranks,0)));
  c.subSkills.forEach(e => ranks += Math.max(0, num(e.ranks,0)));
  const skillXp = Math.ceil(ranks / 2);
  t += skillXp; parts.push(["Skills (" + ranks + " ranks)", skillXp]);

  const bgLv = num(c.bg.resources,0) + num(c.bg.reputation,0) + c.contacts.length;
  t += bgLv * XP_COST.background; parts.push(["Backgrounds", bgLv * XP_COST.background]);

  const slotXp = num(c.extraSlots,0) * XP_COST.slot;
  t += slotXp; parts.push(["Extra expression slots", slotXp]);

  return {total:t, parts};
}
function xpAvailable(c){ return num(c.xpEarned, START_XP) - xpSpent(c).total; }

function slotsUsed(c){
  return c.expressions.reduce((n, e) => n + (e.isExpansion ? 0 : num(e.prof,1)), 0);
}
function slotsTotal(c){ return 3 + num(c.extraSlots,0); }

/* ---------- debt calculator --------------------------------------------- */
function bandedCost(qty, bandSize){
  let total = 0, i = 0, left = Math.max(0, qty);
  while(left > 0 && i < 400){ i++; const take = Math.min(left, bandSize); total += take * i; left -= take; }
  return total;
}

function blankExpression(power, prof){
  return {
    id: uid("ex_"), name:"", power, prof: prof || 1, desc:"",
    tier: 30, living:false,
    scales:{}, velocity:1, escalate:0,
    aoeFeet:0, aoeMutable:0, offsetFeet:0, loops:0,
    linkPort:0, linkDist:0, linkObject:"",
    conds:[], condSave:0, limits:[], range:"minds-eye",
    tradeoff:false, isExpansion:false, parentId:"",
    customCore:null, customNote:"",
    status:"draft", gmNote:"", submittedAt:0
  };
}

/* Order of operations, mirrored in the ledger the player sees:
   core → living → escalate (multiplies the running total) → velocity
   (seconds cost only) → area, offset, looping → reductions → floor of 1. */
function computeDebt(e){
  const L = [];
  const power = e.power;
  const prof = clamp(num(e.prof,1), 1, 3);
  const trade = !!e.tradeoff;
  let core = 0;

  if(e.customCore != null && e.customCore !== ""){
    core = num(e.customCore, 0);
    L.push(["Custom core cost", core]);
  } else if(power === "Endings"){
    let tier = num(e.tier, 30);
    if(trade && prof === 1) tier = Math.ceil(tier / 2);
    if(trade && prof === 2) tier = Math.ceil(tier / 3);
    core = Math.max(tier, PROF_BASE[prof]);
    L.push(["Likelihood tier" + (trade ? " (traded)" : ""), tier]);
    if(PROF_BASE[prof] > tier) L.push(["Proficiency " + prof + " floor", PROF_BASE[prof] - tier]);
  } else {
    core = PROF_BASE[prof];
    L.push(["Proficiency " + prof + " base debt", PROF_BASE[prof]]);
    let scaleCost = 0;
    (SCALES[power] || []).forEach(s => {
      const raw = num(e.scales[s.k], 0);
      if(!raw) return;
      let c = 0;
      if(s.banded) c = bandedCost(raw, s.banded);
      else c = raw * s.per;
      c = Math.ceil(c);
      scaleCost += c;
      L.push([s.n + " — " + nf(raw) + " " + s.unit, c]);
    });
    core += scaleCost;
    e.__scaleCost = scaleCost;
  }

  let running = core;

  if(power === "Endings" && e.living){ running += 20; L.push(["Used on a living creature", 20]); }

  const steps = clamp(num(e.escalate,0), 0, 8);
  if(steps > 0 && ["Lumen","Mass","Flow","Exchange"].includes(power)){
    const before = running;
    running = running * Math.pow(2, steps);
    L.push(["Escalate ×" + Math.pow(2,steps) + " (" + steps + " step" + (steps>1?"s":"") + ")", running - before]);
  }

  if(power === "Flow"){
    const v = Math.max(1, num(e.velocity,1));
    if(v > 1){
      const sc = num(e.__scaleCost, 0);
      const delta = Math.ceil(sc * (v - 1));
      running += delta;
      L.push(["Velocity ×" + v + " on the seconds cost", delta]);
    }
  }

  if(power !== "Law"){
    const ft = Math.max(0, num(e.aoeFeet,0));
    const mut = clamp(num(e.aoeMutable,0), 0, ft);
    if(ft){ running += ft; L.push(["Area of effect — " + ft + " ft", ft]); }
    if(mut){ running += mut; L.push(["Mutable shape over " + mut + " ft (doubled)", mut]); }
  }
  const off = Math.max(0, num(e.offsetFeet,0));
  if(off){ running += off; L.push(["Offset origin — " + off + " ft", off]); }

  const loops = clamp(num(e.loops,0), 0, 10);
  if(loops){ running += loops * 10; L.push(["Looping ×" + loops, loops * 10]); }

  const gross = running;
  let red = 0;
  const addRed = (v, label) => { if(v){ red += v; L.push([label, v]); } };
  addRed(num(e.linkPort,0), "Linked object — portability");
  addRed(num(e.linkDist,0), "Linked object — distinctiveness");
  (e.conds||[]).forEach(c => addRed(num(c.v,0), "Condition — " + (c.text || (COND_TIERS.find(t=>t.v===num(c.v,0))||{}).n || "")));
  addRed(num(e.condSave,0), "Condition — saving throw");
  (e.limits||[]).forEach(c => addRed(num(c.v,0), "Limitation — " + (c.text || (LIMIT_TIERS.find(t=>t.v===num(c.v,0))||{}).n || "")));
  const r = RANGES.find(x => x.k === e.range);
  if(r && r.v) addRed(r.v, "Range limited to " + r.n.toLowerCase());

  let final = gross + red;
  let expansionSaving = 0;
  if(e.isExpansion){
    const before = Math.max(1, final);
    final = Math.ceil(before / 2);
    expansionSaving = final - before;
    L.push(["Expansion of an existing expression (half price)", expansionSaving]);
  }
  const floored = final < 1;
  final = Math.max(1, Math.round(final));

  return {
    lines: L, gross, reductions: red, final, floored,
    monthly: trade ? final : 0,
    activation: trade ? Math.max(1, Math.ceil(final * 0.2)) : 0
  };
}

/* Action type is derived from the conditions taken, per the rules. */
function actionOf(e){
  const vs = (e.conds||[]).map(c => num(c.v,0));
  if(vs.includes(-15)) return "full";
  if(vs.includes(-10)) return "standard";
  if(vs.length) return "triggered";
  return "free";
}

function freeActions(c){
  return Math.max(1, Math.max(attrModOf(c,"int"), attrModOf(c,"dex")));
}

function monthlyRent(c){
  let t = num(c.standingRent,0);
  c.expressions.forEach(e => { if(e.tradeoff) t += computeDebt(e).monthly; });
  return t;
}
function debtThisMonth(c){
  return (c.debtLog||[]).reduce((n,l) => n + num(l.amount,0), 0) + monthlyRent(c);
}

/* Campaign-wide budget, set by the GM. 0 means "not set yet" — no red
   warnings fire until the GM actually picks a number. */
function campaignBudget(){ return S.campaign ? num(S.campaign.goodwillBudget,0) : 0; }
function budgetIsSet(){ return campaignBudget() > 0; }
function overBudget(c){
  const budget = campaignBudget();
  if(budget <= 0) return {set:false, over:false, budget:0, owed:debtThisMonth(c), diff:0};
  const owed = debtThisMonth(c);
  return {set:true, over: owed > budget, budget, owed, diff: owed - budget};
}

/* Predicted damage tier from whatever scale the expression uses. */
function predictedTier(e, tiers){
  let kind = null, val = 0;
  if(e.power === "Mass" && num(e.scales.kg,0)){ kind = "kg"; val = num(e.scales.kg,0); }
  else if(e.power === "Exchange" && num(e.scales.j,0)){ kind = "j"; val = num(e.scales.j,0); }
  else if(e.power === "Exchange" && num(e.scales.n,0)){ kind = "n"; val = num(e.scales.n,0); }
  if(kind == null) return null;
  const t = tierFor(kind, val);
  if(t == null) return null;
  return (tiers || DEFAULT_TIERS).find(x => x.t === t) || null;
}
function tierEffect(t){
  if(!t) return "";
  if(t.type === "lethal"){
    return "Lethal, " + t.lv + " level" + (t.lv === 1 ? "" : "s") + (t.mod ? ", soak DC +" + t.mod : "");
  }
  return "Bashing" + (t.mod ? " +" + t.mod : " +0") + " damage modifier";
}

let _focus = null;
function captureFocus(){
  const el = document.activeElement;
  if(el && el.dataset && el.dataset.fk){
    _focus = {fk: el.dataset.fk, s: el.selectionStart, e: el.selectionEnd};
  } else _focus = null;
}
function restoreFocus(){
  if(!_focus) return;
  const el = APP.querySelector('[data-fk="' + CSS.escape(_focus.fk) + '"]');

    try { if(_focus.s != null && el.setSelectionRange) el.setSelectionRange(_focus.s, _focus.e); } catch(err){}
  }
  _focus = null;
}

  switch(S.view){
    case "dashboard": body = viewDashboard(); break;
    case "overview":  body = c ? viewOverview(c) : viewNoChar(); break;
    case "stats":     body = c ? viewStats(c) : viewNoChar(); break;
    case "skills":    body = c ? viewSkills(c) : viewNoChar(); break;
    case "expressions": body = c ? viewExpressions(c) : viewNoChar(); break;
    case "gear":      body = c ? viewGear(c) : viewNoChar(); break;
    case "background":body = c ? viewBackground(c) : viewNoChar(); break;
    case "play":      body = c ? viewPlay(c) : viewNoChar(); break;
    case "xp":        body = c ? viewXp(c) : viewNoChar(); break;
    case "sheet":     body = c ? viewSheet(c) : viewNoChar(); break;
    case "approvals": body = viewApprovals(); break;
    case "campaign":  body = viewCampaign(); break;
    case "reference": body = viewReference(); break;
    default: body = viewDashboard();
  }
  return '<div class="shell">' + viewSpine() + '<div class="main">' + viewMobNav() + viewStatbar() +
         '<div class="page">' + body + '</div>' +
         (S.toast ? '<div class="toast">' + esc(S.toast) + '</div>' : '') +
         '</div></div>' + (S.modal ? viewModal() : '');
}

/* ---------- persistent stat bar ------------------------------------------ */
function viewStatbar(){
  const c = curChar();
  if(!c){
    return '<div class="statbar"><span class="who">' + esc(S.campaign.name) + '</span>' +
      '<span class="chip">' + esc(S.campaign.mode) + '</span>' +
      '<span class="chip">Proficiency ' + S.campaign.prof + '</span>' +
      '<span class="spacer"></span>' + rentChip() + '</div>';
  }
  const st = STYLES[c.styleKey];
  const pen = dmgPenalty(c);
  const avail = xpAvailable(c);
  let h = '<div class="statbar"><span class="who">' + esc(c.name || "Unnamed") + '</span>';
  h += '<span class="chip hi">' + esc(st.nick) + ' · ' + esc(st.power.toLowerCase()) + '</span>';
  ATTRS.forEach(a => {
    const m = attrModOf(c, a.k);
    h += '<span class="chip">' + a.n.slice(0,3) + ' <b>' + num(c.attrs[a.k],10) + '</b> <span class="muted">' + sign(m) + '</span></span>';
  });
  h += '<span class="chip hi">Def <b>' + combatTotal(c,"defense") + '</b></span>';
  h += '<span class="chip hi">Soak <b>' + sign(combatTotal(c,"soak")) + '</b></span>';
  h += '<span class="chip hi">Init <b>' + sign(combatTotal(c,"initiative")) + '</b></span>';
  if(pen) h += '<span class="chip bad">Injury ' + pen + '</span>';
  h += '<span class="spacer"></span>' + rentChip();
  h += '<div class="xpbox"><small>XP left</small><b>' + avail + '</b></div>';
  return h + '</div>';
}

function rentChip(){
  const days = daysToRent();
  if(days == null) return "";
  const cls = days <= 3 ? "bad" : days <= 7 ? "warn" : "";
  return '<span class="chip ' + cls + '">Rent in <b>' + days + '</b> day' + (days === 1 ? "" : "s") + '</span>';
}
function daysToRent(){
  if(!S.campaign || !S.campaign.rentDue) return null;
  const ms = S.campaign.rentDue - Date.now();
  return Math.max(0, Math.ceil(ms / 86400000));
}

function viewNoChar(){
  return '<div class="empty"><p>No character open.</p><button class="btn primary" data-act="nav" data-v="dashboard">Back to the crew</button></div>';
}

/* ---------- campaign dashboard (home) ------------------------------------ */
function viewDashboard(){
  const mine = S.chars.filter(c => ownsChar(c));
  const others = S.chars.filter(c => !ownsChar(c));
  const me = mine[0];
  const days = daysToRent();
  let h = '<div class="banner"><span>' + esc(S.campaign.name) + '</span></div>';

  h += '<div class="grid g3" style="margin-bottom:14px">';
  h += '<div class="card" style="' + (days != null && days <= 3 ? 'border-color:var(--red);' : '') + '">' +
       '<h3 class="sub">Rent due in</h3><p class="bigdebt" style="' + (days != null && days <= 3 ? '' : 'color:var(--ink)') + '">' +
       (days == null ? "—" : days) + '</p><p class="tiny muted" style="margin:2px 0 0">' +
       (days == null ? "No rent day set." : "days") + '</p></div>';
  if(me){
    const owed = debtThisMonth(me), earned = num(me.goodwill,0);
    const pct = owed > 0 ? clamp(Math.round(earned / owed * 100), 0, 100) : 100;
    const ob = overBudget(me);
    h += '<div class="card" style="' + (ob.over ? "border-color:var(--red)" : "") + '"><h3 class="sub">Your debt this month</h3><p class="bigdebt" style="color:' + (ob.over ? "var(--red)" : "var(--ink)") + '">' + nf(owed) + '</p>' +
         '<p class="tiny muted" style="margin:2px 0 6px">' + nf(num(me.standingRent,0) + me.expressions.filter(e=>e.tradeoff).reduce((n,e)=>n+computeDebt(e).monthly,0)) + ' standing, ' + nf(owed - (num(me.standingRent,0) + me.expressions.filter(e=>e.tradeoff).reduce((n,e)=>n+computeDebt(e).monthly,0))) + ' spent' +
         (ob.set ? (ob.over ? ' · <span style="color:var(--red)">' + nf(ob.diff) + ' over the ' + nf(ob.budget) + ' campaign budget</span>' : ' · within the ' + nf(ob.budget) + ' campaign budget') : '') + '</p>' +
         '<div class="meter"><i class="' + (pct >= 100 ? "ok" : "") + '" style="width:' + pct + '%"></i></div></div>';
    h += '<div class="card"><h3 class="sub">Goodwill earned</h3><p class="bigdebt" style="color:' + (earned >= owed ? 'var(--green)' : 'var(--ink)') + '">' + nf(earned) + '</p>' +
         '<p class="tiny muted" style="margin:2px 0 0">' + (earned >= owed ? "Rent covered." : nf(owed - earned) + " short") + '</p></div>';
  } else {
    h += '<div class="card"><h3 class="sub">Your character</h3><p class="tiny muted">You haven\'t made one yet.</p>' +
         '<button class="btn primary sm" data-act="newchar" style="margin-top:8px">Create a Neverborn</button></div>';
    h += '<div class="card"><h3 class="sub">Proficiency</h3><p class="bigdebt" style="color:var(--ink)">' + S.campaign.prof + '</p>' +
         '<p class="tiny muted" style="margin:2px 0 0">' + esc(PROF_TEXT[S.campaign.prof].split(".")[0]) + '</p></div>';
  }
  h += '</div>';

  if(isGM()){
    const pend = pendingApprovals();
    if(pend.length){
      h += '<div class="card" style="border-color:var(--gold);margin-bottom:14px"><h3 class="sub">Waiting on you</h3>' +
        pend.slice(0,4).map(p => '<div class="row" style="padding:5px 0;border-bottom:1px solid var(--rule)">' +
          '<div style="flex:1;min-width:0"><b>' + esc(p.e.name || "Untitled") + '</b> <span class="tiny muted">· ' + esc(p.c.name || "Unnamed") + '</span>' +
          '<div class="tiny muted">' + esc(p.e.power) + ' p' + p.e.prof + ' · ' + computeDebt(p.e).final + ' debt · ' + ACTIONS[actionOf(p.e)].toLowerCase() + ' action</div></div>' +
          '<button class="btn sm" data-act="review" data-c="' + p.c.id + '" data-e="' + p.e.id + '">Review</button></div>').join("") +
        (pend.length > 4 ? '<p class="tiny muted" style="margin:8px 0 0">' + (pend.length - 4) + ' more in Approvals.</p>' : "") +
        '</div>';
    }
  }

  h += '<h2 class="sec">Crew</h2><div class="grid g3">';
  const list = mine.concat(others);
  if(!list.length){
    h += '<div class="empty" style="grid-column:1/-1"><p>Nobody has joined yet.</p>' +
         '<button class="btn primary" data-act="newchar">Create a Neverborn</button></div>';
  }
  list.forEach(c => {
    const st = STYLES[c.styleKey];
    const owed = debtThisMonth(c), earned = num(c.goodwill,0);
    const short = owed - earned;
    const ob = overBudget(c);
    const lethal = num(c.dmg.lethal,0), bash = Math.max(num(c.dmg.bashing,0), num(c.dmg.stun,0));
    let status;
    if(short > 0) status = '<span class="tiny" style="color:var(--red)">' + nf(short) + ' short on rent</span>';
    else status = '<span class="tiny" style="color:var(--green)">Rent covered</span>';
    if(ob.over) status += ' · <span class="tiny" style="color:var(--red)">' + nf(ob.diff) + ' over budget</span>';
    let injury = "";
    if(lethal) injury = '<span class="tiny" style="color:var(--red)">' + lethal + ' lethal taken</span>';
    else if(bash) injury = '<span class="tiny" style="color:var(--gold)">' + bash + ' bashing or stun</span>';
    h += '<div class="crewcard ' + (ownsChar(c) ? "me" : "") + '" style="' + (ob.over ? "border-color:var(--red)" : "") + '" data-act="open" data-c="' + c.id + '">' +
      '<h4>' + esc(c.name || "Unnamed") + '</h4>' +
      '<div class="styl">' + esc(st.nick) + ' · ' + esc(st.power.toLowerCase()) + ' · p' + c.prof + '</div>' +
      '<div class="row" style="gap:5px;margin-bottom:6px">' +
      '<span class="chip">Def <b>' + combatTotal(c,"defense") + '</b></span>' +
      '<span class="chip">Soak <b>' + sign(combatTotal(c,"soak")) + '</b></span>' +
      '<span class="chip">Init <b>' + sign(combatTotal(c,"initiative")) + '</b></span></div>' +
      status + (injury ? ' · ' + injury : "") +
      (isGM() && !ownsChar(c) ? '<div class="tiny muted" style="margin-top:5px">' + (c.allowGmEdit ? "You may edit this sheet" : "View only") + '</div>' : "") +
      '</div>';
  });
  h += '</div>';
  if(!mine.length && list.length){
    h += '<div class="row" style="margin-top:12px"><button class="btn primary" data-act="newchar">Create your Neverborn</button></div>';
  }
  return h;
}

  h += '<div class="card tape" style="margin-top:14px"><h2 class="sec">' + esc(st.n) + ' — ' + esc(st.power) + '</h2>' +
    '<p class="hand" style="margin:0 0 9px">' + esc(st.blurb) + '</p>' +
    '<h3 class="sub">Power set</h3><ul style="margin:0 0 9px;padding-left:18px">' +
    st.set.map(s => '<li>' + esc(s) + '</li>').join("") + '</ul>' +
    '<h3 class="sub">Your proficiency</h3><p style="margin:0">' + esc(PROF_TEXT[c.prof]) + '</p></div>';

  h += '<div class="card" style="margin-top:14px"><h2 class="sec">Backstory</h2>' +
    '<textarea data-fk="bs' + c.id + '" data-bind="backstory" data-c="' + c.id + '" ' + (ed?"":"disabled") +
    ' placeholder="Who were you before the Deadbeat showed up?">' + esc(c.backstory) + '</textarea>' +
    '<label class="fl" style="margin-top:9px">Self portrait, in words</label>' +
    '<textarea data-fk="pt' + c.id + '" data-bind="portrait" data-c="' + c.id + '" ' + (ed?"":"disabled") +
    ' placeholder="What people see when they look at you." style="min-height:44px">' + esc(c.portrait) + '</textarea></div>';

  if(ownsChar(c)){
    h += '<div class="card" style="margin-top:14px"><h3 class="sub">Sharing</h3>' +
      '<label class="swtch"><input type="checkbox" data-act="toggle-gmedit" data-c="' + c.id + '" ' + (c.allowGmEdit?"checked":"") + '> Let the GM edit this sheet</label>' +
      '<p class="tiny muted" style="margin:6px 0 0">The GM can always read your sheet. Editing stays off until you turn it on.</p></div>';
  }
  return h;
}

/* small helpers for bound fields */
function fld(label, type, key, val, ed, cid, extra){
  return '<div><label class="fl">' + esc(label) + '</label>' +
    '<input type="' + type + '" data-fk="' + key + cid + '" data-bind="' + key + '" data-c="' + cid + '" ' +
    (ed ? "" : "disabled") + ' value="' + esc(val) + '" ' + (extra||"") + '></div>';
}
function sel(key, opts, val, ed, cid){
  return '<select data-fk="' + key + cid + '" data-bind="' + key + '" data-c="' + cid + '" ' + (ed?"":"disabled") + '>' +
    opts.map(o => '<option value="' + esc(o[0]) + '" ' + (String(o[0]) === String(val) ? "selected" : "") + '>' + esc(o[1]) + '</option>').join("") +
    '</select>';
}
function stepper(act, key, val, ed, cid, min, max){
  return '<span class="stepper">' +
    '<button data-act="' + act + '" data-k="' + key + '" data-d="-1" data-c="' + cid + '" ' + (ed && val > (min==null?-99:min) ? "" : "disabled") + '>−</button>' +
    '<span class="val">' + val + '</span>' +
    '<button data-act="' + act + '" data-k="' + key + '" data-d="1" data-c="' + cid + '" ' + (ed && (max==null || val < max) ? "" : "disabled") + '>+</button></span>';
}

/* ---------- stats and saves ---------------------------------------------- */
function viewStats(c){
  const ed = canEditChar(c);
  const avail = xpAvailable(c);
  let h = '<div class="banner"><span>Stats and saves</span></div>';
  h += '<p class="tiny muted" style="margin-top:-6px">Attributes cost 1 XP per point. Saves and combat stats cost 2 XP per point. ' +
       'You have <b>' + avail + '</b> XP left.</p>';

  h += '<div class="grid g2">';

  /* attributes */
  h += '<div class="card"><h2 class="sec">Attributes</h2>' +
    '<table class="t"><thead><tr><th>Attribute</th><th class="num">Score</th><th class="num">Mod</th><th class="num">Temp</th></tr></thead><tbody>';
  ATTRS.forEach(a => {
    const sc = num(c.attrs[a.k],10);
    h += '<tr><td style="font-family:var(--f-cond);font-weight:700;letter-spacing:.05em;text-transform:uppercase">' + esc(a.n) + '</td>' +
      '<td class="num">' + stepper("attr", a.k, sc, ed, c.id, 0, null) + '</td>' +
      '<td class="num"><span class="total">' + sign(attrMod(sc)) + '</span></td>' +
      '<td class="num"><input type="number" data-fk="at' + a.k + c.id + '" data-bind="attrTemp.' + a.k + '" data-c="' + c.id + '" ' +
        (ed?"":"disabled") + ' value="' + num(c.attrTemp[a.k],0) + '" style="width:54px;text-align:center"></td></tr>';
  });
  h += '</tbody></table>' +
    '<p class="tiny muted" style="margin:8px 0 0">Everything starts at 10. Dropping below 10 refunds XP and gives you a negative modifier. ' +
    'Temp is for expression and gear effects — it never costs XP.</p></div>';

  /* saves */
  h += '<div class="card"><h2 class="sec">Saves</h2>' +
    '<table class="t"><thead><tr><th>Save</th><th class="num">Base</th><th class="num">Attr</th><th class="num">Misc</th><th class="num">Total</th></tr></thead><tbody>';
  SAVES.forEach(s => {
    h += '<tr><td style="font-family:var(--f-cond);font-weight:700;letter-spacing:.05em;text-transform:uppercase">' + esc(s.n) + '</td>' +
      '<td class="num">' + stepper("save", s.k, num(c.saveBase[s.k],0), ed, c.id, 0, null) + '</td>' +
      '<td class="num muted">' + sign(attrModOf(c, s.attr)) + ' <span class="tiny">' + s.attr + '</span></td>' +
      '<td class="num"><input type="number" data-fk="sm' + s.k + c.id + '" data-bind="saveMisc.' + s.k + '" data-c="' + c.id + '" ' +
        (ed?"":"disabled") + ' value="' + num(c.saveMisc[s.k],0) + '" style="width:54px;text-align:center"></td>' +
      '<td class="num"><span class="total">' + sign(saveTotal(c, s.k)) + '</span></td></tr>';
  });
  h += '</tbody></table>';
  if(dmgPenalty(c)) h += '<p class="tiny" style="margin:8px 0 0;color:var(--red)">Injury penalty of ' + dmgPenalty(c) + ' is already included.</p>';
  h += '</div></div>';

  /* combat */
  h += '<div class="card" style="margin-top:12px"><h2 class="sec">Combat</h2>' +
    '<div class="tw"><table class="t"><thead><tr><th>Stat</th><th class="num">Base</th><th class="num">Bought</th><th class="num">Attribute</th><th class="num">Expression</th><th class="num">Total</th></tr></thead><tbody>';
  COMBAT.forEach(k => {
    const attrPart = k.attr ? (k.half ? Math.floor(attrModOf(c,k.attr)/2) : attrModOf(c,k.attr)) : null;
    h += '<tr><td style="font-family:var(--f-cond);font-weight:700;letter-spacing:.05em;text-transform:uppercase">' + esc(k.n) + '</td>' +
      '<td class="num muted">' + (k.base || "—") + '</td>' +
      '<td class="num">' + stepper("combat", k.k, num(c.combat[k.k],0), ed, c.id, 0, null) + '</td>' +
      '<td class="num muted">' + (attrPart == null ? "—" : sign(attrPart) + ' <span class="tiny">' + (k.half ? "½ " : "") + k.attr + '</span>') + '</td>' +
      '<td class="num"><input type="number" data-fk="ce' + k.k + c.id + '" data-bind="combatExpr.' + k.k + '" data-c="' + c.id + '" ' +
        (ed?"":"disabled") + ' value="' + num(c.combatExpr[k.k],0) + '" style="width:54px;text-align:center"></td>' +
      '<td class="num"><span class="total">' + (k.k === "defense" ? combatTotal(c,k.k) : sign(combatTotal(c,k.k))) + '</span></td></tr>';
  });
  h += '</tbody></table></div>' +
    '<p class="tiny muted" style="margin:8px 0 0">Defense is the only stat with a base of 10. Melee and Ranged are flat totals — no attribute is added. ' +
    'Initiative keeps its Dexterity modifier and Soak keeps half your Constitution bonus, as printed on the sheet.</p>' +
    '<p class="tiny muted" style="margin:5px 0 0">To soak, beat 15 + the damage modifier. Every 5 you fail by is another level of damage.</p></div>';

  return h;
}
/* ---------- skills -------------------------------------------------------- */
function viewSkills(c){
  const ed = canEditChar(c);
  let ranks = 0;
  Object.values(c.skills).forEach(e => ranks += Math.max(0, num(e.ranks,0)));
  c.subSkills.forEach(e => ranks += Math.max(0, num(e.ranks,0)));
  let h = '<div class="banner"><span>Skills</span></div>';
  h += '<p class="tiny muted" style="margin-top:-6px">1 XP buys 2 ranks. You have <b>' + ranks + '</b> ranks costing <b>' +
       Math.ceil(ranks/2) + '</b> XP, and <b>' + xpAvailable(c) + '</b> XP left. ' +
       'A skill with at least 1 rank counts as trained, so a natural 20 on it succeeds to the highest level possible.</p>';

  h += '<div class="card"><div class="tw"><table class="t"><thead><tr>' +
    '<th>Skill</th><th class="num">Key</th><th class="num">Ranks</th><th class="num">Attr</th><th class="num">Misc</th><th class="num">Total</th><th></th></tr></thead><tbody>';

  SKILLS.forEach(def => {
    if(def.sub){
      const rows = c.subSkills.filter(x => x.key === def.k);
      rows.forEach(x => { h += skillRow(c, def, x, ed, true); });
      h += '<tr><td colspan="7" style="padding:4px 5px">' +
        (ed ? '<button class="btn ghost sm" data-act="addsub" data-k="' + def.k + '" data-c="' + c.id + '">Add a ' + esc(def.n.toLowerCase()) + ' ' + esc(def.sub) + '</button>' : '') +
        ' <span class="tiny muted">' + esc(SKILL_DESC[def.k]) + '</span></td></tr>';
    } else {
      h += skillRow(c, def, c.skills[def.k] || {ranks:0,misc:0}, ed, false);
    }
  });
  h += '</tbody></table></div></div>';
  return h;
}

function skillRow(c, def, entry, ed, isSub){
  const total = skillTotal(c, def.k, entry);
  const key = isSub ? entry.id : def.k;
  const label = isSub ? (entry.label || def.n) : def.n;
  const attrLabel = def.attr.map(a => a.toUpperCase()).join("/");
  const trained = num(entry.ranks,0) > 0;
  return '<tr>' +
    '<td>' + (isSub
      ? '<input type="text" data-fk="sl' + entry.id + '" data-bind="sub.label" data-id="' + entry.id + '" data-c="' + c.id + '" ' +
        (ed?"":"disabled") + ' value="' + esc(entry.label||"") + '" placeholder="' + esc(def.n + " — " + def.sub) + '" style="max-width:190px">'
      : '<span title="' + esc(SKILL_DESC[def.k]) + '" style="' + (trained ? "font-weight:600" : "") + '">' + esc(label) + '</span>') + '</td>' +
    '<td class="num tiny muted">' + attrLabel + '</td>' +
    '<td class="num">' + (isSub
      ? stepperSub(entry.id, num(entry.ranks,0), ed, c.id)
      : stepper("rank", def.k, num(entry.ranks,0), ed, c.id, 0, null)) + '</td>' +
    '<td class="num muted">' + sign(bestAttrMod(c, def.attr)) + '</td>' +
    '<td class="num"><input type="number" data-fk="km' + key + c.id + '" data-bind="' + (isSub ? "sub.misc" : "skillmisc." + def.k) + '" ' +
      'data-id="' + key + '" data-c="' + c.id + '" ' + (ed?"":"disabled") + ' value="' + num(entry.misc,0) + '" style="width:52px;text-align:center"></td>' +
    '<td class="num"><span class="total">' + sign(total) + '</span></td>' +
    '<td class="num">' + (isSub && ed ? '<button class="btn ghost sm" data-act="delsub" data-id="' + entry.id + '" data-c="' + c.id + '">×</button>' : '') + '</td>' +
    '</tr>';
}
function stepperSub(id, val, ed, cid){
  return '<span class="stepper">' +
    '<button data-act="subrank" data-id="' + id + '" data-d="-1" data-c="' + cid + '" ' + (ed && val > 0 ? "" : "disabled") + '>−</button>' +
    '<span class="val">' + val + '</span>' +
    '<button data-act="subrank" data-id="' + id + '" data-d="1" data-c="' + cid + '" ' + (ed?"":"disabled") + '>+</button></span>';
}

/* ---------- expressions list --------------------------------------------- */
function viewExpressions(c){
  if(S.forge) return viewForge(c);
  const ed = canEditChar(c);
  const used = slotsUsed(c), total = slotsTotal(c);
  const st = STYLES[c.styleKey];
  let h = '<div class="banner"><span>Expressions</span></div>';
  h += '<div class="row" style="margin-top:-4px;margin-bottom:12px">' +
    '<span class="chip ' + (used > total ? "bad" : "hi") + '">Slots <b>' + used + ' / ' + total + '</b></span>' +
    '<span class="chip">Proficiency 1 fills 1 slot, 2 fills 2, 3 fills all 3</span>' +
    (ed ? '<span class="right"><button class="btn ghost sm" data-act="buyslot" data-c="' + c.id + '">Buy a slot — 10 XP</button></span>' : '') +
    '</div>';

  if(ed){
    h += '<div class="card tape" style="margin-bottom:14px"><h3 class="sub">Build a new expression</h3>' +
      '<p class="tiny muted" style="margin:0 0 9px">Start with what you want it to do for your character, then work out how ' +
      esc(st.power.toLowerCase()) + ' gets you there.</p>' +
      '<div class="row">' +
      [1,2,3].map(p => '<button class="btn ' + (p===1?"primary":"") + '" data-act="forge-new" data-p="' + p + '" data-c="' + c.id + '"' +
        (p > S.campaign.prof ? ' title="Above the campaign level — the GM will see it flagged"' : '') +
        '>Proficiency ' + p + '</button>').join("") +
      '</div></div>';
  }

  if(!c.expressions.length){
    h += '<div class="empty"><p>No expressions yet. You have limitless potential and nothing to show for it.</p></div>';
    return h;
  }

  c.expressions.forEach(e => {
    const d = computeDebt(e);
    const act = actionOf(e);
    const r = RANGES.find(x => x.k === e.range) || RANGES[0];
    h += '<div class="card" style="margin-bottom:10px">' +
      '<div class="row">' +
      '<b style="font-family:var(--f-display);font-size:17px;font-weight:400">' + esc(e.name || "Untitled expression") + '</b>' +
      '<span class="pill p' + e.prof + '">P' + e.prof + '</span>' +
      '<span class="pill ' + e.status + '">' + statusLabel(e.status) + '</span>' +
      (e.isExpansion ? '<span class="pill draft">Expansion</span>' : '') +
      '<span class="right row" style="gap:6px">' +
      (ed ? '<button class="btn ghost sm" data-act="forge-edit" data-e="' + e.id + '" data-c="' + c.id + '">Edit</button>' : '') +
      (ed && e.status !== "pending" ? '<button class="btn sm" data-act="submit-expr" data-e="' + e.id + '" data-c="' + c.id + '">Send to GM</button>' : '') +
      (ed ? '<button class="btn ghost sm danger" data-act="del-expr" data-e="' + e.id + '" data-c="' + c.id + '">Delete</button>' : '') +
      '</span></div>' +
      '<div class="row tiny muted" style="gap:10px;margin:5px 0 7px">' +
      '<span>' + esc(e.power) + '</span><span>' + ACTIONS[act] + ' action</span><span>' + esc(r.n) + '</span>' +
      '<span><b style="color:var(--red);font-size:14px">' + nf(d.final) + '</b> debt</span>' +
      (e.tradeoff ? '<span>Traded: ' + nf(d.monthly) + ' monthly, ' + nf(d.activation) + ' to activate</span>' : '') +
      '</div>' +
      (e.desc ? '<p class="hand" style="margin:0 0 7px">' + esc(e.desc) + '</p>' : '') +
      condSummary(e) +
      (e.gmNote ? '<p class="tiny" style="margin:7px 0 0;padding:6px 9px;background:var(--red-wash);border-radius:3px;color:var(--red-ink)"><b>GM:</b> ' + esc(e.gmNote) + '</p>' : '') +
      '</div>';
  });
  return h;
}

function statusLabel(s){
  return {draft:"Draft", pending:"Waiting on the GM", approved:"Approved", changes:"Changes requested"}[s] || s;
}
function condSummary(e){
  const bits = [];
  if(e.linkPort || e.linkDist) bits.push("Linked" + (e.linkObject ? " to " + e.linkObject : ""));
  (e.conds||[]).forEach(c => bits.push(c.text || (COND_TIERS.find(t=>t.v===num(c.v,0))||{}).n));
  if(num(e.condSave,0)) bits.push((COND_SAVE.find(x=>x.v===num(e.condSave,0))||{}).n);
  (e.limits||[]).forEach(c => bits.push(c.text || (LIMIT_TIERS.find(t=>t.v===num(c.v,0))||{}).n));
  if(e.aoeFeet) bits.push(e.aoeFeet + " ft area");
  if(e.loops) bits.push("Loops ×" + e.loops);
  if(!bits.length) return "";
  return '<div class="row" style="gap:5px">' + bits.map(b => '<span class="chip">' + esc(b) + '</span>').join("") + '</div>';
}

/* ---------- the forge ----------------------------------------------------- */
function viewForge(c){
  const e = S.forge;
  const d = computeDebt(e);
  const power = e.power;
  const scales = SCALES[power] || [];
  const guided = e.prof === 1;
  const st = STYLES[c.styleKey];

  let h = '<div class="row" style="margin-bottom:10px">' +
    '<div class="banner" style="margin:0"><span>Expression forge</span></div>' +
    '<span class="right"><button class="btn ghost sm" data-act="forge-cancel">Cancel</button></span></div>';
  h += '<p class="tiny muted" style="margin:-4px 0 12px">' + esc(power) + ' · proficiency ' + e.prof + ' · ' + esc(PROF_TEXT[e.prof]) + '</p>';

  h += '<div class="grid" style="grid-template-columns:minmax(0,1fr) minmax(0,258px);align-items:start">';

  /* ---- left column ---- */
  h += '<div>';

  /* 1. concept */
  h += '<div class="card"><h2 class="sec">1. Concept</h2>' +
    '<label class="fl">Name it</label>' +
    '<input type="text" data-fk="fname" data-forge="name" value="' + esc(e.name) + '" placeholder="Hush the Footfall">' +
    '<label class="fl" style="margin-top:9px">What does it do?</label>' +
    '<textarea data-fk="fdesc" data-forge="desc" placeholder="Start with how this helps you play your character, then link it to ' +
      esc(power.toLowerCase()) + '.">' + esc(e.desc) + '</textarea>' +
    '<div class="row" style="margin-top:9px">' +
    '<label class="swtch"><input type="checkbox" data-forge="isExpansion" ' + (e.isExpansion?"checked":"") + '> This expands an expression I already have</label>' +
    '</div>' +
    (e.isExpansion ? '<div style="margin-top:8px"><label class="fl">Expanding which one?</label>' +
      '<select data-forge="parentId">' + '<option value="">Pick one</option>' +
      c.expressions.filter(x => x.id !== e.id && !x.isExpansion).map(x =>
        '<option value="' + x.id + '" ' + (x.id === e.parentId ? "selected" : "") + '>' + esc(x.name || "Untitled") + ' (p' + x.prof + ')</option>').join("") +
      '</select><p class="tiny muted" style="margin:5px 0 0">Half price, no new slot, and it has to use the same elements. ' +
      'Expansions can rank down but never up.</p></div>' : "") +
    '</div>';

  /* 2. scale */
  h += '<div class="card" style="margin-top:12px"><h2 class="sec">2. Link it to your ability</h2>';
  if(!guided){
    h += '<p class="tiny muted" style="margin:0 0 9px">Proficiency ' + e.prof + ' is deliberately freeform. ' +
      (e.prof === 2
        ? 'Pick your own measurement scale — it has to start at the lowest commonly used version of that unit — and set what one step costs. The book suggests +2 per step for metaphorical Mass.'
        : 'Keep a small thematic tie-in and name your own price. This one needs the GM to sign off.') + '</p>' +
      '<div class="grid g2">' +
      '<div><label class="fl">Your scale, and what a step costs</label>' +
      '<input type="text" data-fk="fcn" data-forge="customNote" value="' + esc(e.customNote) + '" placeholder="+2 debt per inch of shadow removed"></div>' +
      '<div><label class="fl">Core cost before mods</label>' +
      '<input type="number" data-fk="fcc" data-forge="customCore" value="' + (e.customCore == null ? "" : e.customCore) + '" placeholder="' + PROF_BASE[e.prof] + '"></div>' +
      '</div><p class="tiny muted" style="margin:7px 0 0">Leave the cost blank to use the proficiency ' + e.prof + ' base of ' + PROF_BASE[e.prof] + ' debt.</p>';
  } else if(power === "Endings"){
    h += '<p class="tiny muted" style="margin:0 0 9px">Endings scales by how likely the ending already was. These tiers are self-contained — they replace the base debt.</p>';
    ENDINGS_TIERS.forEach(t => {
      h += '<label class="swtch" style="display:flex;align-items:flex-start;gap:9px;padding:6px 0;border-bottom:1px solid var(--rule)">' +
        '<input type="radio" name="etier" data-forge="tier" value="' + t.v + '" ' + (num(e.tier,30) === t.v ? "checked" : "") + ' style="margin-top:3px">' +
        '<span><b>' + t.v + ' debt — ' + esc(t.n) + '</b><br><span class="tiny muted">' + esc(t.ex) + '</span></span></label>';
    });
    h += '<label class="swtch" style="margin-top:10px"><input type="checkbox" data-forge="living" ' + (e.living?"checked":"") +
      '> Used on a living or sentient creature <span class="tiny muted">(+20 debt, applied before reductions)</span></label>';
  } else {
    h += '<p class="tiny muted" style="margin:0 0 9px">Set only the scales you actually use. Everything else stays at zero.</p>';
    scales.forEach(s => {
      const v = num(e.scales[s.k],0);
      let unit = s.unit;
      if(e.tradeoff && s.tradeUnit) unit = s.tradeUnit;
      const cost = s.banded ? bandedCost(v, s.banded) : Math.ceil(v * s.per);
      h += '<div style="padding:8px 0;border-bottom:1px solid var(--rule)">' +
        '<div class="row"><label class="fl" style="margin:0;flex:1">' + esc(s.n) + '</label>' +
        '<span class="tiny muted">' + (cost ? "+" + nf(cost) + " debt" : "—") + '</span></div>' +
        '<div class="row" style="margin-top:4px">' +
        '<input type="number" data-fk="fs' + s.k + '" data-forge="scale.' + s.k + '" value="' + v + '" step="' + (s.step||1) + '" min="0" style="max-width:130px">' +
        '<span class="tiny muted">' + esc(unit) + (e.tradeoff && s.tradeMult ? " × " + s.tradeMult : "") + '</span></div>' +
        '<p class="tiny muted" style="margin:4px 0 0">' + esc(s.hint) + '</p></div>';
    });
    if(power === "Flow"){
      h += '<div style="padding:8px 0"><label class="fl">Velocity multiplier</label>' +
        '<div class="row"><input type="number" data-fk="fvel" data-forge="velocity" value="' + Math.max(1,num(e.velocity,1)) + '" min="1" step="1" style="max-width:100px">' +
        '<span class="tiny muted">× — multiplies the seconds cost only, before any reductions</span></div></div>';
    }
    const pt = predictedTier(e, S.campaign.tiers);
    if(pt){
      h += '<div style="margin-top:10px;padding:9px 11px;background:var(--blue-wash);border-radius:3px">' +
        '<b>Damage tier ' + pt.t + ' — ' + esc(pt.n) + '</b><br>' +
        '<span class="tiny">' + esc(tierEffect(pt)) + '. House rule, editable by the GM in campaign settings.</span></div>';
    }
  }
  h += '</div>';

  /* 3. universal mods */
  h += '<div class="card" style="margin-top:12px"><h2 class="sec">3. Universal mods</h2>' +
    '<div class="grid g2">';
  if(power !== "Law"){
    h += '<div><label class="fl">Area of effect — +1 debt per foot</label>' +
      '<input type="number" data-fk="faoe" data-forge="aoeFeet" value="' + num(e.aoeFeet,0) + '" min="0"></div>' +
      '<div><label class="fl">Of that, mutable shape — doubles those feet</label>' +
      '<input type="number" data-fk="faom" data-forge="aoeMutable" value="' + num(e.aoeMutable,0) + '" min="0" max="' + num(e.aoeFeet,0) + '"></div>';
  } else {
    h += '<div style="grid-column:1/-1"><p class="tiny muted" style="margin:0">Law can\'t take the area of effect mod — its own distance scale covers that.</p></div>';
  }
  h += '<div><label class="fl">Offset origin — +1 debt per foot</label>' +
    '<input type="number" data-fk="foff" data-forge="offsetFeet" value="' + num(e.offsetFeet,0) + '" min="0"></div>' +
    '<div><label class="fl">Looping — +10 debt each, max 10</label>' +
    '<input type="number" data-fk="flp" data-forge="loops" value="' + num(e.loops,0) + '" min="0" max="10"></div>';
  if(["Lumen","Mass","Flow","Exchange"].includes(power)){
    h += '<div><label class="fl">Escalate — doubles the running total per step</label>' +
      '<input type="number" data-fk="fesc" data-forge="escalate" value="' + num(e.escalate,0) + '" min="0" max="8"></div>' +
      '<div style="align-self:end"><p class="tiny muted" style="margin:0">Each step moves you up a unit — inches to feet, one degree to ten.</p></div>';
  }
  h += '</div></div>';

  /* 4. conditions and limitations */
  h += '<div class="card" style="margin-top:12px"><h2 class="sec">4. Conditions and limitations</h2>' +
    '<p class="tiny muted" style="margin:0 0 11px">These bring the cost down. They can\'t cancel each other out — they have to work together. ' +
    'Your action type comes out of whatever you pick here.</p>';

  h += '<h3 class="sub">Range</h3><select data-forge="range">' +
    RANGES.map(r => '<option value="' + r.k + '" ' + (e.range === r.k ? "selected" : "") + '>' +
      esc(r.n) + (r.v ? " (" + r.v + ")" : " (default, no reduction)") + ' — ' + esc(r.d) + '</option>').join("") + '</select>';

  h += '<h3 class="sub" style="margin-top:13px">Linked object</h3><div class="grid g2">' +
    '<div><label class="fl">How portable?</label><select data-forge="linkPort">' +
      LINK_PORT.map(o => '<option value="' + o.v + '" ' + (num(e.linkPort,0)===o.v?"selected":"") + '>' + esc(o.n) + (o.v?" ("+o.v+")":"") + '</option>').join("") + '</select></div>' +
    '<div><label class="fl">How distinctive?</label><select data-forge="linkDist">' +
      LINK_DIST.map(o => '<option value="' + o.v + '" ' + (num(e.linkDist,0)===o.v?"selected":"") + '>' + esc(o.n) + (o.v?" ("+o.v+")":"") + '</option>').join("") + '</select></div>' +
    '</div>' +
    ((e.linkPort || e.linkDist) ? '<div style="margin-top:8px"><label class="fl">The object</label>' +
      '<input type="text" data-fk="flo" data-forge="linkObject" value="' + esc(e.linkObject) + '" placeholder="A pair of worn-out sneakers"></div>' : "");

  h += '<h3 class="sub" style="margin-top:13px">Conditions</h3>';
  (e.conds||[]).forEach((cd, i) => {
    h += '<div class="row" style="margin-bottom:6px">' +
      '<select data-forge="cond.v.' + i + '" style="max-width:220px">' +
        COND_TIERS.map(t => '<option value="' + t.v + '" ' + (num(cd.v,0)===t.v?"selected":"") + '>' + esc(t.n) + ' (' + t.v + ') — ' + esc(t.d) + '</option>').join("") + '</select>' +
      '<input type="text" data-fk="fcd' + i + '" data-forge="cond.text.' + i + '" value="' + esc(cd.text||"") + '" placeholder="Knowing the target\'s full name" style="flex:1">' +
      '<button class="btn ghost sm" data-act="forge-delcond" data-i="' + i + '">×</button></div>';
  });
  h += '<button class="btn ghost sm" data-act="forge-addcond">Add a condition</button>';
  h += '<div style="margin-top:9px"><label class="fl">Or tie it to a saving throw</label><select data-forge="condSave">' +
    COND_SAVE.map(o => '<option value="' + o.v + '" ' + (num(e.condSave,0)===o.v?"selected":"") + '>' + esc(o.n) + (o.v?" ("+o.v+")":"") + '</option>').join("") + '</select></div>';

  h += '<h3 class="sub" style="margin-top:13px">Limitations</h3>';
  (e.limits||[]).forEach((cd, i) => {
    h += '<div class="row" style="margin-bottom:6px">' +
      '<select data-forge="limit.v.' + i + '" style="max-width:220px">' +
        LIMIT_TIERS.map(t => '<option value="' + t.v + '" ' + (num(cd.v,0)===t.v?"selected":"") + '>' + esc(t.n) + ' (' + t.v + ') — ' + esc(t.d) + '</option>').join("") + '</select>' +
      '<input type="text" data-fk="fli' + i + '" data-forge="limit.text.' + i + '" value="' + esc(cd.text||"") + '" placeholder="Only after sundown" style="flex:1">' +
      '<button class="btn ghost sm" data-act="forge-dellimit" data-i="' + i + '">×</button></div>';
  });
  h += '<button class="btn ghost sm" data-act="forge-addlimit">Add a limitation</button>';
  h += '</div>';

  /* 5. debt trade off */
  h += '<div class="card" style="margin-top:12px"><h2 class="sec">5. Debt trade off</h2>' +
    '<label class="swtch"><input type="checkbox" data-forge="tradeoff" ' + (e.tradeoff?"checked":"") +
    '> Turn this cost into permanent monthly rent</label>' +
    '<p class="tiny muted" style="margin:7px 0 0">You pay it every month whether you use the expression or not, but the scaling gets much better and ' +
    'activation only costs 20% of the monthly figure, rounded up. ' +
    (e.prof === 3 ? "At proficiency 3 this needs to be discussed with your GM." : "") + '</p>' +
    (e.tradeoff && e.prof <= 2 ? '<p class="tiny" style="margin:7px 0 0"><b>Better scaling at proficiency ' + e.prof + ':</b> ' + esc(tradeText(power, e.prof)) + '</p>' : "") +
    '</div>';

  /* reference */
  if(guided && REF[power]){
    h += refBlock(power);
    if(power === "Mass"){ h += refBlock("MassGal"); h += refBlock("MassDensity"); }
    if(power === "Lumen"){ h += refBlock("LumenVolt"); h += refBlock("LumenTesla"); }
    if(power === "Exchange"){ h += refBlock("ExchangeNewton"); h += refBlock("ExchangeCelsius"); }
  }

  h += '</div>';

  /* ---- right column: the ledger ---- */
  h += '<div style="position:sticky;top:96px">';
  h += '<div class="card"><h3 class="sub">Debt</h3>' +
    '<p class="bigdebt" style="margin:0 0 3px">' + nf(d.final) + '</p>' +
    '<p class="tiny muted" style="margin:0 0 10px">' + ACTIONS[actionOf(e)] + ' action · ' +
      esc((RANGES.find(x=>x.k===e.range)||RANGES[0]).n.toLowerCase()) + '</p>';
  if(e.tradeoff){
    h += '<div style="padding:8px 10px;background:var(--gold-wash);border-radius:3px;margin-bottom:10px">' +
      '<b>' + nf(d.monthly) + '</b> monthly rent<br><b>' + nf(d.activation) + '</b> to activate</div>';
  }
  h += '<div class="ledger">' +
    d.lines.map(l => '<div class="li"><span>' + esc(l[0]) + '</span><span>' + (l[1] >= 0 ? "+" : "") + nf(l[1]) + '</span></div>').join("") +
    '<div class="li sum"><span>Final debt</span><span>' + nf(d.final) + '</span></div></div>';
  if(d.floored) h += '<p class="tiny" style="margin:8px 0 0;color:var(--red)">Reductions took this below 1. No power is free — the floor is 1 debt.</p>';
  h += '</div>';

  h += '<div class="card" style="margin-top:10px"><h3 class="sub">Slots</h3>' +
    '<p class="tiny" style="margin:0">' + (e.isExpansion
      ? "An expansion takes no slot."
      : "This takes <b>" + e.prof + "</b> of your " + slotsTotal(c) + " slots. " +
        (slotsUsed(c) - (c.expressions.find(x=>x.id===e.id) ? num(c.expressions.find(x=>x.id===e.id).prof,0) : 0) + e.prof > slotsTotal(c)
          ? '<span style="color:var(--red)">That puts you over. Buy a slot for 10 XP or drop something.</span>' : "")) + '</p></div>';

  h += '<div class="card" style="margin-top:10px">' +
    '<button class="btn primary" style="width:100%" data-act="forge-save">Save to my sheet</button>' +
    '<button class="btn" style="width:100%;margin-top:7px" data-act="forge-submit">Save and send to the GM</button>' +
    '</div>';
  h += '</div></div>';
  return h;
}

function tradeText(power, prof){
  const t1 = {Endings:"the likelihood tier is halved", Flow:"seconds become minutes", Mass:"the base scale multiplies by 10",
    Law:"duration scales in minutes and distance in 5 foot steps", Lumen:"the base scale multiplies by 10", Exchange:"the base scale multiplies by 10"};
  const t2 = {Endings:"the likelihood tier is divided by 3", Flow:"all debt incurred is halved", Mass:"the base scale multiplies by 10",
    Law:"duration scales in 10 minute steps and distance in 5 foot steps", Lumen:"the base scale multiplies by 10", Exchange:"the base scale multiplies by 10"};
  return (prof === 1 ? t1 : t2)[power] || "";
}

function refBlock(key){
  const r = REF[key]; if(!r) return "";
  return '<details class="card" style="margin-top:12px"><summary style="cursor:pointer;font-family:var(--f-cond);font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:12px;color:var(--ink-2)">' +
    esc(r.title) + '</summary><div class="tw" style="margin-top:9px"><table class="t"><thead><tr>' +
    r.cols.map(c => '<th>' + esc(c) + '</th>').join("") + '</tr></thead><tbody>' +
    r.rows.map(row => '<tr>' + row.map(cell => '<td>' + esc(cell) + '</td>').join("") + '</tr>').join("") +
    '</tbody></table></div></details>';
}
/* ---------- equipment ----------------------------------------------------- */
function allGear(){ return GEAR.concat((S.campaign && S.campaign.gear) || []); }

function viewGear(c){
  const ed = canEditChar(c);
  const res = num(c.bg.resources,0);
  const cats = ["Melee","Ranged","Explosive","Armor","Comms","Kit"];
  let h = '<div class="banner"><span>Equipment</span></div>';
  h += '<p class="tiny muted" style="margin-top:-6px">Gear costs no XP. What you can simply have is gated on your Resources background, ' +
    'currently level <b>' + res + '</b>. Everyday items are free to anyone. Anything above your level you have to acquire in play — the GM decides how.</p>';

  h += '<div class="card"><h3 class="sub">Carried</h3>';
  if(!c.gear.length) h += '<p class="tiny muted" style="margin:0">Nothing equipped.</p>';
  else {
    h += '<div class="tw"><table class="t"><thead><tr><th>Item</th><th>Effect</th><th>Note</th><th></th></tr></thead><tbody>';
    c.gear.forEach((g, i) => {
      const def = allGear().find(x => x.id === g.id);
      if(!def) return;
      h += '<tr><td><b>' + esc(def.n) + '</b><div class="tiny muted">' + esc(def.cat) + '</div></td>' +
        '<td>' + (def.dmg !== "—" ? '<b>' + esc(def.dmg) + '</b>. ' : "") + esc(def.note) + '</td>' +
        '<td><input type="text" data-fk="gn' + i + c.id + '" data-bind="gear.note." data-i="' + i + '" data-c="' + c.id + '" ' +
          (ed?"":"disabled") + ' value="' + esc(g.note||"") + '" placeholder="Nickname, ammo, condition"></td>' +
        '<td>' + (ed ? '<button class="btn ghost sm" data-act="delgear" data-i="' + i + '" data-c="' + c.id + '">×</button>' : '') + '</td></tr>';
    });
    h += '</tbody></table></div>';
  }
  h += '</div>';

  cats.forEach(cat => {
    const items = allGear().filter(g => g.cat === cat);
    if(!items.length) return;
    h += '<div class="card" style="margin-top:12px"><h2 class="sec">' + esc(cat) + '</h2><div class="tw"><table class="t">' +
      '<thead><tr><th>Item</th><th>Examples</th><th>Damage</th><th>Notes</th><th class="num">Res</th><th></th></tr></thead><tbody>';
    items.forEach(g => {
      const locked = num(g.res,1) > res;
      h += '<tr style="' + (locked ? "opacity:.55" : "") + '"><td><b>' + esc(g.n) + '</b>' +
        (g.canon ? "" : ' <span class="tiny muted">house</span>') + '</td>' +
        '<td class="tiny muted">' + esc(g.ex) + '</td>' +
        '<td>' + esc(g.dmg) + '</td>' +
        '<td class="tiny">' + esc(g.note) + '</td>' +
        '<td class="num">' + num(g.res,1) + '</td>' +
        '<td>' + (ed ? '<button class="btn ghost sm" data-act="addgear" data-g="' + g.id + '" data-c="' + c.id + '">' +
          (locked ? "Acquire" : "Take") + '</button>' : '') + '</td></tr>';
    });
    h += '</tbody></table></div></div>';
  });

  if(isGM()){
    h += '<div class="card" style="margin-top:12px"><h2 class="sec">Add a custom item</h2>' +
      '<p class="tiny muted" style="margin:0 0 9px">Follow the same paradigm: a damage type and modifier, or a flat number of levels.</p>' +
      '<div class="grid g2">' +
      '<div><label class="fl">Name</label><input type="text" id="cgn" data-fk="cgn"></div>' +
      '<div><label class="fl">Category</label><select id="cgc">' + cats.map(x => '<option>' + x + '</option>').join("") + '</select></div>' +
      '<div><label class="fl">Examples</label><input type="text" id="cge" data-fk="cge"></div>' +
      '<div><label class="fl">Damage</label><input type="text" id="cgd" data-fk="cgd" placeholder="Bashing +3, or Lethal, 1 level"></div>' +
      '<div style="grid-column:1/-1"><label class="fl">Notes</label><input type="text" id="cgnote" data-fk="cgnote"></div>' +
      '<div><label class="fl">Resources level</label><select id="cgr"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></div>' +
      '</div><div class="row" style="margin-top:10px"><button class="btn primary" data-act="addcustomgear">Add to the campaign</button></div></div>';
  }
  return h;
}

/* ---------- XP ledger ------------------------------------------------------ */

    '<div class="li sum"><span>Total spent</span><span>' + sp.total + '</span></div></div>' +
    '<p class="tiny muted" style="margin:10px 0 0">Attributes 1 XP per point. Saves and combat stats 2 XP per point. ' +
    '1 XP buys 2 skill ranks. Backgrounds 2 XP per level. An extra expression slot is 10 XP.</p></div>';

  h += '<div class="card" style="margin-top:12px"><h2 class="sec">Awards</h2>';
  if(ed || isGM()){
    h += '<div class="row" style="margin-bottom:10px">' +
      '<input type="number" id="xpamt" data-fk="xpamt" value="1" style="max-width:80px">' +
      '<input type="text" id="xpnote" data-fk="xpnote" placeholder="Play of the game" style="flex:1">' +
      '<button class="btn primary sm" data-act="awardxp" data-c="' + c.id + '">Award</button></div>';
